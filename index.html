<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Game Tracker</title>
<style>
:root{
    --green:#28a745;--green-dark:#166534;--blue:#007bff;--red:#dc3545;
    --bg:#f4f4f9;--card:#fff;--muted:#6c757d;--border:#dee2e6;--text:#343a40;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:20px;background:var(--bg);color:#333}
.container{max-width:900px;margin:auto;background:var(--card);padding:25px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h2,h3{color:var(--text)}
.tabs{display:flex;cursor:pointer;margin-bottom:25px;border-bottom:2px solid #e9ecef;gap:4px}
.tab{flex:1;padding:12px 5px;text-align:center;background:#f8f9fa;font-weight:bold;color:var(--muted);font-size:14px;border-radius:8px 8px 0 0;transition:.2s}
.tab.active{background:white;border-bottom:3px solid var(--green);color:var(--green);margin-bottom:-2px}
.tab-content{display:none}.tab-content.active{display:block}
label{font-weight:600;color:#495057;display:block;margin:12px 0 5px;font-size:14px}
input,select,button{width:100%;padding:12px;margin:8px 0 14px;font-size:15px}
input[type=text],input[type=number],select{border:1px solid #ced4da;border-radius:8px;background:#fff}
input[type=file]{padding:8px;border:1px dashed #ced4da;border-radius:8px;background:#f8f9fa}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(40,167,69,.15)}
button{background:var(--green);color:white;border:0;cursor:pointer;font-weight:bold;border-radius:8px;transition:.2s}
button:hover{filter:brightness(.93)}button:disabled{opacity:.55;cursor:not-allowed}
.btn-danger{background:var(--red)}.btn-secondary{background:#6c757d}.btn-info{background:#17a2b8}.btn-blue{background:#007bff}
hr{margin:25px 0;border:0;border-top:1px solid #eee}
.filter-mode-container,.coop-result-container{display:flex;gap:12px;margin-bottom:18px}
.filter-mode-btn,.coop-btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;border:2px solid #ced4da;background:#f8f9fa;color:#495057;margin:0}
.filter-mode-btn.pvp-mode.active{background:#f0f4ff;border-color:var(--blue);color:#0056b3}
.filter-mode-btn.coop-mode.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.filter-mode-btn.all-mode.active{background:#fff8e1;border-color:#ffc107;color:#856404}
.coop-btn.win.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.coop-btn.lose.active{background:#fdf2f2;border-color:var(--red);color:#991b1b}
.players-container{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 20px}
.player-card{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;padding:12px 16px;border-radius:10px;border:2px solid #e9ecef;transition:.2s}
.player-card.selected{background:#f0fdf4;border-color:var(--green);box-shadow:0 2px 8px rgba(40,167,69,.08)}
.player-info{display:flex;align-items:center;gap:14px;cursor:pointer;flex:1}
.player-info input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--green);cursor:pointer}
.player-name{font-size:16px;font-weight:bold;color:var(--text)}
.score-wrapper{display:flex;align-items:center;gap:8px}.score-wrapper span{font-size:13px;font-weight:600;color:var(--muted)}
.player-score-input{width:100px!important;padding:8px 10px!important;margin:0!important;text-align:center;font-weight:bold;font-size:16px;border-radius:6px!important}
.winner-display{background:#f0fdf4;border:2px dashed var(--green);padding:15px;border-radius:10px;text-align:center;font-weight:bold;color:var(--green-dark);margin-bottom:20px;font-size:16px}
.manage-list-item{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;padding:10px 14px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border)}
.manage-list-item span{font-weight:bold}.manage-list-item button{width:auto;padding:6px 14px;margin:0;font-size:13px}
.table-responsive{width:100%;overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{border:1px solid var(--border);padding:9px 10px;text-align:center}th{background:#f1f3f5;font-weight:600}
td.winner-score{background:#d4edda!important;color:#155724;font-weight:bold}
td.tie-score{background:#fff3cd!important;color:#856404;font-weight:bold}
td.coop-win{background:#f0fdf4;color:var(--green-dark);font-weight:bold}td.coop-lose{background:#fdf2f2;color:#991b1b;font-weight:bold}
.game-stats-box{background:#fff;border:1px solid var(--border);padding:18px;margin-bottom:18px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.stats-nav{display:flex;gap:10px;margin:15px 0 18px;flex-wrap:wrap}
.stats-nav-btn{flex:1;min-width:140px;margin:0;background:#f1f3f5;color:#495057;border:2px solid #dee2e6;padding:12px;border-radius:10px}
.stats-nav-btn.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.stats-panel{display:none}.stats-panel.active{display:block}
.detail-filters{background:#f8f9fa;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px}
.filter-title{font-weight:700;margin-bottom:10px;color:#495057}
.stats-scope{display:flex;gap:10px;margin-bottom:10px}
.scope-btn{flex:1;margin:0;background:white;color:#495057;border:2px solid #ced4da}
.scope-btn.active{background:#f0f4ff;border-color:var(--blue);color:#0056b3}
.detail-filters select{margin:0}

.player-selector-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:15px}
.player-filter-btn{background:#f1f3f5;color:#495057;border:2px solid #dee2e6;padding:10px 18px;border-radius:20px;font-weight:bold;white-space:nowrap;margin:0;width:auto;cursor:pointer}
.player-filter-btn.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}

/* Стилове за визуализация на Win rate */
.winrate-bar-container{display:flex;align-items:center;gap:8px;min-width:130px}
.winrate-track{flex:1;background:#e9ecef;height:10px;border-radius:5px;overflow:hidden;position:relative}
.winrate-fill{height:100%;border-radius:5px;transition:width .4s ease}
.winrate-text{font-size:13px;font-weight:bold;min-width:42px;text-align:right}

.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0 25px}
.stat-card{background:#f8f9fa;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:25px;font-weight:800;color:var(--green-dark)}.stat-card .label{font-size:12px;color:var(--muted);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section-title button{width:auto;margin:0;padding:8px 12px;font-size:13px}
.empty{padding:20px;text-align:center;color:#888;background:#f8f9fa;border-radius:10px}
.small{font-size:12px;color:var(--muted)}.success{color:var(--green-dark)}.error{color:#991b1b}
@media(max-width:650px){body{padding:8px}.container{padding:15px}.dashboard{grid-template-columns:repeat(2,1fr)}.tabs{overflow-x:auto}.tab{min-width:110px}.player-card{padding:10px}.score-wrapper span{display:none}}
</style>
<!-- Firebase App (Core) и Firestore (База данни) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD_DjQ3XXZG3PM-yohUpPUXcQdrcDg5biE",
  authDomain: "boardgame-tracker-dafab.firebaseapp.com",
  projectId: "boardgame-tracker-dafab",
  storageBucket: "boardgame-tracker-dafab.appspot.com",
  messagingSenderId: "376292702901",
  appId: "1:376292702901:web:f9c7ccc119654b7a23dcfc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const docRef = doc(db, "boardgame_data", "main_tracker");

let isSaving = false;
let lastKnownUpdated = null;

function ensureLogId(log) {
  if (log.id) return log.id;
  const key = (log.date || '') + '|' + (log.game || '') + '|' + 
    (log.type === 'coop'
      ? ((log.participants || []).join(',') + '|' + (log.coopResult || ''))
      : JSON.stringify(log.scores || {}));
  let hash = 0;
  for (let i = 0; i < key.length; i++) {
    hash = ((hash << 5) - hash) + key.charCodeAt(i);
    hash |= 0;
  }
  return 'old_' + Math.abs(hash).toString(36);
}

async function loadDataFromFirebase() {
  try {
    const snap = await getDoc(docRef);
    if (!snap.exists()) return false;
    const cloud = snap.data();
    if (cloud.myGamesObj) { window.myGamesObj = cloud.myGamesObj; myGamesObj = cloud.myGamesObj; localStorage.setItem('myGamesObj', JSON.stringify(cloud.myGamesObj)); }
    if (cloud.myPlayers) { window.myPlayers = cloud.myPlayers; myPlayers = cloud.myPlayers; localStorage.setItem('myPlayers', JSON.stringify(cloud.myPlayers)); }
    if (cloud.gameLogs) {
      const logsWithId = cloud.gameLogs.map(log => ({ ...log, id: ensureLogId(log) }));
      window.gameLogs = logsWithId; gameLogs = logsWithId;
      localStorage.setItem('gameLogs', JSON.stringify(logsWithId));
    }
    lastKnownUpdated = cloud.lastUpdated || '';
    if (typeof updateUI === 'function') updateUI();
    if (typeof showStats === 'function') showStats();
    return true;
  } catch (error) {
    console.error('Грешка при изтегляне от Firebase:', error);
    return false;
  }
}

onSnapshot(docRef, (docSnap) => {
  if (!docSnap.exists() || isSaving) return;
  const cloud = docSnap.data();
  const cloudUpdated = cloud.lastUpdated || '';
  if (cloudUpdated === lastKnownUpdated) return;

  if (cloud.myGamesObj) { window.myGamesObj = cloud.myGamesObj; myGamesObj = cloud.myGamesObj; localStorage.setItem('myGamesObj', JSON.stringify(cloud.myGamesObj)); }
  if (cloud.myPlayers) { window.myPlayers = cloud.myPlayers; myPlayers = cloud.myPlayers; localStorage.setItem('myPlayers', JSON.stringify(cloud.myPlayers)); }
  if (cloud.gameLogs) {
    const logsWithId = cloud.gameLogs.map(log => ({ ...log, id: ensureLogId(log) }));
    window.gameLogs = logsWithId; gameLogs = logsWithId;
    localStorage.setItem('gameLogs', JSON.stringify(logsWithId));
  }
  lastKnownUpdated = cloudUpdated;
  if (typeof updateUI === 'function') updateUI();
  if (typeof showStats === 'function') showStats();
  if (typeof renderRandomizer === 'function') renderRandomizer();
});

window.saveDataToFirebase = async function () {
  try {
    isSaving = true;
    const logsWithId = gameLogs.map(log => ({ ...log, id: ensureLogId(log) }));
    const payload = {
      myGamesObj: myGamesObj,
      myPlayers: myPlayers,
      gameLogs: logsWithId,
      lastUpdated: new Date().toISOString()
    };
    await setDoc(docRef, payload, { merge: true });
    lastKnownUpdated = payload.lastUpdated;
    gameLogs = logsWithId;
    window.myGamesObj = myGamesObj; window.myPlayers = myPlayers; window.gameLogs = logsWithId;
    localStorage.setItem('myGamesObj', JSON.stringify(myGamesObj));
    localStorage.setItem('myPlayers', JSON.stringify(myPlayers));
    localStorage.setItem('gameLogs', JSON.stringify(logsWithId));
    return true;
  } catch (error) {
    console.error('Грешка при качване във Firebase:', error);
    return false;
  } finally {
    setTimeout(() => { isSaving = false; }, 1000);
  }
};
</script>
</head>
<body>
<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="openTab(event,'log')">Записване</div>
        <div class="tab" onclick="openTab(event,'randomizer')">🎲 Рандомайзер</div>
        <div class="tab" onclick="openTab(event,'stats')">Статистика</div>
        <div class="tab" onclick="openTab(event,'manage')">Добави / Управление</div>
    </div>

    <!-- ТАБ: ЗАПИСВАНЕ -->
    <div id="log" class="tab-content active">
        <h2>Запиши партия</h2>
        <label>Тип игра</label>
        <div class="filter-mode-container">
            <button type="button" class="filter-mode-btn pvp-mode active" id="filterPvpBtn" onclick="setLogFilter('pvp')">⚔️ Състезателни (PvP)</button>
            <button type="button" class="filter-mode-btn coop-mode" id="filterCoopBtn" onclick="setLogFilter('coop')">🤝 Кооперативни (Co-op)</button>
        </div>
        <label>Игра</label>
        <select id="gameSelect" onchange="onGameSelected()"><option value="">-- Избери игра --</option></select>
        <label>Участващи играчи</label>
        <div id="playersCheckboxContainer" class="players-container"><span class="small">Няма добавени играчи още.</span></div>
        <div id="dynamicLogSection"></div>
        <button class="btn-blue" onclick="logGame()" style="padding:14px;font-size:16px">Запиши резултата</button>
        <div id="logStatus" style="margin-top:10px;font-weight:bold;text-align:center"></div>
    </div>

    <!-- ТАБ: РАНДОМАЙЗЕР -->
    <div id="randomizer" class="tab-content">
        <h2>🎲 Рандомайзер на игри</h2>
        <label>Избери режим</label>
        <div class="filter-mode-container">
            <button type="button" class="filter-mode-btn pvp-mode active" id="randPvpBtn" onclick="setRandFilter('pvp')">⚔️ PvP</button>
            <button type="button" class="filter-mode-btn coop-mode" id="randCoopBtn" onclick="setRandFilter('coop')">🤝 Co-op</button>
            <button type="button" class="filter-mode-btn all-mode" id="randAllBtn" onclick="setRandFilter('all')">🌟 Всички</button>
        </div>
        
        <div style="display:flex;gap:12px;margin:15px 0">
            <button class="btn-info" onclick="pickRandomGame()" style="flex:1;margin:0;padding:14px;">🎲 Случайна игра</button>
            <button class="btn-secondary" onclick="toggleManualPick()" style="flex:1;margin:0;padding:14px;">📋 Избери игра</button>
        </div>

        <div id="manualPickContainer" style="display:none;margin-top:15px">
            <label>Избери директно от списъка</label>
            <select id="randGameSelect" onchange="onManualGameSelected()"><option value="">-- Избери игра --</option></select>
        </div>

        <div id="randomizerOutput" style="margin-top:25px"></div>
    </div>

    <!-- ТАБ: СТАТИСТИКА -->
    <div id="stats" class="tab-content">
        <div class="section-title"><h2>Статистика</h2><button class="btn-secondary" onclick="refreshStats()">↻ Обнови</button></div>

        <div class="stats-nav">
            <button id="statsOverviewBtn" class="stats-nav-btn active" onclick="showStatsPanel('overview')">📊 Обща статистика</button>
            <button id="statsDetailBtn" class="stats-nav-btn" onclick="showStatsPanel('detail')">🔎 Подробна статистика</button>
            <button id="statsPlayerBtn" class="stats-nav-btn" onclick="showStatsPanel('player')">👤 Статистика по играчи</button>
        </div>

        <div id="statsOverviewPanel" class="stats-panel active">
            <div id="statsOverviewOutput"></div>
        </div>

        <div id="statsDetailPanel" class="stats-panel">
            <div class="detail-filters">
                <div class="filter-title">Какво искаш да видиш?</div>
                <div class="stats-scope">
                    <button id="detailAllBtn" class="scope-btn active" onclick="setDetailScope('all')">Всички игри</button>
                    <button id="detailSpecificBtn" class="scope-btn" onclick="setDetailScope('specific')">Избрана игра</button>
                </div>
                <select id="detailGameSelect" onchange="renderDetailedStats()" style="display:none"></select>
            </div>
            <div id="statsDetailOutput"></div>
        </div>

        <div id="statsPlayerPanel" class="stats-panel">
            <div class="detail-filters">
                <div class="filter-title">Избери играч за личен анализ</div>
                <div id="playerSelectorBar" class="player-selector-bar"></div>
            </div>
            <div id="statsPlayerOutput"></div>
        </div>
    </div>

    <!-- ТАБ: УПРАВЛЕНИЕ -->
    <div id="manage" class="tab-content">
        <h2>Управление на колекцията</h2>
        <label>Добави нова игра</label>
        <input type="text" id="gameInput" placeholder="Име на нова игра..." onkeydown="if(event.key==='Enter')addGame()">
        <label>Тип на играта</label>
        <select id="gameTypeInput"><option value="pvp">PvP (Състезателна с точки)</option><option value="coop">Co-op (Кооперативна)</option></select>
        <button onclick="addGame()">Добави игра</button>
        <hr>
        <label>Добави нов играч</label>
        <input type="text" id="playerInput" placeholder="Име на нов играч..." onkeydown="if(event.key==='Enter')addPlayer()">
        <button onclick="addPlayer()">Добави играч</button>
        <hr>
        <label>Играчи</label><div id="managePlayersList"></div>
        <hr>
        <label style="color:#007bff">Импортиране и Експортиране на CSV</label>
        <input type="file" id="csvFileInput" accept=".csv,.txt">
        <button class="btn-info" onclick="importCsvData()">Зареди CSV в историята</button>
        <button class="btn-info" onclick="exportCsvData()">📥 Изтегли CSV история</button>
        <div class="small">Формат за лесно прехвърляне между компютри.</div>
        <hr>
        <label style="color:#dc3545">Глобални действия</label>
        <button class="btn-danger" onclick="clearAllLogs()">Изтрий цялата история</button>
        <button class="btn-secondary" onclick="resetToDefaultGames()">Върни стандартните игри</button>
        <button class="btn-info" onclick="exportData()">💾 Архивирай данните (JSON)</button>
        <input type="file" id="backupFileInput" accept=".json" style="display:none" onchange="importBackup(event)">
        <button class="btn-secondary" onclick="document.getElementById('backupFileInput').click()">📥 Възстанови архив (JSON)</button>
    </div>
</div>

<script>
const initialGames = {
    "Everdell": "pvp",
    "Heat": "pvp",
    "7 Wonder Duel": "pvp",
    "Ticket to ride": "pvp",
    "Patchwork": "pvp",
    "Sky team": "coop",
    "Spirit Island": "coop",
    "Хляб и Бира": "pvp",
    "Aqualin": "pvp",
    "Каскадия": "pvp",
    "Такеноко": "pvp",
    "Домино": "pvp",
    "Порт Роял": "pvp",
    "Мандала": "pvp",
    "Splendor": "pvp",
    "Каркасон": "pvp",
    "Castles of Burgundy": "pvp",
    "Имхотеп - двубоят": "pvp"
};

window.myGamesObj = loadJSON('myGamesObj', initialGames);
window.myPlayers = loadJSON('myPlayers', ['Нина','Митко']);
window.gameLogs = loadJSON('gameLogs', []);

let myGamesObj = window.myGamesObj;
let myPlayers = window.myPlayers;
let gameLogs = window.gameLogs;
let currentLogFilter = 'pvp';
let currentRandFilter = 'all'; 
let selectedCoopResult = null;
let selectedStatPlayer = null;

function loadJSON(key, fallback){
    try{const v=JSON.parse(localStorage.getItem(key));return v ?? fallback}catch(e){return fallback}
}
function saveAll() {
  localStorage.setItem('myGamesObj', JSON.stringify(myGamesObj));
  localStorage.setItem('myPlayers', JSON.stringify(myPlayers));
  localStorage.setItem('gameLogs', JSON.stringify(gameLogs));
  if (typeof window.saveDataToFirebase === 'function') { window.saveDataToFirebase(); }
}
function esc(v){
    return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function idSafe(v){return encodeURIComponent(v).replace(/%/g,'_')}
function formatDate(d){
    if(!d)return '-';
    const date=new Date(d);
    if(!isNaN(date))return date.toLocaleDateString('bg-BG');
    return esc(d);
}
function openTab(evt,tabName){
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    evt.currentTarget.classList.add('active');
    if(tabName==='stats'){showStats();populateDetailGameSelect();}
    else if(tabName==='randomizer'){renderRandomizer();}
    else {updateUI();}
}
function setLogFilter(mode){
    currentLogFilter=mode;
    document.getElementById('filterPvpBtn').classList.toggle('active',mode==='pvp');
    document.getElementById('filterCoopBtn').classList.toggle('active',mode==='coop');
    resetEntryForm(); updateUI();
}

/* ФУНКЦИИ ЗА РАНДОМАЙЗЕРА */
function setRandFilter(mode){
    currentRandFilter=mode;
    document.getElementById('randPvpBtn').classList.toggle('active',mode==='pvp');
    document.getElementById('randCoopBtn').classList.toggle('active',mode==='coop');
    document.getElementById('randAllBtn').classList.toggle('active',mode==='all');
    document.getElementById('manualPickContainer').style.display = 'none';
    renderRandomizer();
}
function renderRandomizer(){
    const select = document.getElementById('randGameSelect');
    const games = Object.keys(myGamesObj).filter(g => currentRandFilter === 'all' || myGamesObj[g] === currentRandFilter).sort((a,b)=>a.localeCompare(b,'bg'));
    select.innerHTML = '<option value="">-- Избери игра от списъка --</option>' + games.map(g => `<option value="${esc(g)}">${esc(g)} (${myGamesObj[g] === 'coop' ? 'Co-op' : 'PvP'})</option>`).join('');
    
    const out = document.getElementById('randomizerOutput');
    if(!out.innerHTML){
        out.innerHTML = `<div class="winner-display">Избери режим и натисни „Случайна игра“ или „Избери игра“!</div>`;
    }
}
function toggleManualPick(){
    const container = document.getElementById('manualPickContainer');
    container.style.display = container.style.display === 'none' ? 'block' : 'none';
}
function pickRandomGame(){
    const games = Object.keys(myGamesObj).filter(g => currentRandFilter === 'all' || myGamesObj[g] === currentRandFilter);
    const out = document.getElementById('randomizerOutput');
    if(!games.length){

function calculateWinner(){
    if(currentLogFilter==='coop')return null;
    const display=document.getElementById('winnerDisplay');if(!display)return null;
    const boxes=[...document.querySelectorAll('.player-card input[type=checkbox]:checked')];
    if(!boxes.length){display.innerText='Избери участници, за да се определи победител';return null}
    const entries=boxes.map(cb=>{const p=cb.closest('.player-card').querySelector('.player-name').textContent;const score=Number(document.getElementById('score_'+idSafe(p)).value);return {p,score}}).filter(x=>Number.isFinite(x.score));
    if(entries.length!==boxes.length){display.innerText='Въведи точките на всички избрани играчи...';return null}
    const max=Math.max(...entries.map(x=>x.score)), winners=entries.filter(x=>x.score===max).map(x=>x.p);
    if(winners.length>1){display.innerText=`🤝 Равенство: ${winners.join(' и ')} (${max} т.)`;return {winners,max}}
    display.innerText=`🏆 Победител: ${winners[0]} (${max} т.)`;return {winners,max};
}

    const game=document.getElementById('gameSelect').value;if(!game)return alert('Моля, избери игра!');

    if(currentLogFilter==='coop'){

/* =========================================================
   BOARD GAME TRACKER
   СТАТИСТИКА
   PvP и Co-op са напълно отделени.
   Няма "равенства" като резултат.
   ========================================================= */


/* =========================================================
   ОСНОВНИ HELPER ФУНКЦИИ
   ========================================================= */

function getLogType(log){
    if(log && log.type){
        return log.type;
    }

    return myGamesObj[log.game] === 'coop'
        ? 'coop'
        : 'pvp';
}


function getPvpWinners(log){

    if(Array.isArray(log.winners) && log.winners.length){
        return log.winners;
    }

    if(log.winner){
        return [log.winner];
    }

    return [];
}


function getPvpScores(log){

    return Object.entries(log.scores || {})
        .map(([player, score]) => ({
            player,
            score: Number(score) || 0
        }))
        .sort((a,b) => b.score - a.score);
}


function formatPercent(value){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return '0.0%';
    }

    return `${n.toFixed(1)}%`;
}


function formatNumber(value, decimals = 1){

    const n = Number(value);

    if(!Number.isFinite(n)){
        return '0';
    }

    return n.toFixed(decimals);
}


/* =========================================================
   WIN RATE ВИЗУАЛИЗАЦИЯ
   ========================================================= */

function winRateBar(rate){

    const safeRate = Math.max(
        0,
        Math.min(100, Number(rate) || 0)
    );

    return `
        <div class="winrate-bar-container">

            <div class="winrate-track">

                <div
                    class="winrate-fill"
                    style="
                        width:${safeRate}%;
                        background:
                            linear-gradient(
                                90deg,
                                #dc3545 0%,
                                #ffc107 50%,
                                #28a745 100%
                            );
                    ">
                </div>

            </div>

            <div class="winrate-text">
                ${safeRate.toFixed(1)}%
            </div>

        </div>
    `;
}


/* =========================================================
   ФИЛТРИ
   ========================================================= */

function getModeLogs(mode, logs = gameLogs){

    return logs.filter(log =>
        getLogType(log) === mode
    );
}


function getGameListForMode(mode){

    return [
        ...new Set(
            getModeLogs(mode)
                .map(log => log.game)
                .filter(Boolean)
        )
    ].sort((a,b) =>
        a.localeCompare(b,'bg')
    );
}


function getAllPlayersList(){

    const players = new Set(myPlayers);

    gameLogs.forEach(log => {

        const type = getLogType(log);

        if(type === 'pvp' && log.scores){

            Object.keys(log.scores)
                .forEach(player => players.add(player));

        }

        if(type === 'coop' && Array.isArray(log.participants)){

            log.participants
                .forEach(player => players.add(player));

        }

    });

    return [...players]
        .sort((a,b) =>
            a.localeCompare(b,'bg')
        );
}


/* =========================================================
   STAT CARD
   ========================================================= */

function statCard(number, label, extra = ''){

    return `
        <div class="stat-card">

            <div class="num">
                ${number}
            </div>

            <div class="label">
                ${label}
            </div>

            ${
                extra
                ? `
                    <div
                        class="small"
                        style="margin-top:5px;">
                        ${extra}
                    </div>
                  `
                : ''
            }

}

                        🎲 Различни Co-op игри

                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${coopUniqueGames}

                    </div>

                </div>


                <div
                    class="stat-card"
                    style="text-align:left;">

                    <div
                        class="small"
                        style="color:var(--muted);">

                        👥 Среден размер на отбора

                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${formatNumber(avgCoopTeam)}

                    </div>

                </div>


                <div
                    class="stat-card"
                    style="text-align:left;">

                    <div
                        class="small"
                        style="color:var(--muted);">

                        🎲 Най-играна Co-op игра

                    </div>

                    <div
                        style="
                            font-size:18px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${
                            mostPlayedCoop
                            ? esc(mostPlayedCoop[0])
                            : '-'
                        }

                    </div>

                </div>

            </div>


            <!-- Co-op по играчи -->

            <div style="margin-top:20px;">

                <div
                    class="filter-title"
                    style="margin-bottom:8px;">

                    👥 Co-op резултати по играчи

                </div>


                <div class="table-responsive">

                    <table>

                        <tr>
                            <th>Играч</th>
                            <th>Участия</th>
                            <th>Успешни</th>
                            <th>Неуспешни</th>
                            <th>Success rate</th>
                        </tr>

    `;


    const coopPlayerMap = {};


    coopLogs.forEach(log => {

        const participants =
            Array.isArray(log.participants)
            ? log.participants
            : [];


        participants.forEach(player => {

            if(!coopPlayerMap[player]){

                coopPlayerMap[player] = {
                    attempts: 0,
                    wins: 0
                };

            }


            coopPlayerMap[player].attempts++;


            if(log.coopResult === 'win'){
                coopPlayerMap[player].wins++;
            }

        });

    });


    const coopPlayers =
        Object.entries(coopPlayerMap)
            .map(([player,data]) => {

                const rate =
                    data.attempts
                    ? data.wins / data.attempts * 100
                    : 0;

                return {
                    player,
                    attempts: data.attempts,
                    wins: data.wins,
                    losses: data.attempts - data.wins,
                    rate
                };

            })
            .sort((a,b) => {

                if(b.wins !== a.wins){
                    return b.wins - a.wins;
                }

                return b.rate - a.rate;

            });


    if(!coopPlayers.length){

        html += `

            <tr>

                <td
                    colspan="5"
                    class="empty">

                    Няма Co-op данни.

                </td>

            </tr>

        `;

    }else{

        coopPlayers.forEach(x => {

            html += `

                <tr>

                    <td>
                        <b>${esc(x.player)}</b>
                    </td>

                    <td>
                        ${x.attempts}
                    </td>

                    <td>
                        ${x.wins}
                    </td>

                    <td>
                        ${x.losses}
                    </td>

                    <td>
                        ${winRateBar(x.rate)}
                    </td>

                </tr>

            `;

        });

    }


    html += `

                    </table>

                </div>

            </div>

        </div>

    `;


    out.innerHTML = html;
}

function updateStatsModeButtons(){

        document.getElementById(
            'statsModePvpBtn'
        );

    const coopBtn =
        document.getElementById(
            'statsModeCoopBtn'
        );


    if(pvpBtn){

        pvpBtn.classList.toggle(

        );

    }


    if(coopBtn){

            'active',
            statsMode === 'coop'
        );

function setDetailScope(scope){

    detailScope = scope;

    updateDetailScopeButtons();

    const select =
        document.getElementById(
            'detailGameSelect'
        );


    if(select){

        select.style.display =
            scope === 'specific'
            ? 'block'
            : 'none';

    }


    if(scope === 'specific'){

        populateDetailGameSelect();

    }


    renderDetailedStats();

function updateDetailScopeButtons(){

    const allBtn =
        document.getElementById(
            'detailAllBtn'
        );

    const specificBtn =
        document.getElementById(
            'detailSpecificBtn'
        );


    if(allBtn){

        allBtn.classList.toggle(

        );

    }


    if(specificBtn){

        specificBtn.classList.toggle(
            'active',
            detailScope === 'specific'
        );

    }

}


function populateDetailGameSelect(){

    const select =
        document.getElementById(
            'detailGameSelect'
        );


    if(!select){
        return;
    }


    const oldValue =
        select.value;


    const games =
        getGameListForMode(
            statsMode
        );


    select.innerHTML =
        games.length

        ? games
            .map(game => `
                <option value="${esc(game)}">
                    ${esc(game)}
                </option>
            `)
            .join('')

        : `
            <option value="">
                Няма записани игри
            </option>
        `;


    if(games.includes(oldValue)){

        select.value = oldValue;

    }

}

   DETAILED STATS
   ========================================================= */

function renderDetailedStats(){

    const out =
        document.getElementById(
            'statsDetailOutput'
        );


    if(!out){
        return;
    }


    if(!gameLogs.length){

        out.innerHTML = `
            <div class="empty">
                Все още няма записани партии.
            </div>
        `;

        return;
    }


    let logs =
        getModeLogs(statsMode);


    if(detailScope === 'specific'){

        const select =
            document.getElementById(
                'detailGameSelect'
            );


        const selectedGame =
            select
            ? select.value
            : '';


        if(!selectedGame){

            out.innerHTML = `
                <div class="empty">
                    Моля, изберете игра.
                </div>
            `;

            return;
        }


        logs =
            logs.filter(
                log => log.game === selectedGame
            );

    }


    if(!logs.length){

        out.innerHTML = `
            <div class="empty">
                Няма записи за избраните критерии.
            </div>
        `;

        return;
    }


    if(statsMode === 'pvp'){

        renderDetailedPvp(
            logs,
            out
        );

    }else{

        renderDetailedCoop(
            logs,
            out
        );

    }

}


/* =========================================================
   DETAILED PvP
   ========================================================= */

function renderDetailedPvp(logs, out){

    let scoreSum = 0;
    let scoreCount = 0;

    let winningScoreSum = 0;
    let winningScoreCount = 0;

    let highestScore = null;

    const margins = [];


    let closest = null;
    let biggest = null;


    logs.forEach(log => {

        const scores =
            getPvpScores(log);


        if(!scores.length){
            return;
        }


        scores.forEach(item => {

            scoreSum += item.score;
            scoreCount++;


            if(
                highestScore === null ||
                item.score > highestScore.score
            ){

                highestScore = {

                    player: item.player,
                    score: item.score,
                    game: log.game,
                    date: log.date

                };

            }

        });


        winningScoreSum +=
            scores[0].score;

        winningScoreCount++;


        if(scores.length >= 2){

            const margin =
                scores[0].score -
                scores[1].score;


            margins.push(margin);


            const item = {

                game: log.game,
                date: log.date,
                margin,
                winner: scores[0].player,
                result:
                    scores
                    .map(
                        x =>
                            `${x.player}: ${x.score}`
                    )
                    .join(', ')

            };


            if(
                closest === null ||
                margin < closest.margin
            ){

                closest = item;

            }


            if(
                biggest === null ||
                margin > biggest.margin
            ){

                biggest = item;

            }

        }

    });


    const avgScore =
        scoreCount
        ? scoreSum / scoreCount
        : 0;


    const avgWinningScore =
        winningScoreCount
        ? winningScoreSum /
          winningScoreCount
        : 0;


    const avgMargin =
        margins.length
        ? margins.reduce(
            (a,b) => a + b,
            0
          ) / margins.length
        : 0;


    /* -----------------------------------------
       ПОБЕДНИ СЕРИИ
       ----------------------------------------- */

    const currentStreak = {};
    const maxStreak = {};


    [...logs]
        .sort(
            (a,b) =>
                new Date(a.date || 0) -
                new Date(b.date || 0)
        )
        .forEach(log => {

            const winners =
                getPvpWinners(log);


            const players =
                Object.keys(
                    log.scores || {}
                );


            players.forEach(player => {

                if(winners.includes(player)){

                    currentStreak[player] =
                        (currentStreak[player] || 0) + 1;


                    maxStreak[player] =
                        Math.max(
                            maxStreak[player] || 0,
                            currentStreak[player]
                        );

                }else{

                    currentStreak[player] = 0;

                }

            });

        });


    const longestStreak =
        Object.entries(maxStreak)
            .sort((a,b) => b[1] - a[1])[0];


    let html = `

        <div class="game-stats-box">

            <h3>
                ⚔️ Подробна PvP статистика
            </h3>


            <div class="dashboard">

                ${statCard(
                    logs.length,
                    'Партии'
                )}

                ${statCard(
                    formatNumber(avgWinningScore),
                    'Среден резултат на победителя'
                )}

                ${statCard(
                    highestScore
                    ? highestScore.score
                    : '-',
                    'Най-висок резултат',
                    highestScore
                    ? esc(highestScore.player)
                    : ''
                )}

                ${statCard(
                    formatNumber(avgMargin),
                    'Средна разлика'
                )}

            </div>


            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(
                            auto-fit,
                            minmax(220px,1fr)
                        );
                    gap:12px;
                ">


                <div class="stat-card">

                    <div class="small">
                        🎯 Среден резултат на всички играчи
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${formatNumber(avgScore)}

                    </div>

                </div>


                <div class="stat-card">

                    <div class="small">
                        🔥 Най-голяма победна разлика
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${
                            biggest
                            ? biggest.margin
                            : '-'
                        }

                    </div>

                    ${
                        biggest
                        ? `
                            <div class="small">
                                ${esc(biggest.game)}
                                •
                                ${esc(biggest.winner)}
                            </div>
                          `
                        : ''
                    }

                </div>


                <div class="stat-card">

                    <div class="small">
                        🎯 Най-близък мач
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${
                            closest
                            ? closest.margin
                            : '-'
                        }

                    </div>

                    ${
                        closest
                        ? `
                            <div class="small">
                                ${esc(closest.game)}
                            </div>
                          `
                        : ''
                    }

                </div>


                <div class="stat-card">

                    <div class="small">
                        🔥 Най-дълга победна серия
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${
                            longestStreak
                            ? longestStreak[1]
                            : 0
                        }

                    </div>

                    ${
                        longestStreak
                        ? `
                            <div class="small">
                                ${esc(longestStreak[0])}
                            </div>
                          `
                        : ''
                    }

                </div>

            </div>

        </div>


        <!-- PvP ПО ИГРИ -->

        <div class="game-stats-box">

            <h3>
                🎲 PvP статистика по игри
            </h3>

            <div class="table-responsive">

                <table>

                    <tr>
                        <th>Игра</th>
                        <th>Партии</th>
                        <th>Среден резултат</th>
                        <th>Среден резултат на победителя</th>
                        <th>Средна разлика</th>
                        <th>Най-близък мач</th>
                    </tr>

    `;


    const gameMap = {};


    logs.forEach(log => {

        if(!gameMap[log.game]){

            gameMap[log.game] = {

                games: 0,
                scoreSum: 0,
                scoreCount: 0,
                winnerScoreSum: 0,
                marginSum: 0,
                marginCount: 0,
                closestMargin: null

            };

        }


        const d =
            gameMap[log.game];


        const scores =
            getPvpScores(log);


        d.games++;


        scores.forEach(item => {

            d.scoreSum += item.score;
            d.scoreCount++;

        });


        if(scores.length){

            d.winnerScoreSum +=
                scores[0].score;

        }


        if(scores.length >= 2){

            const margin =
                scores[0].score -
                scores[1].score;


            d.marginSum += margin;
            d.marginCount++;


            if(
                d.closestMargin === null ||
                margin < d.closestMargin
            ){

                d.closestMargin = margin;

            }

        }

    });


    Object.entries(gameMap)
        .sort(
            (a,b) =>
                b[1].games -
                a[1].games
        )
        .forEach(([game,d]) => {

            const avg =
                d.scoreCount
                ? d.scoreSum /
                  d.scoreCount
                : 0;


            const avgWinner =
                d.games
                ? d.winnerScoreSum /
                  d.games
                : 0;


            const avgMargin =
                d.marginCount
                ? d.marginSum /
                  d.marginCount
                : 0;


            html += `

                <tr>

                    <td>
                        <b>${esc(game)}</b>
                    </td>

                    <td>
                        ${d.games}
                    </td>

                    <td>
                        ${formatNumber(avg)}
                    </td>

                    <td>
                        ${formatNumber(avgWinner)}
                    </td>

                    <td>
                        ${formatNumber(avgMargin)}
                    </td>

                    <td>
                        ${
                            d.closestMargin === null
                            ? '-'
                            : d.closestMargin
                        }
                    </td>

                </tr>

            `;

        });


    html += `

                </table>

            </div>

        </div>


        <!-- ПОСЛЕДНИ PvP -->

        <div class="game-stats-box">

            <h3>
                🕒 Последни PvP партии
            </h3>

            <div class="table-responsive">

                <table>

                    <tr>
                        <th>Дата</th>
                        <th>Игра</th>
                        <th>Победител</th>
                        <th>Резултат</th>
                        <th>Разлика</th>
                    </tr>

    `;


    [...logs]
        .sort(
            (a,b) =>
                new Date(b.date || 0) -
                new Date(a.date || 0)
        )
        .slice(0,10)
        .forEach(log => {

            const scores =
                getPvpScores(log);


            const winners =
                getPvpWinners(log);


            const margin =
                scores.length >= 2
                ? scores[0].score -
                  scores[1].score
                : null;


            html += `

                <tr>

                    <td>
                        ${formatDate(log.date)}
                    </td>

                    <td>
                        <b>${esc(log.game)}</b>
                    </td>

                    <td>
                        🏆
                        ${
                            winners.length
                            ? esc(winners[0])
                            : '-'
                        }
                    </td>

                    <td>
                        ${esc(
                            scores
                                .map(
                                    x =>
                                        `${x.player}: ${x.score}`
                                )
                                .join(' • ')
                        )}
                    </td>

                    <td>
                        ${
                            margin === null
                            ? '-'
                            : margin
                        }
                    </td>

                </tr>

            `;

        });


    html += `

                </table>

            </div>

        </div>

    `;


    out.innerHTML = html;
}


/* =========================================================

function renderDetailedCoop(logs, out){

    const attempts =
        logs.length;


    const wins =
        logs.filter(
            log => log.coopResult === 'win'
        ).length;


    const losses =
        attempts - wins;


    const successRate =
        attempts
        ? wins / attempts * 100
        : 0;


    let teamSizeSum = 0;


    logs.forEach(log => {

        teamSizeSum +=
            Array.isArray(log.participants)
            ? log.participants.length
            : 0;

    });


    const avgTeam =
        attempts
        ? teamSizeSum / attempts
        : 0;


    /* -----------------------------------------
       ПОБЕДНА СЕРИЯ
       ----------------------------------------- */

    let currentStreak = 0;
    let longestStreak = 0;


    [...logs]
        .sort(
            (a,b) =>
                new Date(a.date || 0) -
                new Date(b.date || 0)
        )
        .forEach(log => {

            if(log.coopResult === 'win'){

                currentStreak++;

                longestStreak =
                    Math.max(
                        longestStreak,
                        currentStreak
                    );

            }else{

                currentStreak = 0;

            }

        });


    let html = `

        <div class="game-stats-box">

            <h3>
                🤝 Подробна Co-op статистика
            </h3>


            <div class="dashboard">

                ${statCard(
                    attempts,
                    'Опити'
                )}

                ${statCard(
                    wins,
                    'Успешни'
                )}

                ${statCard(
                    losses,
                    'Неуспешни'
                )}

                ${statCard(
                    formatPercent(successRate),
                    'Success rate'
                )}

            </div>


            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(
                            auto-fit,
                            minmax(220px,1fr)
                        );
                    gap:12px;
                ">


                <div class="stat-card">

                    <div class="small">
                        👥 Среден размер на отбора
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${formatNumber(avgTeam)}

                    </div>

                </div>


                <div class="stat-card">

                    <div class="small">
                        🔥 Най-дълга успешна серия
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;
                        ">

                        ${longestStreak}

                    </div>

                </div>

            </div>

        </div>


        <!-- CO-OP ПО ИГРИ -->

        <div class="game-stats-box">

            <h3>
                🎲 Co-op статистика по игри
            </h3>

            <div class="table-responsive">

                <table>

                    <tr>
                        <th>Игра</th>
                        <th>Опити</th>
                        <th>Успешни</th>
                        <th>Неуспешни</th>
                        <th>Success rate</th>
                        <th>Среден отбор</th>
                    </tr>

    `;


    const gameMap = {};


    logs.forEach(log => {

        if(!gameMap[log.game]){

            gameMap[log.game] = {

                attempts: 0,
                wins: 0,
                teamSizeSum: 0

            };

        }


        const d =
            gameMap[log.game];


        d.attempts++;


        if(log.coopResult === 'win'){

            d.wins++;

        }


        d.teamSizeSum +=
            Array.isArray(log.participants)
            ? log.participants.length
            : 0;

    });


    Object.entries(gameMap)
        .sort(
            (a,b) =>
                b[1].attempts -
                a[1].attempts
        )
        .forEach(([game,d]) => {

            const losses =
                d.attempts - d.wins;


            const rate =
                d.attempts
                ? d.wins /
                  d.attempts * 100
                : 0;


            const avgTeam =
                d.attempts
                ? d.teamSizeSum /
                  d.attempts
                : 0;


            html += `

                <tr>

                    <td>
                        <b>${esc(game)}</b>
                    </td>

                    <td>
                        ${d.attempts}
                    </td>

                    <td>
                        ${d.wins}
                    </td>

                    <td>
                        ${losses}
                    </td>

                    <td>
                        ${winRateBar(rate)}
                    </td>

                    <td>
                        ${formatNumber(avgTeam)}
                    </td>

                </tr>

            `;

        });


    html += `

                </table>

            </div>

        </div>


        <!-- ПОСЛЕДНИ CO-OP -->

        <div class="game-stats-box">

            <h3>
                🕒 Последни Co-op опити
            </h3>

            <div class="table-responsive">

                <table>

                    <tr>
                        <th>Дата</th>
                        <th>Игра</th>
                        <th>Резултат</th>
                        <th>Участници</th>
                    </tr>

    `;


    [...logs]
        .sort(
            (a,b) =>
                new Date(b.date || 0) -

function populatePlayerSelector(){

    const bar =
        document.getElementById(
            'playerSelectorBar'
        );


    if(!bar){
        return;
    }


    const players =
        getAllPlayersList();


    if(!players.length){

        bar.innerHTML =
            '<span class="small">Няма намерени играчи.</span>';

        selectedStatPlayer = null;

        return;
    }


    if(
        !selectedStatPlayer ||
        !players.includes(selectedStatPlayer)
    ){

        selectedStatPlayer =
            players[0];

    }


    bar.innerHTML =
        players
            .map(player => `

                <button
                    type="button"
                    class="
                        player-filter-btn
                        ${
                            player === selectedStatPlayer
                            ? 'active'
                            : ''
                        }
                    "
                    data-player="${esc(player)}">

                    ${esc(player)}

                </button>

            `)
            .join('');


    bar
        .querySelectorAll(
            '.player-filter-btn'
        )
        .forEach(button => {

            button.addEventListener(
                'click',
                () => {

                    setStatPlayer(
                        button.dataset.player
                    );

                }
            );

        });

}


function setStatPlayer(player){

    selectedStatPlayer =
        player;

    populatePlayerSelector();

    renderPlayerStats();
}


/* =========================================================
   PLAYER STATS
   ========================================================= */

function renderPlayerStats(){

    const out =
        document.getElementById(
            'statsPlayerOutput'
        );


    if(!out){
        return;
    }


    const players =
        getAllPlayersList();


    if(!players.length){

        out.innerHTML = `
            <div class="empty">
                Все още няма добавени играчи.
            </div>
        `;

        return;
    }


    if(
        !selectedStatPlayer ||
        !players.includes(selectedStatPlayer)
    ){

        selectedStatPlayer =
            players[0];

    }


    const player =
        selectedStatPlayer;


    /* =====================================================
       PLAYER PvP
       ===================================================== */

    const pvpLogs =
        getModeLogs('pvp')
            .filter(log =>
                log.scores &&
                Object.prototype.hasOwnProperty.call(
                    log.scores,
                    player
                )
            );


    let pvpWins = 0;
    let pvpScoreSum = 0;
    let pvpHighest = null;
    let pvpHighestGame = null;
    let pvpHighestDate = null;


    pvpLogs.forEach(log => {

        const score =
            Number(
                log.scores[player]
            ) || 0;


        pvpScoreSum += score;


        if(
            pvpHighest === null ||
            score > pvpHighest
        ){

            pvpHighest = score;
            pvpHighestGame = log.game || null;
            pvpHighestDate = log.date || null;

        }


        const winners =
            getPvpWinners(log);


        if(winners.includes(player)){

            pvpWins++;

        }

    });


    const pvpLosses =
        pvpLogs.length -
        pvpWins;


    const pvpRate =
        pvpLogs.length
        ? pvpWins /
          pvpLogs.length * 100
        : 0;


    const avgPvpScore =
        pvpLogs.length
        ? pvpScoreSum /
          pvpLogs.length
        : 0;


    const mostPlayedPlayerGame =
        Object.entries(
            pvpLogs.reduce((map, log) => {
                const game = log.game || 'Неизвестна игра';
                map[game] = (map[game] || 0) + 1;
                return map;
            }, {})
        ).sort((a,b) => {
            if(b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0], 'bg');
        })[0] || null;


    const totalPvpPoints =
        pvpScoreSum;


    /* PvP streak */

    let currentPvpStreak = 0;
    let longestPvpStreak = 0;


    [...pvpLogs]
        .sort(
            (a,b) =>
                new Date(a.date || 0) -
                new Date(b.date || 0)
        )
        .forEach(log => {

            const winners =
                getPvpWinners(log);


            if(winners.includes(player)){

                currentPvpStreak++;

                longestPvpStreak =
                    Math.max(
                        longestPvpStreak,
                        currentPvpStreak
                    );

            }else{

                currentPvpStreak = 0;

            }

        });


    let html = `

        <div class="game-stats-box">

            <h3>
                ⚔️ ${esc(player)} • PvP профил
            </h3>


            <div class="dashboard">

                ${statCard(
                    pvpLogs.length,
                    'Партии'
                )}

                ${statCard(
                    pvpWins,
                    'Победи'
                )}

                ${statCard(
                    pvpLosses,
                    'Загуби'
                )}

                ${statCard(
                    winRateBar(pvpRate),
                    'Win rate'
                )}

            </div>

            <div
                style="
                    display:grid;
                    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
                    gap:12px;
                    margin-top:-8px;
                    margin-bottom:18px;
                ">

                <div class="stat-card">
                    <div class="small">🧮 Общо спечелени точки</div>
                    <div style="font-size:20px;font-weight:bold;margin-top:5px;">
                        ${formatNumber(totalPvpPoints, 0)}
                    </div>
                </div>

                <div class="stat-card">
                    <div class="small">🎲 Най-играна игра</div>
                    <div style="font-size:18px;font-weight:bold;margin-top:5px;">
                        ${mostPlayedPlayerGame ? esc(mostPlayedPlayerGame[0]) : '-'}
                    </div>
                    <div class="small">
                        ${mostPlayedPlayerGame ? `${mostPlayedPlayerGame[1]} ${mostPlayedPlayerGame[1] === 1 ? 'партия' : 'партии'}` : ''}
                    </div>
                </div>

            </div>

            <div
                style="
                    display:grid;
                    grid-template-columns:
                        repeat(

                        📊 Среден резултат

                            font-weight:bold;

                        🚀 Най-висок резултат

                            : pvpHighest

            </h3>

                        <th>Игра</th>
                        <th>Партии</th>
                        <th>Победи</th>
                        <th>Загуби</th>

    const pvpGameMap = {};

                games: 0,
                wins: 0,

        const data =
            pvpGameMap[log.game];


        data.games++;


        const playerScore =
            Number(log.scores[player]) || 0;

        data.scoreSum += playerScore;
        data.highestScore =

            ? playerScore

    }


    html += `

                </table>

            </div>

        </div>


        <!-- =================================================
             PLAYER CO-OP
             ================================================= -->

    `;


    const coopLogs =
        getModeLogs('coop')
            .filter(log =>
                Array.isArray(log.participants) &&
                log.participants.includes(player)
            );


    const coopWins =
        coopLogs.filter(
            log =>
                log.coopResult === 'win'

    const coopLosses =
        coopLogs.length -
        coopWins;

        : 0;


    let currentCoopStreak = 0;

        .sort(
            (a,b) =>

            if(log.coopResult === 'win'){

                    Math.max(

            }else{

                currentCoopStreak = 0;

            }

        });


    html += `

        <div class="game-stats-box">

            <h3>
                🤝 ${esc(player)} • Co-op профил

                        style="

                            font-weight:bold;
                            margin-top:5px;
                        ">

                </div>


                <div class="stat-card">

                    <div class="small">
                        🔥 Най-дълга успешна серия
                    </div>

                    <div
                        style="
                            font-size:20px;
                            font-weight:bold;
                            margin-top:5px;

        <!-- PLAYER CO-OP ПО ИГРИ -->

        <div class="game-stats-box">

            <h3>
                🎲 ${esc(player)} • Co-op по игри

        data.teamSum +=

        .sort(
            (a,b) =>
                b[1].attempts -
                a[1].attempts

            const losses =
                data.attempts -
                data.wins;


            const rate =
                data.attempts
                ? data.wins /
                  data.attempts * 100

            const avgTeam =
                data.attempts

                  data.attempts

                    <td>

                    </td>

                    <td>

                    </td>

                    </td>

                    </td>

                    <td>

                    </td>

                        ${formatNumber(avgTeam)}

function showStatsPanel(panel){

    document
        .querySelectorAll('#stats .stats-panel')
        .forEach(element => {

            element.classList.remove(
                'active'
            );

        });


    document
        .querySelectorAll('#stats .stats-nav-btn')
        .forEach(button => {

            button.classList.remove(
                'active'
            );

        });


    if(panel === 'overview'){

            .getElementById(
                'statsOverviewBtn'
            )
            .classList.add('active');


        document
            .getElementById(
                'statsOverviewPanel'
            )
            .classList.add('active');


        showStats();

    }


    else if(panel === 'detail'){

        document
            .getElementById(
                'statsDetailBtn'
            )

        document
            .getElementById(
                'statsDetailPanel'
            )

            .getElementById(

            )
            .classList.add('active');

   REFRESH

    showStats();


    const detailPanel =
        document.getElementById(
            'statsDetailPanel'
        );


    const playerPanel =
        document.getElementById(
            'statsPlayerPanel'
        );


    if(
        detailPanel &&

function exportData(){
    const data={myGamesObj,myPlayers,gameLogs};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`board-game-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
    URL.revokeObjectURL(url);
}
function importBackup(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(evt){
        try{
            const data=JSON.parse(evt.target.result);
            if(data.myGamesObj)myGamesObj=data.myGamesObj;
            if(data.myPlayers)myPlayers=data.myPlayers;
            if(data.gameLogs)gameLogs=data.gameLogs;
            saveAll();updateUI();alert('Архивът е възстановен успешно!');
        }catch(err){alert('Грешка при четене на JSON файла.')}
    };
    reader.readAsText(file);
    e.target.value='';
}
function exportCsvData(){
    if(!gameLogs.length)return alert('Няма история за изэкспортиране.');
    let csv='Game,Type,Date,Result/Winner,Participants/Scores\n';
    gameLogs.forEach(l=>{
        const date=l.date||''; const game=`"${(l.game||'').replace(/"/g,'""')}"`; const type=l.type||'pvp';
        if(type==='coop'){
            const res=l.coopResult==='win'?'Win':'Lose';
            const parts=`"${(l.participants||[]).join('; ').replace(/"/g,'""')}"`;
            csv+=`${game},coop,${date},${res},${parts}\n`;
        }else{
            const winner=`"${(l.winner||(l.winners||[]).join('; ')).replace(/"/g,'""')}"`;
            const scoresObj=l.scores||{};
            const scoresStr=`"${Object.entries(scoresObj).map(([p,s])=>`${p}:${s}`).join('; ').replace(/"/g,'""')}"`;
            csv+=`${game},pvp,${date},${winner},${scoresStr}\n`;
        }
    });
    const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`board-game-tracker-history-${new Date().toISOString().slice(0,10)}.csv`;a.click();
    URL.revokeObjectURL(url);
}
function importCsvData(){
    const input=document.getElementById('csvFileInput');
    const file=input.files[0];if(!file)return alert('Моля, избери CSV файл.');
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const text=e.target.result;
            const lines=text.split(/\r\n|\n/).filter(l=>l.trim());
            if(lines.length<2)return alert('CSV файлът е празен или с грешен формат.');
            let importedCount=0;
            for(let i=1;i<lines.length;i++){
                const row=parseCsvLine(lines[i]);
                if(row.length>=5){
                    const [game,type,date,resOrWin,partsOrScores]=row;
                    if(game&&type){
                        if(!myGamesObj[game])myGamesObj[game]=type==='coop'?'coop':'pvp';
                        if(type==='coop'){
                            const coopResult=resOrWin.toLowerCase().includes('win')?'win':'lose';
                            const participants=partsOrScores.split(';').map(s=>s.trim()).filter(Boolean);
                            participants.forEach(p=>{if(!myPlayers.includes(p))myPlayers.push(p)});
                            gameLogs.push({ id: crypto.randomUUID(), game, type: 'coop', participants, coopResult, date: date || new Date().toISOString() });
                            importedCount++;
                        }else{
                            const scores={};
                            partsOrScores.split(';').forEach(item=>{
                                const parts=item.split(':');
                                if(parts.length===2){
                                    const p=parts[0].trim(),s=Number(parts[1].trim());
                                    if(p&&!isNaN(s)){scores[p]=s;if(!myPlayers.includes(p))myPlayers.push(p);}
                                }
                            });
                            if(Object.keys(scores).length>0){
                                const max=Math.max(...Object.values(scores));
                                const winners=Object.keys(scores).filter(p=>scores[p]===max);
                                gameLogs.push({ id: crypto.randomUUID(), game, type: 'pvp', scores, winners, winner: winners[0], date: date || new Date().toISOString() });
                                importedCount++;
                            }
                        }
                    }
                }
            }
            saveAll();updateUI(); alert(`Успешно импортирани ${importedCount} записа!`); input.value='';
        }catch(err){alert('Грешка при парсиране на CSV файла.')}
    };
    reader.readAsText(file);
}
function parseCsvLine(text){
    let ret=[];let cur='';let inQuote=false;
    for(let i=0;i<text.length;i++){
        let c=text[i];
        if(c==='"'){ if(inQuote&&text[i+1]==='"'){cur+='"';i++;} else{inQuote=!inQuote;} }
        else if(c===','&&!inQuote){ret.push(cur);cur='';}
        else{cur+=c;}
    }
    ret.push(cur);
    return ret.map(s=>s.trim());
}
