<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Game Tracker</title>
<style>
:root{
    --green:#28a745;--green-dark:#166534;--blue:#007bff;--red:#dc3545;
    --bg:#f4f4f9;--card:#fff;--muted:#6c757d;--border:#dee2e6;--text:#343a40;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;margin:0;padding:20px;background:var(--bg);color:#333}
.container{max-width:900px;margin:auto;background:var(--card);padding:25px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h2,h3{color:var(--text)}
.tabs{display:flex;cursor:pointer;margin-bottom:25px;border-bottom:2px solid #e9ecef;gap:4px}
.tab{flex:1;padding:12px 5px;text-align:center;background:#f8f9fa;font-weight:bold;color:var(--muted);font-size:14px;border-radius:8px 8px 0 0;transition:.2s}
.tab.active{background:white;border-bottom:3px solid var(--green);color:var(--green);margin-bottom:-2px}
.tab-content{display:none}.tab-content.active{display:block}
label{font-weight:600;color:#495057;display:block;margin:12px 0 5px;font-size:14px}
input,select,button{width:100%;padding:12px;margin:8px 0 14px;font-size:15px}
input[type=text],input[type=number],select{border:1px solid #ced4da;border-radius:8px;background:#fff}
input[type=file]{padding:8px;border:1px dashed #ced4da;border-radius:8px;background:#f8f9fa}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(40,167,69,.15)}
button{background:var(--green);color:white;border:0;cursor:pointer;font-weight:bold;border-radius:8px;transition:.2s}
button:hover{filter:brightness(.93)}button:disabled{opacity:.55;cursor:not-allowed}
.btn-danger{background:var(--red)}.btn-secondary{background:#6c757d}.btn-info{background:#17a2b8}.btn-blue{background:#007bff}
hr{margin:25px 0;border:0;border-top:1px solid #eee}
.filter-mode-container,.coop-result-container{display:flex;gap:12px;margin-bottom:18px}
.filter-mode-btn,.coop-btn{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:bold;border:2px solid #ced4da;background:#f8f9fa;color:#495057;margin:0}
.filter-mode-btn.pvp-mode.active{background:#f0f4ff;border-color:var(--blue);color:#0056b3}
.filter-mode-btn.coop-mode.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.coop-btn.win.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.coop-btn.lose.active{background:#fdf2f2;border-color:var(--red);color:#991b1b}
.players-container{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0 20px}
.player-card{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;padding:12px 16px;border-radius:10px;border:2px solid #e9ecef;transition:.2s}
.player-card.selected{background:#f0fdf4;border-color:var(--green);box-shadow:0 2px 8px rgba(40,167,69,.08)}
.player-info{display:flex;align-items:center;gap:14px;cursor:pointer;flex:1}
.player-info input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--green);cursor:pointer}
.player-name{font-size:16px;font-weight:bold;color:var(--text)}
.score-wrapper{display:flex;align-items:center;gap:8px}.score-wrapper span{font-size:13px;font-weight:600;color:var(--muted)}
.player-score-input{width:100px!important;padding:8px 10px!important;margin:0!important;text-align:center;font-weight:bold;font-size:16px;border-radius:6px!important}
.winner-display{background:#f0fdf4;border:2px dashed var(--green);padding:15px;border-radius:10px;text-align:center;font-weight:bold;color:var(--green-dark);margin-bottom:20px;font-size:16px}
.manage-list-item{display:flex;align-items:center;justify-content:space-between;background:#f8f9fa;padding:10px 14px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border)}
.manage-list-item span{font-weight:bold}.manage-list-item button{width:auto;padding:6px 14px;margin:0;font-size:13px}
.table-responsive{width:100%;overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{border:1px solid var(--border);padding:9px 10px;text-align:center}th{background:#f1f3f5;font-weight:600}
td.winner-score{background:#d4edda!important;color:#155724;font-weight:bold}
td.tie-score{background:#fff3cd!important;color:#856404;font-weight:bold}
td.coop-win{background:#f0fdf4;color:var(--green-dark);font-weight:bold}td.coop-lose{background:#fdf2f2;color:#991b1b;font-weight:bold}
.game-stats-box{background:#fff;border:1px solid var(--border);padding:18px;margin-bottom:18px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.stats-nav{display:flex;gap:10px;margin:15px 0 18px;flex-wrap:wrap}
.stats-nav-btn{flex:1;min-width:140px;margin:0;background:#f1f3f5;color:#495057;border:2px solid #dee2e6;padding:12px;border-radius:10px}
.stats-nav-btn.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}
.stats-panel{display:none}.stats-panel.active{display:block}
.detail-filters{background:#f8f9fa;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px}
.filter-title{font-weight:700;margin-bottom:10px;color:#495057}
.stats-scope{display:flex;gap:10px;margin-bottom:10px}
.scope-btn{flex:1;margin:0;background:white;color:#495057;border:2px solid #ced4da}
.scope-btn.active{background:#f0f4ff;border-color:var(--blue);color:#0056b3}
.detail-filters select{margin:0}

.player-selector-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:15px}
.player-filter-btn{background:#f1f3f5;color:#495057;border:2px solid #dee2e6;padding:10px 18px;border-radius:20px;font-weight:bold;white-space:nowrap;margin:0;width:auto;cursor:pointer}
.player-filter-btn.active{background:#f0fdf4;border-color:var(--green);color:var(--green-dark)}

.winrate-bar-container{display:flex;align-items:center;gap:8px;min-width:130px}
.winrate-track{flex:1;background:#e9ecef;height:10px;border-radius:5px;overflow:hidden;position:relative}
.winrate-fill{height:100%;border-radius:5px;transition:width .4s ease}
.winrate-text{font-size:13px;font-weight:bold;min-width:42px;text-align:right}

.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0 25px}
.stat-card{background:#f8f9fa;border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center}
.stat-card .num{font-size:25px;font-weight:800;color:var(--green-dark)}.stat-card .label{font-size:12px;color:var(--muted);margin-top:3px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.section-title button{width:auto;margin:0;padding:8px 12px;font-size:13px}
.empty{padding:20px;text-align:center;color:#888;background:#f8f9fa;border-radius:10px}
.small{font-size:12px;color:var(--muted)}.success{color:var(--green-dark)}.error{color:#991b1b}
@media(max-width:650px){body{padding:8px}.container{padding:15px}.dashboard{grid-template-columns:repeat(2,1fr)}.tabs{overflow-x:auto}.tab{min-width:110px}.player-card{padding:10px}.score-wrapper span{display:none}}
</style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="openTab(event,'log')">Записване</div>
        <div class="tab" onclick="openTab(event,'stats')">Статистика</div>
        <div class="tab" onclick="openTab(event,'manage')">Добави / Управление</div>
    </div>

    <div id="log" class="tab-content active">
        <h2>Запиши партия</h2>
        <label>Тип игра</label>
        <div class="filter-mode-container">
            <button type="button" class="filter-mode-btn pvp-mode active" id="filterPvpBtn" onclick="setLogFilter('pvp')">⚔️ Състезателни (PvP)</button>
            <button type="button" class="filter-mode-btn coop-mode" id="filterCoopBtn" onclick="setLogFilter('coop')">🤝 Кооперативни (Co-op)</button>
        </div>
        <label>Игра</label>
        <select id="gameSelect" onchange="onGameSelected()"><option value="">-- Избери игра --</option></select>
        <label>Участващи играчи</label>
        <div id="playersCheckboxContainer" class="players-container"><span class="small">Няма добавени играчи още.</span></div>
        <div id="dynamicLogSection"></div>
        <button class="btn-blue" onclick="logGame()" style="padding:14px;font-size:16px">Запиши резултата</button>
        <div id="logStatus" style="margin-top:10px;font-weight:bold;text-align:center"></div>
    </div>

    <div id="stats" class="tab-content">
        <div class="section-title"><h2>Статистика</h2><button class="btn-secondary" onclick="refreshStats()">↻ Обнови</button></div>

        <div class="stats-nav">
            <button id="statsOverviewBtn" class="stats-nav-btn active" onclick="showStatsPanel('overview')">📊 Обща статистика</button>
            <button id="statsDetailBtn" class="stats-nav-btn" onclick="showStatsPanel('detail')">🔎 Подробна статистика</button>
            <button id="statsPlayerBtn" class="stats-nav-btn" onclick="showStatsPanel('player')">👤 Статистика по играчи</button>
        </div>

        <div id="statsOverviewPanel" class="stats-panel active">
            <div id="statsOverviewOutput"></div>
        </div>

        <div id="statsDetailPanel" class="stats-panel">
            <div class="detail-filters">
                <div class="filter-title">Какво искаш да видиш?</div>
                <div class="stats-scope">
                    <button id="detailAllBtn" class="scope-btn active" onclick="setDetailScope('all')">Всички игри</button>
                    <button id="detailSpecificBtn" class="scope-btn" onclick="setDetailScope('specific')">Избрана игра</button>
                </div>
                <select id="detailGameSelect" onchange="renderDetailedStats()" style="display:none"></select>
            </div>
            <div id="statsDetailOutput"></div>
        </div>

        <div id="statsPlayerPanel" class="stats-panel">
            <div class="detail-filters">
                <div class="filter-title">Избери играч за личен анализ</div>
                <div id="playerSelectorBar" class="player-selector-bar"></div>
            </div>
            <div id="statsPlayerOutput"></div>
        </div>
    </div>

    <div id="manage" class="tab-content">
        <h2>Управление на колекцията</h2>
        
        <label style="color:#28a745">☁️ GitHub Gist Синхронизация</label>
        <button class="btn-info" style="background:#28a745" onclick="syncWithGist()">🔄 Синхронизирай с GitHub Gist</button>
        <div class="small">Зарежда и записва данните директно от вашия отдалечен Gist.</div>
        <hr>

        <label>Добави нова игра</label>
        <input type="text" id="gameInput" placeholder="Име на нова игра..." onkeydown="if(event.key==='Enter')addGame()">
        <label>Тип на играта</label>
        <select id="gameTypeInput"><option value="pvp">PvP (Състезателна с точки)</option><option value="coop">Co-op (Кооперативна)</option></select>
        <button onclick="addGame()">Добави игра</button>
        <hr>
        <label>Добави нов играч</label>
        <input type="text" id="playerInput" placeholder="Име на нов играч..." onkeydown="if(event.key==='Enter')addPlayer()">
        <button onclick="addPlayer()">Добави играч</button>
        <hr>
        <label>Играчи</label><div id="managePlayersList"></div>
        <hr>
        <label style="color:#007bff">Импортиране и Експортиране на CSV</label>
        <input type="file" id="csvFileInput" accept=".csv,.txt">
        <button class="btn-info" onclick="importCsvData()">Зареди CSV в историята</button>
        <button class="btn-info" onclick="exportCsvData()">📥 Изтегли CSV история</button>
        <div class="small">Формат за лесно прехвърляне между компютри.</div>
        <hr>
        <label style="color:#dc3545">Глобални действия</label>
        <button class="btn-danger" onclick="clearAllLogs()">Изтрий цялата история</button>
        <button class="btn-secondary" onclick="resetToDefaultGames()">Върни стандартните игри</button>
        <button class="btn-info" onclick="exportData()">💾 Архивирай данните (JSON)</button>
        <input type="file" id="backupFileInput" accept=".json" style="display:none" onchange="importBackup(event)">
        <button class="btn-secondary" onclick="document.getElementById('backupFileInput').click()">📥 Възстанови архив (JSON)</button>
    </div>
</div>

<script>
// --- КОНФИГУРАЦИЯ ЗА GITHUB GIST ---
const GIST_ID = "acb9feaca418167d9e52a0284ac1f61f"; 
const GITHUB_TOKEN = "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";
// -----------------------------------

const initialGames = {
    "Everdell": "pvp",
    "Heat": "pvp",
    "7 Wonder Duel": "pvp",
    "Ticket to ride": "pvp",
    "Patchwork": "pvp",
    "Sky team": "coop",
    "Spirit Island": "coop",
    "Хляб и Бира": "pvp",
    "Aqualin": "pvp",
    "Каскадия": "pvp",
    "Такеноко": "pvp",
    "Домино": "pvp",
    "Порт Роял": "pvp",
    "Мандала": "pvp",
    "Splendor": "pvp",
    "Каркасон": "pvp",
    "Castles of Burgundy": "pvp",
    "Имхотеп - двубоят": "pvp"
};

let myGamesObj = loadJSON('myGamesObj', initialGames);
let myPlayers = loadJSON('myPlayers', ['Нина','Митко']);
let gameLogs = loadJSON('gameLogs', []);
let currentLogFilter = 'pvp';
let selectedCoopResult = null;
let selectedStatPlayer = null;

// Функции за GitHub Gist синхронизация
async function syncWithGist() {
    if (GIST_ID.includes("ПОСТАВИ") || !GIST_ID) return alert("Моля, попълнете коректно GIST_ID и GITHUB_TOKEN в кода.");
    
    const data = { myGamesObj, myPlayers, gameLogs };
    try {
        const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
            method: 'PATCH',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                files: {
                    "board-game-data.json": {
                        content: JSON.stringify(data, null, 2)
                    }
                }
            })
        });

        if (response.ok) {
            alert("Успешно синхронизирано с GitHub Gist!");
        } else {
            const err = await response.json();
            alert("Грешка при синхронизация: " + (err.message || 'Възникна проблем'));
        }
    } catch (e) {
        alert("Мрежова грешка при връзка с GitHub.");
    }
}

async function loadFromGist() {
    if (GIST_ID.includes("ПОСТАВИ") || !GIST_ID) return;
    try {
        const response = await fetch(`https://api.github.com/gists/${GIST_ID}`);
        if (!response.ok) return;
        const data = await response.json();
        if (data.files && data.files["board-game-data.json"]) {
            const parsed = JSON.parse(data.files["board-game-data.json"].content);
            if (parsed.myGamesObj) myGamesObj = parsed.myGamesObj;
            if (parsed.myPlayers) myPlayers = parsed.myPlayers;
            if (parsed.gameLogs) gameLogs = parsed.gameLogs;
            saveAll();
            updateUI();
            console.log("Данните са успешно заредени от Gist!");
        }
    } catch (e) {
        console.log("Неуспешно зареждане от Gist, ползвам локални данни.");
    }
}

function loadJSON(key, fallback){
    try{const v=JSON.parse(localStorage.getItem(key));return v ?? fallback}catch(e){return fallback}
}
function saveAll(){
    localStorage.setItem('myGamesObj',JSON.stringify(myGamesObj));
    localStorage.setItem('myPlayers',JSON.stringify(myPlayers));
    localStorage.setItem('gameLogs',JSON.stringify(gameLogs));
}
function esc(v){
    return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function idSafe(v){return encodeURIComponent(v).replace(/%/g,'_')}
function formatDate(d){
    if(!d)return '-';
    const date=new Date(d);
    if(!isNaN(date))return date.toLocaleDateString('bg-BG');
    return esc(d);
}
function openTab(evt,tabName){
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(tabName).classList.add('active');
    evt.currentTarget.classList.add('active');
    if(tabName==='stats'){showStats();populateDetailGameSelect();}else updateUI();
}
function setLogFilter(mode){
    currentLogFilter=mode;
    document.getElementById('filterPvpBtn').classList.toggle('active',mode==='pvp');
    document.getElementById('filterCoopBtn').classList.toggle('active',mode==='coop');
    resetEntryForm(); updateUI();
}
function updateUI(){
    const select=document.getElementById('gameSelect'), old=select.value;
    const games=Object.keys(myGamesObj).filter(g=>myGamesObj[g]===currentLogFilter).sort((a,b)=>a.localeCompare(b,'bg'));
    select.innerHTML='<option value="">-- Избери игра --</option>'+games.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
    if(games.includes(old))select.value=old;
    renderPlayersForm(); renderManagePlayers(); onGameSelected();
}
function renderManagePlayers(){
    const el=document.getElementById('managePlayersList');
    el.innerHTML=myPlayers.length?myPlayers.map(p=>`<div class="manage-list-item"><span>${esc(p)}</span><button class="btn-danger" onclick="removePlayer(${JSON.stringify(p)})">Изтрий</button></div>`).join(''):'<span class="small">Няма добавени играчи.</span>';
}
function getSelection(){
    const checked={}; const scores={};
    myPlayers.forEach(p=>{
        const key=idSafe(p), card=document.getElementById('card_'+key);
        if(card){
            const cb=card.querySelector('input[type=checkbox]'), scr=document.getElementById('score_'+key);
            if(cb?.checked)checked[p]=true;
            if(scr)scores[p]=scr.value;
        }
    });
    return {checked,scores};
}
function renderPlayersForm(){
    const container=document.getElementById('playersCheckboxContainer');
    if(!myPlayers.length){container.innerHTML='<span class="small">Няма добавени играчи още.</span>';return}
    const {checked,scores}=getSelection(), coop=currentLogFilter==='coop';
    container.innerHTML=myPlayers.map(p=>{
        const key=idSafe(p), yes=!!checked[p];
        if(coop)return `<div class="player-card ${yes?'selected':''}" id="card_${key}" onclick="togglePlayerCard('${esc(p)}','coop')"><div class="player-info"><input type="checkbox" ${yes?'checked':''} onchange="togglePlayerCard('${esc(p)}','coop',event)"><span class="player-name">${esc(p)}</span></div></div>`;
        const val=scores[p]??'';
        return `<div class="player-card ${yes?'selected':''}" id="card_${key}"><div class="player-info" onclick="togglePlayerCard('${esc(p)}','pvp')"><input type="checkbox" ${yes?'checked':''} onchange="togglePlayerCard('${esc(p)}','pvp',event)"><span class="player-name">${esc(p)}</span></div><div class="score-wrapper"><span style="opacity:${yes?1:.4}">Точки:</span><input type="number" id="score_${key}" class="player-score-input" placeholder="0" ${yes?'':'disabled'} value="${esc(val)}" oninput="calculateWinner()"></div></div>`;
    }).join('');
}
function togglePlayerCard(player,mode,event){
    if(event)event.stopPropagation();
    const key=idSafe(player), cb=document.querySelector(`#card_${key} input[type=checkbox]`);
    if(event && event.target!==cb)cb.checked=!cb.checked;
    const card=document.getElementById('card_'+key);
    card.classList.toggle('selected',cb.checked);
    if(mode==='pvp'){
        const score=document.getElementById('score_'+key), label=card.querySelector('.score-wrapper span');
        score.disabled=!cb.checked; label.style.opacity=cb.checked?1:.4;
        if(!cb.checked)score.value='';
        if(cb.checked)score.focus();
        calculateWinner();
    }
}
function onGameSelected(){
    const game=document.getElementById('gameSelect').value, dynamic=document.getElementById('dynamicLogSection');
    if(!game){dynamic.innerHTML=`<div class="winner-display">${currentLogFilter==='coop'?'Избери кооперативна игра за отбора':'Избери състезателна игра и въведи точки'}</div>`;return}
    if(currentLogFilter==='coop'){
        selectedCoopResult=null;
        dynamic.innerHTML=`<label>Резултат на отбора</label><div class="coop-result-container"><button type="button" class="coop-btn win" id="coopWinBtn" onclick="setCoopResult('win')">🏆 Победа</button><button type="button" class="coop-btn lose" id="coopLoseBtn" onclick="setCoopResult('lose')">❌ Загуба</button></div>`;
    }else{
        dynamic.innerHTML='<div id="winnerDisplay" class="winner-display">Избери участници и въведи точки, за да се определи победител</div>';
        calculateWinner();
    }
}
function setCoopResult(result){
    selectedCoopResult=result;
    document.getElementById('coopWinBtn').classList.toggle('active',result==='win');
    document.getElementById('coopLoseBtn').classList.toggle('active',result==='lose');
}
function calculateWinner(){
    if(currentLogFilter==='coop')return null;
    const display=document.getElementById('winnerDisplay');if(!display)return null;
    const boxes=[...document.querySelectorAll('.player-card input[type=checkbox]:checked')];
    if(!boxes.length){display.innerText='Избери участници, за да се определи победител';return null}
    const entries=boxes.map(cb=>{const p=cb.closest('.player-card').querySelector('.player-name').textContent;const score=Number(document.getElementById('score_'+idSafe(p)).value);return {p,score}}).filter(x=>Number.isFinite(x.score));
    if(entries.length!==boxes.length){display.innerText='Въведи точките на всички избрани играчи...';return null}
    const max=Math.max(...entries.map(x=>x.score)), winners=entries.filter(x=>x.score===max).map(x=>x.p);
    if(winners.length>1){display.innerText=`🤝 Равенство: ${winners.join(' и ')} (${max} т.)`;return {winners,max}}
    display.innerText=`🏆 Победител: ${winners[0]} (${max} т.)`;return {winners,max};
}
function addGame(){
    const input=document.getElementById('gameInput'),name=input.value.trim(),type=document.getElementById('gameTypeInput').value;
    if(!name)return alert('Моля, въведи име на игра.');
    if(Object.keys(myGamesObj).some(g=>g.toLowerCase()===name.toLowerCase()))return alert('Тази игра вече съществува.');
    myGamesObj[name]=type;saveAll();input.value='';updateUI();alert('Играта е добавена успешно!');
}
function addPlayer(){
    const input=document.getElementById('playerInput'),name=input.value.trim();
    if(!name)return alert('Моля, въведи име на играч.');
    if(myPlayers.some(p=>p.toLowerCase()===name.toLowerCase()))return alert('Този играч вече съществува.');
    myPlayers.push(name);saveAll();input.value='';updateUI();alert('Играчът е добавен успешно!');
}
function removePlayer(name){
    if(!confirm(`Сигурен ли си, че искаш да изтриеш играча "${name}" от списъка? Историята му няма да бъде изтрита.`))return;
    myPlayers=myPlayers.filter(p=>p!==name);saveAll();updateUI();
}
function logGame(){
    const game=document.getElementById('gameSelect').value;if(!game)return alert('Моля, избери игра!');
    const checked=[...document.querySelectorAll('.player-card input[type=checkbox]:checked')];
    if(currentLogFilter==='coop'){
        if(!checked.length)return alert('Моля, избери поне един играч за отбора!');
        if(!selectedCoopResult)return alert('Моля, избери победа или загуба!');
        const participants=checked.map(cb=>cb.closest('.player-card').querySelector('.player-name').textContent);
        gameLogs.push({game,type:'coop',participants,coopResult:selectedCoopResult,date:new Date().toISOString()});
    }else{
        if(checked.length<2)return alert('Моля, избери поне 2 играчи!');
        const result=calculateWinner();if(!result)return alert('Моля, попълни точките на всички участници.');
        const scores={};checked.forEach(cb=>{const p=cb.closest('.player-card').querySelector('.player-name').textContent;scores[p]=Number(document.getElementById('score_'+idSafe(p)).value)});
        gameLogs.push({game,type:'pvp',scores,winners:result.winners,winner:result.winners[0],date:new Date().toISOString()});
    }
    saveAll();
    const status=document.getElementById('logStatus');status.className='success';
    status.innerText=`Успешно записано: ${game} ✓`;
    setTimeout(()=>status.innerText='',4000);
    resetEntryForm();updateUI();
}
function resetEntryForm(){
    selectedCoopResult=null;
    const select=document.getElementById('gameSelect');if(select)select.value='';
    document.querySelectorAll('.player-card input[type=checkbox]').forEach(x=>x.checked=false);
    document.querySelectorAll('.player-score-input').forEach(x=>{x.value='';x.disabled=true});
}
function clearAllLogs(){
    if(!gameLogs.length)return alert('Историята вече е празна.');
    if(confirm('Сигурен ли си, че искаш да изтриеш цялата история? Това действие не може да бъде отменено без архив.')){
        gameLogs=[];saveAll();showStats();
    }
}
function resetToDefaultGames(){
    if(confirm('Да се възстановят ли стандартните игри? Това няма да изтрие историята.')){
        myGamesObj={...initialGames};saveAll();updateUI();alert('Стандартните игри са възстановени.');
    }
}
function refreshStats(){
    showStats();
    const activePanel = document.querySelector('.stats-panel.active');
    if(activePanel.id === 'statsDetailPanel') renderDetailedStats();
    if(activePanel.id === 'statsPlayerPanel') renderPlayerStats();
}
function showStatsPanel(panel){
    document.querySelectorAll('.stats-nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.stats-panel').forEach(p=>p.classList.remove('active'));

    if(panel==='overview'){
        document.getElementById('statsOverviewBtn').classList.add('active');
        document.getElementById('statsOverviewPanel').classList.add('active');
        showStats();
    }else if(panel==='detail'){
        document.getElementById('statsDetailBtn').classList.add('active');
        document.getElementById('statsDetailPanel').classList.add('active');
        populateDetailGameSelect();
        renderDetailedStats();
    }else if(panel==='player'){
        document.getElementById('statsPlayerBtn').classList.add('active');
        document.getElementById('statsPlayerPanel').classList.add('active');
        populatePlayerSelector();
        renderPlayerStats();
    }
}
let detailScope='all';
function setDetailScope(scope){
    detailScope=scope;
    document.getElementById('detailAllBtn').classList.toggle('active',scope==='all');
    document.getElementById('detailSpecificBtn').classList.toggle('active',scope==='specific');
    document.getElementById('detailGameSelect').style.display=scope==='specific'?'block':'none';
    if(scope==='specific') populateDetailGameSelect();
    renderDetailedStats();
}
function populateDetailGameSelect(){
    const select=document.getElementById('detailGameSelect');
    const old=select.value;
    const games=[...new Set(gameLogs.map(l=>l.game))].sort((a,b)=>a.localeCompare(b,'bg'));
    select.innerHTML=games.length
        ? games.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')
        : '<option value="">Няма записани игри</option>';
    if(games.includes(old))select.value=old;
}
function getAllPlayersList(){
    const set = new Set(myPlayers);
    gameLogs.forEach(l => {
        if(l.type==='pvp' && l.scores) Object.keys(l.scores).forEach(p => set.add(p));
        if(l.type==='coop' && l.participants) l.participants.forEach(p => set.add(p));
    });
    return [...set].sort((a,b)=>a.localeCompare(b,'bg'));
}
function populatePlayerSelector(){
    const bar=document.getElementById('playerSelectorBar');
    const players = getAllPlayersList();
    
    if(!players.length){
        bar.innerHTML='<span class="small">Няма намерени играчи.</span>';
        selectedStatPlayer=null;
        return;
    }
    if(!selectedStatPlayer || !players.includes(selectedStatPlayer)){
        selectedStatPlayer=players[0];
    }
    bar.innerHTML=players.map(p=>`<button type="button" class="player-filter-btn ${p===selectedStatPlayer?'active':''}" onclick="setStatPlayer('${esc(p)}')">${esc(p)}</button>`).join('');
}
function setStatPlayer(player){
    selectedStatPlayer=player;
    populatePlayerSelector();
    renderPlayerStats();
}
function renderPlayerStats(){
    const out=document.getElementById('statsPlayerOutput');
    const players = getAllPlayersList();
    if(!players.length){out.innerHTML='<div class="empty">Все още няма добавени играчи.</div>';return}
    if(!selectedStatPlayer || !players.includes(selectedStatPlayer)){
        selectedStatPlayer = players[0];
    }

    const p = selectedStatPlayer;
    const pvpLogs = gameLogs.filter(l => l.type === 'pvp' && l.scores && Object.prototype.hasOwnProperty.call(l.scores, p));
    const coopLogs = gameLogs.filter(l => l.type === 'coop' && (l.participants||[]).includes(p));
    const totalMatches = pvpLogs.length + coopLogs.length;

    let totalWins = 0;
    pvpLogs.forEach(l => { if((l.winners||[l.winner]).includes(p)) totalWins++; });
    coopLogs.forEach(l => { if(l.coopResult === 'win') totalWins++; });

    const totalRate = totalMatches ? (totalWins / totalMatches) * 100 : 0;

    const gameStatsMap = {};
    [...pvpLogs, ...coopLogs].forEach(l => {
        if(!gameStatsMap[l.game]) gameStatsMap[l.game] = {played: 0, wins: 0, losses: 0, pvpPlayed: 0, pvpWins: 0};
        gameStatsMap[l.game].played++;
        
        let isWin = false;
        if(l.type === 'pvp'){
            gameStatsMap[l.game].pvpPlayed++;
            if((l.winners||[l.winner]).includes(p)){
                isWin = true;
                gameStatsMap[l.game].pvpWins++;
            }
        } else {
            if(l.coopResult === 'win') isWin = true;
        }

        if(isWin) gameStatsMap[l.game].wins++;
        else gameStatsMap[l.game].losses++;
    });

    let favGame = '-';
    let maxPlayed = -1;
    Object.entries(gameStatsMap).forEach(([g, data]) => {
        if(data.played > maxPlayed){ maxPlayed = data.played; favGame = `${g} (${data.played} партии)`; }
    });

    let topWinGame = '-';
    let maxWins = -1;
    Object.entries(gameStatsMap).forEach(([g, data]) => {
        if(data.wins > maxWins){ maxWins = data.wins; topWinGame = `${g} (${data.wins} победи)`; }
    });

    let topLossGame = '-';
    let maxLosses = -1;
    Object.entries(gameStatsMap).forEach(([g, data]) => {
        if(data.losses > maxLosses){ maxLosses = data.losses; topLossGame = `${g} (${data.losses} загуби)`; }
    });

    let html = `<div class="game-stats-box" style="border-left: 4px solid var(--green);">
        <h3>👤 Личен профил: ${esc(p)}</h3>
        <div class="dashboard" style="margin-top:15px">
            <div class="stat-card"><div class="num">${totalMatches}</div><div class="label">Общо партии</div></div>
            <div class="stat-card"><div class="num">${totalWins}</div><div class="label">Общо победи</div></div>
            <div class="stat-card"><div class="num">${totalRate.toFixed(1)}%</div><div class="label">Общ Win rate</div></div>
            <div class="stat-card"><div class="num">${Object.keys(gameStatsMap).length}</div><div class="label">Играни игри</div></div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0">
            <div class="stat-card" style="text-align:left;padding:14px">
                <div class="small" style="color:var(--muted)">❤️ Най-играна игра (Любима)</div>
                <div style="font-weight:bold;font-size:15px;margin-top:4px">${esc(favGame)}</div>
            </div>
            <div class="stat-card" style="text-align:left;padding:14px">
                <div class="small" style="color:var(--muted)">🏆 Игра с най-много победи</div>
                <div style="font-weight:bold;font-size:15px;margin-top:4px;color:var(--green-dark)">${esc(topWinGame)}</div>
            </div>
            <div class="stat-card" style="text-align:left;padding:14px">
                <div class="small" style="color:var(--muted)">❌ Игра с най-много загуби</div>
                <div style="font-weight:bold;font-size:15px;margin-top:4px;color:#991b1b">${esc(topLossGame)}</div>
            </div>
        </div>

        <h3 style="margin-top:20px">📊 Статистика по отделни игри</h3>
        <div class="table-responsive"><table>
        <tr><th>Игра</th><th>Тип</th><th>Партии</th><th>Победи</th><th>Загуби</th><th>Win rate</th></tr>`;

    const sortedGames = Object.entries(gameStatsMap).sort((a,b)=>b[1].played - a[1].played);
    
    if(!sortedGames.length){
        html += `<tr><td colspan="6" class="empty">Няма записани игри за този играч.</td></tr>`;
    } else {
        sortedGames.forEach(([game, data]) => {
            const gameType = myGamesObj[game] === 'coop' ? 'Co-op' : 'PvP';
            const rate = data.played ? (data.wins / data.played) * 100 : 0;
            
            let barColor = 'var(--green)';
            if(rate < 40) barColor = 'var(--red)';
            else if(rate < 70) barColor = '#ffc107';

            let winDisplay = data.wins;
            let tdClass = '';
            if(gameType === 'PvP' && data.pvpPlayed > 0){
                const gLogs = gameLogs.filter(l => l.game === game && l.type === 'pvp');
                const playerGameWinsMap = {};
                gLogs.forEach(l => {
                    (l.winners || [l.winner]).forEach(w => { if(w) playerGameWinsMap[w] = (playerGameWinsMap[w]||0)+1; });
                });
                const maxW = Object.values(playerGameWinsMap).length ? Math.max(...Object.values(playerGameWinsMap)) : 0;
                const topWCount = Object.values(playerGameWinsMap).filter(w => w === maxW).length;
                
                if(maxW > 0 && (playerGameWinsMap[p]||0) === maxW){
                    if(topWCount > 1){
                        tdClass = 'tie-score';
                        winDisplay = `${data.wins} 🏅`;
                    } else {
                        tdClass = 'winner-score';
                        winDisplay = `${data.wins} 🏆`;
                    }
                }
            } else if(gameType === 'Co-op'){
                winDisplay = `🏆 ${data.wins}`;
            }

            html += `<tr>
                <td><b>${esc(game)}</b></td>
                <td>${gameType}</td>
                <td>${data.played}</td>
                <td class="${tdClass}">${winDisplay}</td>
                <td style="color:${data.losses>0?'#991b1b':'inherit'}">${data.losses}</td>
                <td>
                    <div class="winrate-bar-container">
                        <div class="winrate-track">
                            <div class="winrate-fill" style="width:${rate}%; background-color:${barColor};"></div>
                        </div>
                        <div class="winrate-text">${rate.toFixed(1)}%</div>
                    </div>
                </td>
            </tr>`;
        });
    }

    html += `</table></div></div>`;
    out.innerHTML = html;
}

function showStats(){
    const out=document.getElementById('statsOverviewOutput');
    if(!gameLogs.length){
        out.innerHTML='<div class="empty">Все още няма записани партии.</div>';
        return;
    }

    const total=gameLogs.length;
    const pvp=gameLogs.filter(x=>x.type==='pvp').length;
    const coop=total-pvp;
    const wins={};
    const playersSet=new Set();

    gameLogs.forEach(l=>{
        if(l.type==='pvp'){
            Object.keys(l.scores||{}).forEach(p=>playersSet.add(p));
            (l.winners||[l.winner]).forEach(w=>{if(w)wins[w]=(wins[w]||0)+1});
        }else{
            (l.participants||[]).forEach(p=>playersSet.add(p));
        }
    });

    let html=`<div class="dashboard">
        <div class="stat-card"><div class="num">${total}</div><div class="label">Общо партии</div></div>
        <div class="stat-card"><div class="num">${pvp}</div><div class="label">PvP</div></div>
        <div class="stat-card"><div class="num">${coop}</div><div class="label">Co-op</div></div>
        <div class="stat-card"><div class="num">${Object.keys(myGamesObj).length}</div><div class="label">Игри в колекцията</div></div>
    </div>`;

    html+=`<div class="game-stats-box">
        <h3>🏆 Обща класация</h3>
        <div class="table-responsive"><table>
        <tr><th>Играч</th><th>Победи</th><th>Win rate</th><th>Победи / Загуби (П/З)</th></tr>`;

    const sortedPlayers = [...playersSet].map(p=>{
        const matches=gameLogs.filter(l=>l.type==='pvp'&&l.scores&&Object.prototype.hasOwnProperty.call(l.scores,p));
        const w=wins[p]||0;
        const losses = matches.length - w;
        return {p,matches:matches.length,w,losses,rate:matches.length?w/matches.length*100:0};
    }).sort((a,b)=>b.w-a.w||b.rate-a.rate);

    const maxWinsGlobal = sortedPlayers.length ? Math.max(...sortedPlayers.map(x => x.w)) : 0;
    const topWinnersCount = sortedPlayers.filter(x => x.w > 0 && x.w === maxWinsGlobal).length;

    sortedPlayers.forEach((x)=>{
        const isWinner = (x.w > 0 && x.w === maxWinsGlobal);
        let tdClass = '';
        let winDisplay = x.w;
        if(isWinner){
            if(topWinnersCount > 1){
                tdClass = 'tie-score';
                winDisplay = `${x.w} 🏅`;
            } else {
                tdClass = 'winner-score';
                winDisplay = `${x.w} 🏆`;
            }
        }
        
        let barColor = 'var(--green)';
        if(x.rate < 40) barColor = 'var(--red)';
        else if(x.rate < 70) barColor = '#ffc107';

        const rateVisual = `<div class="winrate-bar-container" style="justify-content:center"><div class="winrate-track" style="max-width:90px"><div class="winrate-fill" style="width:${x.rate}%; background-color:${barColor};"></div></div><div class="winrate-text">${x.rate.toFixed(1)}%</div></div>`;

        html+=`<tr><td><b>${esc(x.p)}</b></td><td class="${tdClass}">${winDisplay}</td><td>${rateVisual}</td><td>${x.w} / ${x.losses}</td></tr>`;
    });

    html+='</table></div></div>';

    const activePlayers = myPlayers.slice(0, 2);
    const pvpLogsOnly = gameLogs.filter(l => l.type === 'pvp');
    const coopLogsOnly = gameLogs.filter(l => l.type === 'coop');

    if(pvpLogsOnly.length){
        html+=`<div class="game-stats-box">
            <h3>⚔️ Състезателни игри (PvP) с най-много партии</h3>
            <div class="table-responsive"><table>
            <tr><th>Игра</th><th>Партии</th>`;
        activePlayers.forEach(p => html += `<th>${esc(p)} победи</th>`);
        html += `</tr>`;

        const pvpCounts={};
        pvpLogsOnly.forEach(l=>pvpCounts[l.game]=(pvpCounts[l.game]||0)+1);
        
        Object.entries(pvpCounts).sort((a,b)=>b[1]-a[1]).forEach(([game,count])=>{
            html+=`<tr><td><b>${esc(game)}</b></td><td>${count}</td>`;
            
            const gameWinsMap = {};
            activePlayers.forEach(p => {
                gameWinsMap[p] = pvpLogsOnly.filter(l => l.game === game && (l.winners||[l.winner]).includes(p)).length;
            });
            const maxGameWins = Math.max(...Object.values(gameWinsMap), 0);
            const topGameWinnersCount = activePlayers.filter(p => gameWinsMap[p] > 0 && gameWinsMap[p] === maxGameWins).length;

            activePlayers.forEach(p => {
                const playerGameWins = gameWinsMap[p];
                const isGameTop = (maxGameWins > 0 && playerGameWins === maxGameWins);
                let cellClass = '';
                let cellText = playerGameWins;
                if(isGameTop){
                    if(topGameWinnersCount > 1){
                        cellClass = 'tie-score';
                        cellText = `${playerGameWins} 🏅`;
                    } else {
                        cellClass = 'winner-score';
                        cellText = `${playerGameWins} 🏆`;
                    }
                }
                html+=`<td class="${cellClass}">${cellText}</td>`;
            });
            html+=`</tr>`;
        });
        html+='</table></div></div>';
    }

    if(coopLogsOnly.length){
        html+=`<div class="game-stats-box">
            <h3>🤝 Кооперативни игри (Co-op) с най-много партии</h3>
            <div class="table-responsive"><table>
            <tr><th>Игра</th><th>Партии</th><th>Победи</th><th>Загуби</th><th>Win rate</th></tr>`;

        const coopCounts={};
        coopLogsOnly.forEach(l=>coopCounts[l.game]=(coopCounts[l.game]||0)+1);
        
        Object.entries(coopCounts).sort((a,b)=>b[1]-a[1]).forEach(([game,count])=>{
            const cWins = coopLogsOnly.filter(l => l.game === game && l.coopResult === 'win').length;
            const cLosses = count - cWins;
            const cRate = count ? (cWins / count) * 100 : 0;
            
            let barColor = 'var(--green)';
            if(cRate < 40) barColor = 'var(--red)';
            else if(cRate < 70) barColor = '#ffc107';

            const rateVisual = `<div class="winrate-bar-container"><div class="winrate-track"><div class="winrate-fill" style="width:${cRate}%; background-color:${barColor};"></div></div><div class="winrate-text">${cRate.toFixed(1)}%</div></div>`;

            html+=`<tr><td><b>${esc(game)}</b></td><td>${count}</td><td style="color:var(--green-dark)">🏆 ${cWins}</td><td style="color:#991b1b">❌ ${cLosses}</td><td>${rateVisual}</td></tr>`;
        });
        html+='</table></div></div>';
    }

    out.innerHTML=html;
}

function renderDetailedStatsForSingleGame(gameName, gameLogsList){
    const pvpLogs = gameLogsList.filter(l => l.type === 'pvp');
    const coopLogs = gameLogsList.filter(l => l.type === 'coop');

    let html = `<div class="game-stats-box" style="margin-top:20px; border-left: 4px solid var(--blue);">
        <h3>🔎 ${esc(gameName)}</h3>`;

    if(pvpLogs.length){
        const players = [];
        pvpLogs.forEach(l => Object.keys(l.scores || {}).forEach(p => { if(!players.includes(p)) players.push(p); }));

        const stats = players.map(p => {
            const matches = pvpLogs.filter(l => l.scores && l.scores[p] !== undefined);
            const wins = matches.filter(l => (l.winners || [l.winner]).includes(p)).length;
            const scores = matches.map(l => Number(l.scores[p]));
            return {
                p, matches: matches.length, wins,
                rate: matches.length ? wins / matches.length * 100 : 0,
                avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0,
                best: scores.length ? Math.max(...scores) : 0
            };
        }).sort((a, b) => b.wins - a.wins || b.rate - a.rate);

        const maxWinsGame = stats.length ? Math.max(...stats.map(x => x.wins)) : 0;
        const topGameStatsWinners = stats.filter(x => x.wins > 0 && x.wins === maxWinsGame).length;

        html += `<h3 style="margin-top:10px">⚔️ PvP статистика</h3>
        <div class="table-responsive"><table>
        <tr><th>Играч</th><th>Партии</th><th>Победи</th><th>Win rate</th><th>Средни точки</th><th>Най-висок резултат</th></tr>`;

        stats.forEach(x => {
            const isGameWinner = (x.wins > 0 && x.wins === maxWinsGame);
            let tdClass = '';
            let winDisplay = x.wins;
            if(isGameWinner){
                if(topGameStatsWinners > 1){
                    tdClass = 'tie-score';
                    winDisplay = `${x.wins} 🏅`;
                } else {
                    tdClass = 'winner-score';
                    winDisplay = `${x.wins} 🏆`;
                }
            }

            let barColor = 'var(--green)';
            if(x.rate < 40) barColor = 'var(--red)';
            else if(x.rate < 70) barColor = '#ffc107';

            const rateVisual = `<div class="winrate-bar-container"><div class="winrate-track"><div class="winrate-fill" style="width:${x.rate}%; background-color:${barColor};"></div></div><div class="winrate-text">${x.rate.toFixed(1)}%</div></div>`;

            html += `<tr><td><b>${esc(x.p)}</b></td><td>${x.matches}</td><td class="${tdClass}">${winDisplay}</td><td>${rateVisual}</td><td>${x.avg.toFixed(1)}</td><td>${x.best}</td></tr>`;
        });
        html += '</table></div>';

        const gamePlayers = players.slice(0, 2);
        const p1 = gamePlayers[0] || 'Играч 1';
        const p2 = gamePlayers[1] || 'Играч 2';

        html += `<h3 style="margin-top:18px">📜 История на партиите</h3>
        <div class="table-responsive"><table>
        <tr><th>Дата</th><th>${esc(p1)}</th><th>${esc(p2)}</th></tr>`;

        pvpLogs.slice().reverse().forEach(l => {
            const scores = l.scores || {};
            const val1 = scores[p1] !== undefined ? scores[p1] : '-';
            const val2 = scores[p2] !== undefined ? scores[p2] : '-';
            const winnersArr = l.winners || [l.winner];

            const isP1Winner = winnersArr.includes(p1);
            const isP2Winner = winnersArr.includes(p2);
            const isTieMatch = winnersArr.length > 1 && isP1Winner && isP2Winner;

            let tdClass1 = '';
            let tdClass2 = '';
            let text1 = val1 !== '-' ? String(val1) : '-';
            let text2 = val2 !== '-' ? String(val2) : '-';

            if (isTieMatch) {
                if (val1 !== '-') tdClass1 = 'tie-score';
                if (val2 !== '-') tdClass2 = 'tie-score';
                if (text1 !== '-') text1 += ' 🏅';
                if (text2 !== '-') text2 += ' 🏅';
            } else {
                if (isP1Winner && val1 !== '-') { tdClass1 = 'winner-score'; text1 += ' 🏆'; }
                if (isP2Winner && val2 !== '-') { tdClass2 = 'winner-score'; text2 += ' 🏆'; }
            }

            html += `<tr><td>${formatDate(l.date)}</td><td class="${tdClass1}">${esc(text1)}</td><td class="${tdClass2}">${esc(text2)}</td></tr>`;
        });
        html += '</table></div>';
    }

    if(coopLogs.length){
        const cWins = coopLogs.filter(l => l.coopResult === 'win').length;
        const cLosses = coopLogs.length - cWins;
        const cRate = (cWins / coopLogs.length) * 100;

        let barColor = 'var(--green)';
        if(cRate < 40) barColor = 'var(--red)';
        else if(cRate < 70) barColor = '#ffc107';

        const rateVisual = `<div class="winrate-bar-container"><div class="winrate-track"><div class="winrate-fill" style="width:${cRate}%; background-color:${barColor};"></div></div><div class="winrate-text">${cRate.toFixed(1)}%</div></div>`;

        html += `<h3 style="margin-top:18px">🤝 Co-op статистика</h3>
        <div class="table-responsive"><table>
        <tr><th>Общо партии</th><th>Победи</th><th>Загуби</th><th>Win rate</th></tr>
        <tr><td>${coopLogs.length}</td><td class="coop-win">🏆 ${cWins}</td><td class="coop-lose">❌ ${cLosses}</td><td>${rateVisual}</td></tr>
        </table></div>

        <h3 style="margin-top:18px">📜 История на партиите</h3>
        <div class="table-responsive"><table>
        <tr><th>Дата</th><th>Участници</th><th>Резултат</th></tr>`;

        coopLogs.slice().reverse().forEach(l => {
            const isWin = l.coopResult === 'win';
            html += `<tr><td>${formatDate(l.date)}</td><td>${esc((l.participants || []).join(', '))}</td><td class="${isWin ? 'coop-win' : 'coop-lose'}">${isWin ? '🏆 Победа' : '❌ Загуба'}</td></tr>`;
        });
        html += '</table></div>';
    }

    html += `</div>`;
    return html;
}

function renderDetailedStats(){
    const out=document.getElementById('statsDetailOutput');
    if(!gameLogs.length){out.innerHTML='<div class="empty">Все още няма записани партии.</div>';return}

    if(detailScope==='all'){
        const games=[...new Set(gameLogs.map(l=>l.game))].sort((a,b)=>a.localeCompare(b,'bg'));
        let html='';
        games.forEach(g=>{
            html+=renderDetailedStatsForSingleGame(g, gameLogs.filter(l=>l.game===g));
        });
        out.innerHTML=html;
    }else{
        const select=document.getElementById('detailGameSelect');
        const game=select.value;
        if(!game){out.innerHTML='<div class="empty">Избери игра от списъка.</div>';return}
        out.innerHTML=renderDetailedStatsForSingleGame(game, gameLogs.filter(l=>l.game===game));
    }
}

    const data={myGamesObj,myPlayers,gameLogs};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);

}
function importBackup(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(evt){
        try{
            const data=JSON.parse(evt.target.result);
            if(data.myGamesObj)myGamesObj=data.myGamesObj;
            if(data.myPlayers)myPlayers=data.myPlayers;
            if(data.gameLogs)gameLogs=data.gameLogs;
            saveAll();updateUI();alert('Архивът е възстановен успешно!');
        }catch(err){alert('Грешка при четене на JSON файла.')}
    };
    reader.readAsText(file);
    e.target.value='';
}
function exportCsvData(){
    if(!gameLogs.length)return alert('Няма история за изэкспортиране.');
    let csv='Game,Type,Date,Result/Winner,Participants/Scores\n';
    gameLogs.forEach(l=>{
        const date=l.date||'';
        const game=`"${(l.game||'').replace(/"/g,'""')}"`;
        const type=l.type||'pvp';
        if(type==='coop'){
            const res=l.coopResult==='win'?'Win':'Lose';
            const parts=`"${(l.participants||[]).join('; ').replace(/"/g,'""')}"`;
            csv+=`${game},coop,${date},${res},${parts}\n`;
        }else{
            const winner=`"${(l.winner||(l.winners||[]).join('; ')).replace(/"/g,'""')}"`;
            const scoresObj=l.scores||{};
            const scoresStr=`"${Object.entries(scoresObj).map(([p,s])=>`${p}:${s}`).join('; ').replace(/"/g,'""')}"`;
            csv+=`${game},pvp,${date},${winner},${scoresStr}\n`;
        }
    });
    const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`board-game-tracker-history-${new Date().toISOString().slice(0,10)}.csv`;a.click();
    URL.revokeObjectURL(url);
}
function importCsvData(){
    const input=document.getElementById('csvFileInput');
    const file=input.files[0];if(!file)return alert('Моля, избери CSV файл.');
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const text=e.target.result;
            const lines=text.split(/\r\n|\n/).filter(l=>l.trim());
            if(lines.length<2)return alert('CSV файлът е празен или с грешен формат.');
            let importedCount=0;
            for(let i=1;i<lines.length;i++){
                const row=parseCsvLine(lines[i]);
                if(row.length>=5){
                    const [game,type,date,resOrWin,partsOrScores]=row;
                    if(game&&type){
                        if(!myGamesObj[game])myGamesObj[game]=type==='coop'?'coop':'pvp';
                        if(type==='coop'){
                            const coopResult=resOrWin.toLowerCase().includes('win')?'win':'lose';
                            const participants=partsOrScores.split(';').map(s=>s.trim()).filter(Boolean);
                            participants.forEach(p=>{if(!myPlayers.includes(p))myPlayers.push(p)});
                            gameLogs.push({game,type:'coop',participants,coopResult,date:date||new Date().toISOString()});
                            importedCount++;
                        }else{
                            const scores={};
                            partsOrScores.split(';').forEach(item=>{
                                const parts=item.split(':');
                                if(parts.length===2){
                                    const p=parts[0].trim(),s=Number(parts[1].trim());
                                    if(p&&!isNaN(s)){scores[p]=s;if(!myPlayers.includes(p))myPlayers.push(p);}
                                }
                            });
                            if(Object.keys(scores).length>0){
                                const max=Math.max(...Object.values(scores));
                                const winners=Object.keys(scores).filter(p=>scores[p]===max);
                                gameLogs.push({game,type:'pvp',scores,winners,winner:winners[0],date:date||new Date().toISOString()});
                                importedCount++;
                            }
                        }
                    }
                }
            }
            saveAll();updateUI();
            alert(`Успешно импортирани ${importedCount} записа!`);
            input.value='';
        }catch(err){alert('Грешка при парсиране на CSV файла.')}
    };
    reader.readAsText(file);
}
function parseCsvLine(text){
    let ret=[];let cur='';let inQuote=false;
    for(let i=0;i<text.length;i++){
        let c=text[i];
        if(c==='"'){
            if(inQuote&&text[i+1]==='"'){cur+='"';i++;}
            else{inQuote=!inQuote;}
        }else if(c===','&&!inQuote){ret.push(cur);cur='';}
        else{cur+=c;}
    }
    ret.push(cur);
    return ret.map(s=>s.trim());
}
