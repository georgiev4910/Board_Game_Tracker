/* UX polish: safe-area + reduced motion + focus */
html { height: 100%; }
body {
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 2px;
}


/* ===== Companion motion polish (sync with main app) ===== */
html { scroll-behavior: smooth; }
body {
  animation: compPageIn .45s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compPageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
/* Interactive controls */
button, .btn, a.btn, [type="button"], [role="button"],
select, .chip, .tab, .mode-btn, .filter-btn {
  transition:
    transform .16s cubic-bezier(.34, 1.45, .64, 1),
    box-shadow .18s ease,
    filter .18s ease,
    background-color .18s ease,
    border-color .18s ease,
    opacity .18s ease !important;
}
button:hover, .btn:hover, a.btn:hover, [type="button"]:hover {
  filter: brightness(1.06);
}
button:active, .btn:active, a.btn:active, [type="button"]:active {
  transform: scale(0.97) !important;
}
/* Cards / panels */
.card, .panel, .box, .game-card, .tile-card, .spirit-card,
[class*="rounded-2xl"], [class*="rounded-xl"], [class*="rounded-lg"] {
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
/* Soft reveal for main content blocks */
main, .container, .app, #app, .content, .wrapper {
  animation: compFade .5s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compFade {
  from { opacity: 0.01; }
  to { opacity: 1; }
}
/* Sticky chrome */
header, .top-chrome, .sticky-header, nav.sticky, .navbar {
  backdrop-filter: saturate(1.2) blur(12px);
  -webkit-backdrop-filter: saturate(1.2) blur(12px);
}
/* Toast / result pop */
.toast, .result, .winner-display, .alert, .banner {
  animation: compPop .35s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compPop {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: none; }
}
/* List stagger helper */
.comp-stagger > * {
  animation: compCascade .4s cubic-bezier(.22, 1, .36, 1) both;
}
.comp-stagger > *:nth-child(1) { animation-delay: .02s; }
.comp-stagger > *:nth-child(2) { animation-delay: .06s; }
.comp-stagger > *:nth-child(3) { animation-delay: .1s; }
.comp-stagger > *:nth-child(4) { animation-delay: .14s; }
.comp-stagger > *:nth-child(5) { animation-delay: .18s; }
.comp-stagger > *:nth-child(6) { animation-delay: .22s; }
.comp-stagger > *:nth-child(7) { animation-delay: .26s; }
.comp-stagger > *:nth-child(8) { animation-delay: .3s; }
@keyframes compCascade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
/* Focus visible for accessibility */
button:focus-visible, a:focus-visible, select:focus-visible {
  outline: 2px solid rgba(96, 165, 250, .7);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  body, main, .container, .app, #app, .content, .wrapper,
  .toast, .result, .winner-display, .comp-stagger > * {
    animation: none !important;
  }
  button, .btn, a.btn, [type="button"] {
    transition: none !important;
  }
}

    function loadParticipantsFromTracker() {
      try {
        const savedPlayers = localStorage.getItem('myPlayers');
        if (savedPlayers) {
          const names = JSON.parse(savedPlayers);
          if (Array.isArray(names) && names.length > 0) {
            return names.map(name => ({ name: name, assignedSpirit: null, assignedAspect: null }));
          }
        }
      } catch (e) {}
      return [
        { name: "Играч 1", assignedSpirit: null, assignedAspect: null },
        { name: "Играч 2", assignedSpirit: null, assignedAspect: null }
      ];
    }

    let store = {
      participants: loadParticipantsFromTracker(),
      complexityFilters: ["Low", "Moderate", "High", "Very High"],
      currentScreen: 'HomeScreen',
      settings: {
        adversaryMode: 'manual',
        selectedAdversary: 'Няма (None)',
        adversaryLevel: 0,
        
        hasSecondaryAdversary: false,
        selectedSecondaryAdversary: 'Няма (None)',
        secondaryAdversaryLevel: 0,

        scenarioMode: 'manual',
        selectedScenario: 'Няма (Standard Game)',
        boardSideMode: 'manual',
        selectedBoardSide: 'Standard Side',

        useEventDeck: true,
        useBlightCard: true
      }
    };

    let navigationHistory = ['HomeScreen'];

    function isExpansionOwned(name) {
      const exp = SPIRIT_DATA.expansions.find(e => e.name === name);
      return exp ? exp.isOwned : false;
    }

    function getAvailableAdversaries() {
      const owned = new Set(SPIRIT_DATA.expansions.filter(e => e.isOwned).map(e => e.name));
      return SPIRIT_DATA.adversaries.filter(a => owned.has(a.exp) || a.name === "Няма (None)").map(a => a.name);
    }

    function getAvailableScenarios() {
      const owned = new Set(SPIRIT_DATA.expansions.filter(e => e.isOwned).map(e => e.name));
      return SPIRIT_DATA.scenarios.filter(s => owned.has(s.exp) || s.name === "Няма (Standard Game)").map(s => s.name);
    }

    function navigateTo(screenName) {
      if (store.currentScreen !== screenName) {
        navigationHistory.push(screenName);
      }
      store.currentScreen = screenName;
      renderApp();
      window.scrollTo(0, 0);
    }

    function goBackStep() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        store.currentScreen = navigationHistory[navigationHistory.length - 1];
        renderApp();
        window.scrollTo(0, 0);
      } else {
        navigateTo('HomeScreen');
      }
    }

    function goToTracker() {
      window.location.href = './index.html#log';
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-surfaceContainer text-white px-3 py-2.5 rounded-xl shadow-xl border border-slate-600 pointer-events-auto flex items-center space-x-2 text-xs transition transform translate-y-2 opacity-0 duration-300';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-sky-300"></i><span class="font-medium">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    
    function softRenderApp() {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const x = window.scrollX || document.documentElement.scrollLeft || 0;
      renderApp();
      requestAnimationFrame(function() {
        window.scrollTo(x, y);
        requestAnimationFrame(function() { window.scrollTo(x, y); });
      });
    }

      currentLang = currentLang === 'bg' ? 'en' : 'bg';
      try { localStorage.setItem('bgCompanionLang', currentLang); } catch(e){}
      var el = document.getElementById('lang-btn-text');
      if(el) el.innerText = currentLang.toUpperCase();
      if(typeof softRenderApp==='function') softRenderApp();
      else if(typeof renderApp==='function') renderApp();
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      switch (store.currentScreen) {
        case 'HomeScreen':
          container.innerHTML = renderHomeScreen();

        case 'ExpansionsScreen':
          container.innerHTML = renderExpansionsScreen();
          break;

          break;
        case 'ExtraSetupScreen':
          container.innerHTML = renderExtraSetupScreen();
          break;

                </linearGradient>

                  <stop offset="70%" stop-color="#15803d" />
                  <stop offset="100%" stop-color="#b45309" />
                </linearGradient>
              </defs>

              <rect width="400" height="150" fill="url(#skyGrad)" />
              <circle cx="200" cy="80" r="45" fill="#fef08a" opacity="0.85" />
              <path d="M 200 25 L 200 135 M 145 80 L 255 80 M 160 40 L 240 120 M 160 120 L 240 40" stroke="#fef08a" stroke-width="2" opacity="0.5" />

              <rect y="135" width="400" height="85" fill="url(#seaGrad)" />

                    </div>

            <button onclick="navigateTo('PlayersSetupScreen')" class="bg-sky-700 hover:bg-sky-600 border border-sky-400/30 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg text-xs transition">Продължи</button>
          </div>

    function toggleExpansion(index) {
      SPIRIT_DATA.expansions[index].isOwned = !SPIRIT_DATA.expansions[index].isOwned;
      softRenderApp();
    }

    function getMaxPlayers() {
      return isExpansionOwned("Jagged Earth") ? 6 : 4;
    }

    function renderPlayersSetupScreen() {
      const maxAllowed = getMaxPlayers();
      if (store.participants.length > maxAllowed) {
        store.participants = store.participants.slice(0, maxAllowed);
      }
      const currentCount = store.participants.length;
      const options = Array.from({ length: maxAllowed }, (_, i) => i + 1);

      return `
        <div class="space-y-4 pb-24">
          <div>
            <h2 class="text-lg font-extrabold text-slate-100">Брой Играчи</h2>
            <p class="text-xs text-slate-400">Задайте участниците в играта ${maxAllowed === 6 ? '(До 6 играча - Jagged Earth)' : '(До 4 играча)'}:</p>
          </div>

          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 flex items-center justify-between">
            <span class="font-bold text-slate-200 text-xs">Брой играчи</span>
            <select onchange="updateParticipantCount(parseInt(this.value))" class="bg-surfaceContainer border border-slate-600 rounded-lg px-3 py-1.5 text-white font-bold text-xs">
              ${options.map(n => `<option value="${n}" ${currentCount === n ? 'selected' : ''}>${n}</option>`).join('')}

              <div class="bg-surface rounded-xl border border-slate-700/50 p-3 flex items-center space-x-2.5">
                <div class="w-7 h-7 rounded-full bg-sky-500/20 text-sky-300 font-bold flex items-center justify-center text-xs border border-sky-400/30">${idx + 1}</div>
                <input type="text" value="${p.name}" oninput="store.participants[${idx}].name = this.value" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2.5 py-1.5 text-white text-xs font-semibold">
              </div>
            `).join('')}

          <div class="absolute bottom-0 left-0 right-0 z-40 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3 flex items-center space-x-2 z-40">

          </div>
        </div>
      `;
    }

    function updateParticipantCount(count) {
      const current = store.participants;
      if (current.length < count) {
        for (let i = current.length; i < count; i++) {
          current.push({ name: `Играч ${i + 1}`, assignedSpirit: null, assignedAspect: null });
        }
      } else if (current.length > count) {
        store.participants = current.slice(0, count);
      }

      // Валидация: Ако сме имали избрана Horizons дъска, а минем над 3 играча, връщаме на Standard
      if (store.participants.length > 3 && store.settings.selectedBoardSide.includes("Horizons")) {
        store.settings.selectedBoardSide = "Standard Side";
      }

      renderApp();
    }

    function toggleComplexityFilter(comp) {
      const index = store.complexityFilters.indexOf(comp);
      if (index > -1) {
        if (store.complexityFilters.length > 1) {
          store.complexityFilters.splice(index, 1);
        } else {
          showToast("Трябва да има поне една избрана сложност!");
          return;
        }
      } else {
        store.complexityFilters.push(comp);
      }
      renderApp();
    }

    function getAvailableSpirits() {
      const ownedExpansions = new Set(SPIRIT_DATA.expansions.filter(e => e.isOwned).map(e => e.name));
      return SPIRIT_DATA.spirits.filter(s => 
        ownedExpansions.has(s.expansion) && store.complexityFilters.includes(s.complexity)
      );
    }

    function randomizeSpirits() {
      const available = getAvailableSpirits();
      if (available.length < store.participants.length) {
        showToast("Няма достатъчно духове за тези филтри!");
        return;
      }
      const shuffled = [...available].sort(() => Math.random() - 0.5);
      store.participants.forEach((p, idx) => {
        p.assignedSpirit = shuffled[idx];
        p.assignedAspect = null;
      });
      renderApp();
      showToast("Духовете са разпределени успешно!");
    }

    function randomizeAspects() {
      let count = 0;
      store.participants.forEach(p => {
        if (p.assignedSpirit && p.assignedSpirit.aspects && p.assignedSpirit.aspects.length > 0) {
          const randIdx = Math.floor(Math.random() * p.assignedSpirit.aspects.length);
          p.assignedAspect = p.assignedSpirit.aspects[randIdx];
          count++;
        }
      });
      renderApp();
      if (count > 0) {
        showToast(`Приложени са Аспекти за ${count} духа!`);
      } else {
        showToast("Никой от избраните духове няма налични аспекти.");
      }
    }

      const complexities = [
        { id: "Low", label: "Low" },
        { id: "Moderate", label: "Moderate" },
        { id: "High", label: "High" },
        { id: "Very High", label: "Very High" }

      return `
        <div class="space-y-4 pb-24">
          <div>
            <h2 class="text-lg font-extrabold text-slate-100">Избор на Духове</h2>
            <p class="text-xs text-slate-400">Настройте филтрите и разпределете духовете.</p>
          </div>

          <div class="bg-surface p-3 rounded-2xl border ${allAssigned ? 'border-sky-400/40' : 'border-amber-500/50 bg-amber-500/5'} space-y-2 text-center">
            <button onclick="randomizeSpirits()" class="w-full bg-gradient-to-r from-sky-700 to-slate-700 hover:from-sky-600 hover:to-slate-600 text-white font-extrabold py-3 px-4 rounded-xl border border-sky-400/30 shadow-md flex items-center justify-center space-x-2 text-xs transition transform active:scale-95">
              <i class="fa-solid fa-dice text-sm text-sky-300"></i>
              <span>${allAssigned ? 'Разбъркай отново Духовете' : 'ГЕНЕРИРАЙ / РАЗБЪРКАЙ ДУХОВЕ'}</span>

            <div class="flex items-center justify-center space-x-1.5 text-[11px] font-semibold ${allAssigned ? 'text-sky-300' : 'text-amber-400'}">
              <i class="fa-solid ${allAssigned ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>
              <span>Статус: ${assignedCount} от ${totalCount} играчи имат дух</span>

            ${hasAspectsAvailable && allAssigned ? `
              <div class="pt-2 border-t border-slate-700/60 flex items-center justify-between">

                <button onclick="randomizeAspects()" class="bg-surfaceContainer hover:bg-slate-600 text-sky-200 border border-sky-400/30 px-2.5 py-1 rounded-lg text-[10px] font-bold transition flex items-center space-x-1">

                  <span>Разбъркай Aspects</span>

          <div class="space-y-1.5 pt-1">

            <div class="flex flex-wrap gap-1.5">
              ${complexities.map(c => {
                const isActive = store.complexityFilters.includes(c.id);
                return `
                  <button onclick="toggleComplexityFilter('${c.id}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold transition border flex items-center space-x-1.5 ${isActive ? 'bg-sky-700 text-white border-sky-400 shadow-sm' : 'bg-surface text-slate-400 border-slate-700/60'}">
                    <i class="fa-solid ${isActive ? 'fa-check text-[10px]' : 'fa-plus text-[9px] opacity-60'}"></i>
                    <span>${c.label}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <div class="space-y-2.5 pt-1">
            <h3 class="text-[10px] font-bold text-sky-300 uppercase tracking-wider">Разпределени духове:</h3>
            ${store.participants.map((p, idx) => `
              <div class="bg-surface rounded-xl border ${p.assignedSpirit ? 'border-sky-400/30' : 'border-red-900/50 bg-red-950/10'} p-3 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-slate-100 text-xs sm:text-sm flex items-center space-x-2">

                    <span>${p.name}</span>

                    `<span class="text-[9px] font-bold text-red-400 bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20">Неразпределен</span>`

                <div class="pt-1.5 border-t border-slate-700/60 flex items-center justify-between">
                  <div>
                    <div class="text-xs font-bold text-sky-200">
                      ${p.assignedSpirit ? p.assignedSpirit.name : '<span class="text-slate-500 italic font-normal">Натиснете бутона за избор</span>'}
                      ${p.assignedAspect ? `<span class="ml-1 text-amber-300 text-[10px] font-extrabold bg-amber-500/20 px-1.5 py-0.5 rounded border border-amber-500/30">[Aspect: ${p.assignedAspect}]</span>` : ''}

                    ${p.assignedSpirit ? `<div class="text-[10px] text-slate-400">${p.assignedSpirit.expansion}</div>` : ''}
                  </div>

                  ${p.assignedSpirit ? `
                    <div class="flex space-x-1">
                      ${p.assignedSpirit.elements.map(elName => {
                        const el = ELEMENTS[elName];
                        return `<span title="${el.name}" class="w-6 h-6 rounded-md border flex items-center justify-center text-[11px] ${el.color}"><i class="fa-solid ${el.icon}"></i></span>`;

                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="absolute bottom-0 left-0 right-0 z-40 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3 flex items-center space-x-2 z-40">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-semibold py-2.5 px-3 rounded-xl border border-slate-700 text-xs transition">Назад</button>
            <button onclick="navigateTo('ExtraSetupScreen')" class="flex-1 bg-sky-700 hover:bg-sky-600 border border-sky-400/30 text-white font-bold py-2.5 px-3 rounded-xl shadow-lg text-xs transition">Продължи</button>
          </div>
        </div>
      `;
    }

    function randomizeExtras() {
      const advList = getAvailableAdversaries();
      const randAdvIndex = Math.floor(Math.random() * advList.length);
      store.settings.selectedAdversary = advList[randAdvIndex];
      store.settings.adversaryLevel = store.settings.selectedAdversary !== 'Няма (None)' ? Math.floor(Math.random() * 7) : 0;

      if (store.settings.hasSecondaryAdversary) {
        const advList2 = advList.filter(a => a !== store.settings.selectedAdversary);
        store.settings.selectedSecondaryAdversary = advList2[Math.floor(Math.random() * advList2.length)];
        store.settings.secondaryAdversaryLevel = store.settings.selectedSecondaryAdversary !== 'Няма (None)' ? Math.floor(Math.random() * 7) : 0;
      }

      const scList = getAvailableScenarios();
      const randScIndex = Math.floor(Math.random() * scList.length);
      store.settings.selectedScenario = scList[randScIndex];
      store.settings.scenarioMode = 'random';

      // Рандомизиране на дъската с оглед броя играчи
      const playerCount = store.participants.length;
      const availableBoardSides = ["Standard Side", "Thematic Side"];
      if (isExpansionOwned("Horizons of Spirit Island")) {
        if (playerCount <= 2) availableBoardSides.push("Horizons Board (1-2 Players)");
        if (playerCount === 3) availableBoardSides.push("Horizons Board (3 Players)");
      }
      store.settings.selectedBoardSide = availableBoardSides[Math.floor(Math.random() * availableBoardSides.length)];
      store.settings.boardSideMode = 'random';

      renderApp();
      showToast("Всички допълнителни елементи бяха разбъркани!");
    }

      const s = store.settings;
      const playerCount = store.participants.length;
      const hasEventsAvailable = isExpansionOwned("Branch & Claw") || isExpansionOwned("Jagged Earth");
      const hasDoubleAdversaryAvailable = isExpansionOwned("Jagged Earth");
      const hasHorizonsAvailable = isExpansionOwned("Horizons of Spirit Island") && playerCount <= 3;

        <div class="space-y-4 pb-24">

              <span class="text-xs font-bold text-sky-300 flex items-center space-x-1.5">

                      <div class="flex space-x-1 border-l border-slate-700/80 pl-2">

                </div>
              `).join('')}

              <h2 class="text-lg font-extrabold text-slate-100">Допълнителни елементи</h2>

            ${hasEventsAvailable ? `
              <div class="bg-surface rounded-xl border border-sky-400/30 p-2.5 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                  <i class="fa-solid fa-bolt text-amber-300 text-sm"></i>

                  </div>
                </div>
                <input type="checkbox" ${s.useEventDeck ? 'checked' : ''} onchange="store.settings.useEventDeck = this.checked; renderApp();" class="w-4 h-4 accent-sky-500 rounded cursor-pointer">
              </div>
            ` : ''}

            <div class="bg-surface rounded-xl border border-slate-700/60 p-2.5 flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <i class="fa-solid fa-skull text-rose-400 text-sm"></i>
                <div>
                  <span class="font-bold text-slate-100 text-xs block leading-none">Blight Card (Заразяване)</span>
                  <span class="text-[9.5px] text-slate-400">Използване на карта за заразен остров</span>
                </div>
              </div>
              <input type="checkbox" ${s.useBlightCard ? 'checked' : ''} onchange="store.settings.useBlightCard = this.checked; renderApp();" class="w-4 h-4 accent-sky-500 rounded cursor-pointer">
            </div>
          </div>

          <!-- 1. ПРОТИВНИК (ADVERSARY) -->
          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-100 text-xs flex items-center space-x-1.5">
                <i class="fa-solid fa-chess-rook text-sky-300"></i>
                <span>Противник (Adversary)</span>
              </span>
              <div class="flex bg-surfaceContainer p-0.5 rounded-lg border border-slate-600 text-[10px]">
                <button onclick="store.settings.adversaryMode = 'manual'; renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.adversaryMode === 'manual' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Manual</button>
                <button onclick="store.settings.adversaryMode = 'random'; const advList = getAvailableAdversaries().filter(a => a !== 'Няма (None)'); store.settings.selectedAdversary = advList[Math.floor(Math.random() * advList.length)]; store.settings.adversaryLevel = Math.floor(Math.random() * 7); renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.adversaryMode === 'random' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Random</button>
              </div>
            </div>

            ${s.adversaryMode === 'manual' ? `
              <div class="space-y-2 pt-1 border-t border-slate-700/60">
                <select onchange="store.settings.selectedAdversary = this.value; renderApp();" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2 py-1.5 text-white text-xs font-semibold">
                  ${availableAdversaries.map(adv => `<option value="${adv}" ${s.selectedAdversary === adv ? 'selected' : ''}>${adv}</option>`).join('')}
                </select>
                ${s.selectedAdversary !== 'Няма (None)' ? `
                  <div class="flex items-center justify-between pt-1">
                    <span class="text-[11px] text-slate-300">Ниво (Level):</span>
                    <select onchange="store.settings.adversaryLevel = parseInt(this.value);" class="bg-surfaceContainer border border-slate-600 rounded-lg px-2.5 py-1 text-white text-xs font-bold">
                      ${[0, 1, 2, 3, 4, 5, 6].map(l => `<option value="${l}" ${s.adversaryLevel === l ? 'selected' : ''}>Level ${l}</option>`).join('')}
                    </select>
                  </div>
                ` : ''}
              </div>
            ` : `
              <div class="pt-1 border-t border-slate-700/60 flex items-center justify-between text-xs">
                <span class="text-sky-300 font-bold"><i class="fa-solid fa-dice text-[10px] mr-1"></i> ${s.selectedAdversary}</span>${s.selectedAdversary !== 'Няма (None)' ? `<span class="bg-sky-400/20 text-sky-300 font-bold px-2 py-0.5 rounded border border-sky-400/30">Level ${s.adversaryLevel}</span>` : ''}
              </div>
            `}

            ${hasDoubleAdversaryAvailable ? `
              <div class="pt-2 border-t border-slate-700/60 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] text-amber-300 font-bold flex items-center space-x-1">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Втори Противник (Jagged Earth)</span>
                  </span>
                  <input type="checkbox" ${s.hasSecondaryAdversary ? 'checked' : ''} onchange="store.settings.hasSecondaryAdversary = this.checked; renderApp();" class="w-3.5 h-3.5 accent-amber-500 rounded cursor-pointer">
                </div>
                ${s.hasSecondaryAdversary ? `
                  <div class="space-y-1.5 pt-1">
                    <select onchange="store.settings.selectedSecondaryAdversary = this.value; renderApp();" class="w-full bg-surfaceContainer border border-amber-900/50 rounded-lg px-2 py-1 text-amber-200 text-xs font-semibold">
                      ${availableAdversaries.filter(a => a !== s.selectedAdversary).map(adv => `<option value="${adv}" ${s.selectedSecondaryAdversary === adv ? 'selected' : ''}>${adv}</option>`).join('')}
                    </select>
                  </div>
                ` : ''}
              </div>
            ` : ''}
          </div>

          <!-- 2. СЦЕНАРИЙ (SCENARIO) -->
          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-100 text-xs flex items-center space-x-1.5">
                <i class="fa-solid fa-scroll text-sky-300"></i>
                <span>Сценарий (Scenario)</span>
              </span>
              <div class="flex bg-surfaceContainer p-0.5 rounded-lg border border-slate-600 text-[10px]">
                <button onclick="store.settings.scenarioMode = 'manual'; renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.scenarioMode === 'manual' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Manual</button>
                <button onclick="store.settings.scenarioMode = 'random'; const scList = getAvailableScenarios().filter(s => s !== 'Няма (Standard Game)'); store.settings.selectedScenario = scList[Math.floor(Math.random() * scList.length)]; renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.scenarioMode === 'random' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Random</button>
              </div>
            </div>

            ${s.scenarioMode === 'manual' ? `
              <div class="pt-1 border-t border-slate-700/60">
                <select onchange="store.settings.selectedScenario = this.value; renderApp();" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2 py-1.5 text-white text-xs font-semibold">
                  ${availableScenarios.map(sc => `<option value="${sc}" ${s.selectedScenario === sc ? 'selected' : ''}>${sc}</option>`).join('')}
                </select>
              </div>
            ` : `
              <div class="pt-1 border-t border-slate-700/60 text-xs">
                <span class="text-sky-300 font-bold"><i class="fa-solid fa-dice text-[10px] mr-1"></i> ${s.selectedScenario}</span>
              </div>
            `}
          </div>

          <!-- 3. СТРАНА НА ДЪСКАТА (BOARD SIDE) -->
          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="font-bold text-slate-100 text-xs flex items-center space-x-1.5">
                <i class="fa-solid fa-map text-sky-300"></i>
                <span>Страна на дъската (Board Side)</span>
              </span>
              <div class="flex bg-surfaceContainer p-0.5 rounded-lg border border-slate-600 text-[10px]">
                <button onclick="store.settings.boardSideMode = 'manual'; renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.boardSideMode === 'manual' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Manual</button>
                <button onclick="store.settings.boardSideMode = 'random'; const sides = ['Standard Side', 'Thematic Side'${hasHorizonsAvailable ? (playerCount <= 2 ? ", 'Horizons Board (1-2 Players)'" : ", 'Horizons Board (3 Players)'") : ''}]; store.settings.selectedBoardSide = sides[Math.floor(Math.random() * sides.length)]; renderApp();" class="px-2 py-1 rounded-md font-bold transition ${s.boardSideMode === 'random' ? 'bg-sky-700 text-white' : 'text-slate-400'}">Random</button>
              </div>
            </div>

            ${s.boardSideMode === 'manual' ? `
              <div class="pt-1 border-t border-slate-700/60">
                <select onchange="store.settings.selectedBoardSide = this.value; renderApp();" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2 py-1.5 text-white text-xs font-semibold">
                  <option value="Standard Side" ${s.selectedBoardSide === 'Standard Side' ? 'selected' : ''}>Standard Side (Модулни А, B, C, D...)</option>
                  <option value="Thematic Side" ${s.selectedBoardSide === 'Thematic Side' ? 'selected' : ''}>Thematic Side (Тематична / Трудна)</option>
                  ${hasHorizonsAvailable && playerCount <= 2 ? `
                    <option value="Horizons Board (1-2 Players)" ${s.selectedBoardSide === 'Horizons Board (1-2 Players)' ? 'selected' : ''}>Horizons Board - 1-2 Играча (Фиксирана)</option>
                  ` : ''}
                  ${hasHorizonsAvailable && playerCount === 3 ? `
                    <option value="Horizons Board (3 Players)" ${s.selectedBoardSide === 'Horizons Board (3 Players)' ? 'selected' : ''}>Horizons Board - 3 Играча (Фиксирана)</option>
                  ` : ''}
                </select>
              </div>
            ` : `
              <div class="pt-1 border-t border-slate-700/60 text-xs">
                <span class="text-sky-300 font-bold"><i class="fa-solid fa-dice text-[10px] mr-1"></i> ${s.selectedBoardSide}</span>
              </div>
            `}
          </div>

          <div class="absolute bottom-0 left-0 right-0 z-40 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3 flex items-center space-x-2 z-40">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-semibold py-2.5 px-3 rounded-xl border border-slate-700 text-xs transition">Назад</button>
            <button onclick="showToast('Партията е напълно конфигурирана! Успех!')" class="flex-1 bg-sky-700 hover:bg-sky-600 border border-sky-400/30 text-white font-bold py-2.5 px-3 rounded-xl shadow-lg text-xs transition">Готово!</button>
          </div>
        </div>
      `;
    }

    renderApp();
  </script>

<script>
(function(){
  function enhance(){
    document.documentElement.classList.add('comp-ready');
    var sels = [
      '.grid', '[class*="grid-cols"]', '.cards', '.tile-list',
      '#routes', '#spirits', '.spirit-grid', '.meeple-grid'
    ];
    sels.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(el){
        if(el.children && el.children.length > 1 && el.children.length < 40){
          el.classList.add('comp-stagger');
        }
      });
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhance);
  else enhance();
})();
</script>

<script src="./companion-chrome.js" defer></script>
</body>
</html>
