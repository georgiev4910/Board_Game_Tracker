/* UX polish: safe-area + reduced motion + focus */
html { height: 100%; }
body {
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-bottom: max(0px, env(safe-area-inset-bottom, 0px));
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
  outline: 2px solid #60a5fa;
  outline-offset: 2px;
}


/* ===== Companion motion polish (sync with main app) ===== */
html { scroll-behavior: smooth; }
body {
  animation: compPageIn .45s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compPageIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
/* Interactive controls */
button, .btn, a.btn, [type="button"], [role="button"],
select, .chip, .tab, .mode-btn, .filter-btn {
  transition:
    transform .16s cubic-bezier(.34, 1.45, .64, 1),
    box-shadow .18s ease,
    filter .18s ease,
    background-color .18s ease,
    border-color .18s ease,
    opacity .18s ease !important;
}
button:hover, .btn:hover, a.btn:hover, [type="button"]:hover {
  filter: brightness(1.06);
}
button:active, .btn:active, a.btn:active, [type="button"]:active {
  transform: scale(0.97) !important;
}
/* Cards / panels */
.card, .panel, .box, .game-card, .tile-card, .spirit-card,
[class*="rounded-2xl"], [class*="rounded-xl"], [class*="rounded-lg"] {
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
/* Soft reveal for main content blocks */
main, .container, .app, #app, .content, .wrapper {
  animation: compFade .5s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compFade {
  from { opacity: 0.01; }
  to { opacity: 1; }
}
/* Sticky chrome */
header, .top-chrome, .sticky-header, nav.sticky, .navbar {
  backdrop-filter: saturate(1.2) blur(12px);
  -webkit-backdrop-filter: saturate(1.2) blur(12px);
}
/* Toast / result pop */
.toast, .result, .winner-display, .alert, .banner {
  animation: compPop .35s cubic-bezier(.22, 1, .36, 1) both;
}
@keyframes compPop {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: none; }
}
/* List stagger helper */
.comp-stagger > * {
  animation: compCascade .4s cubic-bezier(.22, 1, .36, 1) both;
}
.comp-stagger > *:nth-child(1) { animation-delay: .02s; }
.comp-stagger > *:nth-child(2) { animation-delay: .06s; }
.comp-stagger > *:nth-child(3) { animation-delay: .1s; }
.comp-stagger > *:nth-child(4) { animation-delay: .14s; }
.comp-stagger > *:nth-child(5) { animation-delay: .18s; }
.comp-stagger > *:nth-child(6) { animation-delay: .22s; }
.comp-stagger > *:nth-child(7) { animation-delay: .26s; }
.comp-stagger > *:nth-child(8) { animation-delay: .3s; }
@keyframes compCascade {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
/* Focus visible for accessibility */
button:focus-visible, a:focus-visible, select:focus-visible {
  outline: 2px solid rgba(96, 165, 250, .7);
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  body, main, .container, .app, #app, .content, .wrapper,
  .toast, .result, .winner-display, .comp-stagger > * {
    animation: none !important;
  }
  button, .btn, a.btn, [type="button"] {
    transition: none !important;
  }
}

      ];

    function navigateTo(screenName) {
      if (store.currentScreen !== screenName) navigationHistory.push(screenName);
      store.currentScreen = screenName;
      renderApp();
      window.scrollTo(0, 0);
    }

    function goBackStep() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        store.currentScreen = navigationHistory[navigationHistory.length - 1];
        renderApp();
        window.scrollTo(0, 0);
      } else {
        navigateTo('HomeScreen');
      }
    }

    function calculatePlayerTotal(p) {
      return (p.scores.base || 0) + 
             (p.scores.tokens || 0) + 
             (p.scores.purple || 0) + 
             (p.scores.events || 0) + 
             (p.scores.journey || 0) + 
             (p.scores.pearlOrWonders || 0);
    }

    function updatePlayerScore(pIndex, field, val) {
      store.participants[pIndex].scores[field] = parseInt(val) || 0;
      const p = store.participants[pIndex];
      const total = calculatePlayerTotal(p);
      document.getElementById(`total-score-${pIndex}`).innerText = total;
    }

    function resetCalculatorScores() {
      store.participants.forEach(p => {
        p.scores = { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 };
      });
      renderCalculatorUI();
      showToast(t('toastReset'));

    function closeScoreCalculator() {
      document.getElementById('score-modal').classList.add('hidden');

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-surfaceContainer text-white px-4 py-3 rounded-2xl shadow-2xl border border-emerald-500/40 pointer-events-auto flex items-center space-x-2.5 text-xs transition transform translate-y-3 opacity-0 duration-300';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i><span class="font-bold">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-3', 'opacity-0'), 15);
      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    
    function softRenderApp() {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const x = window.scrollX || document.documentElement.scrollLeft || 0;
      renderApp();
      requestAnimationFrame(function() {
        window.scrollTo(x, y);
        requestAnimationFrame(function() { window.scrollTo(x, y); });
      });
    }

function renderApp() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerText = t(key);
      });

      switch (store.currentScreen) {
        case 'HomeScreen':
          container.innerHTML = renderHomeScreen();
          break;
        case 'ExpansionsScreen':
          container.innerHTML = renderExpansionsScreen();
          break;
        case 'PlayersSetupScreen':
          container.innerHTML = renderPlayersSetupScreen();
          break;
        case 'SetupResultScreen':
          container.innerHTML = renderSetupResultScreen();
          break;
        default:
          container.innerHTML = renderHomeScreen();
      }
    }

    function toggleExpansion(index) {
      if (EVERDELL_DATA.expansions[index].id === "base") return;
      EVERDELL_DATA.expansions[index].isOwned = !EVERDELL_DATA.expansions[index].isOwned;
      sanitizePlayerCritters();
      softRenderApp();
    }

    function toggleAdvancedModule(enabled) {
      store.advancedModule.enabled = enabled;
      renderApp();
    }

    function getAvailableCritters() {
      let critters = [];
      EVERDELL_DATA.expansions.forEach(exp => {
        if (exp.isOwned && EVERDELL_DATA.crittersByExp[exp.id]) {
          critters = critters.concat(EVERDELL_DATA.crittersByExp[exp.id]);
        }
      });
      return critters;
    }

    function getSelectableCrittersForPlayer(playerIndex) {
      const allCritters = getAvailableCritters();
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.critter);
      return allCritters.filter(c => !usedByOthers.includes(c));
    }

    function getSelectableBigCrittersForPlayer(playerIndex) {
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.bigCritter);
      return EVERDELL_DATA.bigCritters.filter(bc => !usedByOthers.includes(bc));
    }

    function sanitizePlayerCritters() {
      const available = getAvailableCritters();
      const availableBigs = [];
      const usedCritters = new Set();
      const usedBigs = new Set();

      store.participants.forEach(p => {
        if (p.critter && available.includes(p.critter) && !usedCritters.has(p.critter)) {
          usedCritters.add(p.critter);
        } else {
          const nextFree = available.find(c => !usedCritters.has(c));
          p.critter = nextFree || available[0];
          usedCritters.add(p.critter);
        }

        if (p.bigCritter && availableBigs.includes(p.bigCritter) && !usedBigs.has(p.bigCritter)) {
          usedBigs.add(p.bigCritter);
        } else {
          const nextFreeBig = availableBigs.find(b => !usedBigs.has(b));
          p.bigCritter = nextFreeBig || availableBigs[0];
          usedBigs.add(p.bigCritter);
        }
      });
    }

      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const maxAllowed = isBellfaireActive ? 6 : 4;

      if (store.participants.length > maxAllowed) {
        store.participants = store.participants.slice(0, maxAllowed);

      sanitizePlayerCritters();

      const currentCount = store.participants.length;
      const options = Array.from({ length: maxAllowed }, (_, i) => i + 1);

      return `
        <div class="space-y-4 pb-24">

            </div>
            <button onclick="randomizeCritters()" class="bg-amber-950/80 border border-amber-500/50 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow transition hover:bg-amber-900">
              <i class="fa-solid fa-dice text-amber-400"></i>
              <span data-i18n="randomCritters">Случайно</span>
            </button>
          </div>

          <div class="glass-card rounded-2xl border border-slate-700/60 p-3.5 flex items-center justify-between shadow-md">
            <span class="font-bold text-slate-200 text-xs" data-i18n="playerCount">Брой играчи на масата</span>
            <select onchange="updateParticipantCount(parseInt(this.value))" class="bg-surfaceContainer border border-slate-600 rounded-xl px-3.5 py-1.5 text-white font-extrabold text-xs">
              ${options.map(n => `<option value="${n}" ${currentCount === n ? 'selected' : ''}>${n}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-3">
            ${store.participants.map((p, idx) => {
              const selectableCritters = getSelectableCrittersForPlayer(idx);
              const selectableBigs = getSelectableBigCrittersForPlayer(idx);

              return `
                <div class="glass-card rounded-2xl border border-slate-700/70 p-4 space-y-3 shadow-lg">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 flex-1 mr-3">
                      <div class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-300 font-black flex items-center justify-center text-xs border border-emerald-400/40 shadow-inner">${idx + 1}</div>
                      <input type="text" value="${p.name}" oninput="store.participants[${idx}].name = this.value" class="w-full bg-surfaceContainer border border-slate-600 rounded-xl px-3 py-1.5 text-white text-xs font-bold">
                    </div>
                    <div>${getCritterBadgeHtml(p.critter)}</div>
                  </div>

                  <div class="grid grid-cols-1 ${isSpirecrestActive ? 'sm:grid-cols-2' : ''} gap-2.5 pt-2.5 border-t border-slate-700/60">
                    <div>
                      <label class="text-[10px] font-extrabold text-slate-400 block mb-1 uppercase tracking-wider" data-i18n="critterType">Вид мийпъл (Цвят):</label>
                      <select onchange="changePlayerCritter(${idx}, this.value)" class="w-full bg-surfaceContainer border border-slate-600 rounded-xl px-3 py-1.5 text-white text-xs font-medium">
                        ${selectableCritters.map(c => `<option value="${c}" ${p.critter === c ? 'selected' : ''}>${c}</option>`).join('')}
                      </select>
                    </div>

                    ${isSpirecrestActive ? `
                      <div class="bg-amber-950/30 border border-amber-700/40 rounded-xl px-3 py-2 text-[10px] text-amber-200">
                        Big Critters не се разпределят на играч при setup. Те се получават чрез Discovery картите на Spirecrest.
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="absolute bottom-0 left-0 right-0 z-40 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3.5 flex items-center space-x-3 z-40 shadow-2xl">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-bold py-3 px-4 rounded-xl border border-slate-700 text-xs transition" data-i18n="backBtn">Назад</button>
            <button onclick="generateSetup()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg text-xs transition" data-i18n="genGameBtn">Генерирай конфигурация</button>
          </div>
        </div>
      `;
    }

    function changePlayerCritter(pIndex, val) {
      store.participants[pIndex].critter = val;
      renderApp();
    }

    function changePlayerBigCritter(pIndex, val) {
      store.participants[pIndex].bigCritter = val;
      renderApp();
    }

    function randomizeCritters() {
      const critters = [...getAvailableCritters()].sort(() => Math.random() - 0.5);
      const bigs = [...EVERDELL_DATA.bigCritters].sort(() => Math.random() - 0.5);

      store.participants.forEach((p, idx) => {
        p.critter = critters[idx % critters.length];
      });
      renderApp();
      showToast(t('toastCritters'));
    }

    function updateParticipantCount(count) {
      const current = store.participants;
      if (current.length < count) {
        for (let i = current.length; i < count; i++) {
          current.push({
            name: `${currentLang === 'bg' ? 'Участник' : 'Player'} ${i + 1}`,
            critter: "",
            bigCritter: "",
            scores: { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 }
          });
        }
      } else if (current.length > count) {
        store.participants = current.slice(0, count);
      }
      sanitizePlayerCritters();
      renderApp();
    }

    function generateSetup() {
      const activeExpIds = new Set(EVERDELL_DATA.expansions.filter(e => e.isOwned).map(e => e.id));
      const pCount = store.participants.length;
      const isPearlbrookActive = activeExpIds.has("pearlbrook");
      const isBellfaireActive = activeExpIds.has("bellfaire");
      const isNewleafActive = activeExpIds.has("newleaf");

      // Official Forest setup: 3 locations for 1-3 players, 4 for 4+ players.
      const neededForestLocations = pCount <= 3 ? 3 : 4;
      const forestPool = EVERDELL_DATA.forestLocations.filter(f => activeExpIds.has(f.exp));
      store.setup.selectedForestLocations = [...forestPool].sort(() => Math.random() - 0.5).slice(0, neededForestLocations);

      // Special Events: four in 1-4 player games, five with 5 players, six with 6 players.
      // Pearlbrook requires at least one Pearlbrook Special Event. Because the complete Pearlbrook
      // event deck is not encoded here, do not substitute invented data: flag this for manual setup.
      const hasExpansionEventPool = activeExpIds.has("pearlbrook") || activeExpIds.has("bellfaire") || activeExpIds.has("newleaf");
      if (hasExpansionEventPool) {
        store.setup.selectedEvents = [];
      } else {
        const eventCount = pCount >= 6 ? 6 : (pCount === 5 ? 5 : 4);
        store.setup.selectedEvents = [...EVERDELL_DATA.specialEvents].sort(() => Math.random() - 0.5).slice(0, eventCount);
      }

      // Basic Events are not a random pool. Pearlbrook replaces them with Wonders.
      if (isPearlbrookActive) {
        store.setup.selectedBasicEvents = [];
      } else {
        const basic = EVERDELL_DATA.basicEvents.slice(0, 4);
        if (isBellfaireActive) basic.push(EVERDELL_DATA.basicEvents[4]);
        if (isNewleafActive) basic.push(EVERDELL_DATA.basicEvents[5], EVERDELL_DATA.basicEvents[6]);
        store.setup.selectedBasicEvents = basic;
      }

      // Pearlbrook uses two of the four Wonders on the Wonder board.
      store.setup.selectedWonders = isPearlbrookActive
        ? [...EVERDELL_DATA.wonders].sort(() => Math.random() - 0.5).slice(0, 2)
        : [];

      // Spirecrest: one Weather card per season is used. The full 42 Discovery cards are
      // kept in their three decks and are not randomly pre-selected here.
      store.setup.selectedWeather = isSpirecrestActive()
        ? [...EVERDELL_DATA.weatherCards].sort(() => Math.random() - 0.5)
        : [];
      store.setup.selectedDiscoveries = [];

      // Bellfaire Market is a four-token module, not a set of random market tiles.
      store.setup.selectedMarkets = isBellfaireActive ? [{nameBg:"4 Market tokens",nameEn:"4 Market tokens",effectBg:"Поставете 4-те Market tokens на Gain страната.",effectEn:"Set up the 4 Market tokens on their Gain side."}] : [];

      // Newleaf uses a Station board, 3 Train Cars at setup, Visitors and Golden Occupied tokens.
      store.setup.selectedStations = isNewleafActive ? [{nameBg:"Newleaf Station",nameEn:"Newleaf Station",effectBg:"Поставете Station board, 3 Train Cars, Visitor deck и 3 Golden Occupied tokens на играч.",effectEn:"Set up the Station board, 3 Train Cars, Visitor deck and 3 Golden Occupied tokens per player."}] : [];

      store.setup.notes = [];
      if (isPearlbrookActive) store.setup.notes.push(currentLang === 'bg'
        ? "Pearlbrook: Basic Events не се използват. Използвайте 2 Wonders и поне 1 Pearlbrook Special Event от физическото тесте."
        : "Pearlbrook: Basic Events are not used. Use 2 Wonders and at least 1 Pearlbrook Special Event from the physical deck.");
      if (isBellfaireActive || isNewleafActive) store.setup.notes.push(currentLang === 'bg'
        ? "Special Events от Bellfaire/Newleaf не се заместват с измислени карти. За тяхното точно случайно разпределение използвайте физическото тесте."
        : "Bellfaire/Newleaf Special Events are not replaced with invented cards. Use the physical deck for their exact random selection.");
      if (activeExpIds.has("spirecrest")) store.setup.notes.push(currentLang === 'bg'
        ? "Spirecrest: Discovery картите остават в трите си тестета (Foothills, Peaks, Ridge); след Prepare for Season се изпълнява Explore."
        : "Spirecrest: Discovery cards remain in the three decks (Foothills, Peaks, Ridge); Explore follows Prepare for Season.");
      if (activeExpIds.has("mistwood")) store.setup.notes.push(currentLang === 'bg'
        ? "Mistwood: Nightweave модулите се настройват според избрания режим; Plot и Plan не се комбинират."
        : "Mistwood: Set up Nightweave modules according to the chosen mode; Plot and Plan are not combined.");
      if (isNewleafActive) store.setup.notes.push(currentLang === 'bg'
        ? "Newleaf: 32 Visitor карти, 18 Train Cars, 6 Tickets, 6 Reservations и 18 Golden Occupied tokens са модулни компоненти, не случайни Station tiles."
        : "Newleaf: 32 Visitor cards, 18 Train Cars, 6 Tickets, 6 Reservations and 18 Golden Occupied tokens are module components, not random Station tiles.");

      navigateTo('SetupResultScreen');
      showToast(t('toastGen'));
    }

    function isSpirecrestActive() {
      return EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned === true;
    }

            </div>
            <button onclick="generateSetup()" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-lg transition flex items-center space-x-1.5">
              <i class="fa-solid fa-shuffle text-amber-300"></i>
              <span data-i18n="reloadBtn">Преразпределение</span>
            </button>
          </div>

          <!-- Участници -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
              <i class="fa-solid fa-users text-amber-400"></i>
              <span data-i18n="playerDist">Разпределение по играчи</span>
            </span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${store.participants.map(p => `
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 flex items-center justify-between shadow-sm">
                  <div>
                    <div class="font-extrabold text-slate-100 text-xs">${p.name}</div>
                    
                  </div>
                  <div>${getCritterBadgeHtml(p.critter)}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Pearlbrook Wonders -->
          ${isPearlbrookActive && store.setup.selectedWonders.length > 0 ? `
            <div class="glass-card rounded-2xl border border-cyan-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-cyan-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-water text-cyan-400"></i>
                <span data-i18n="wonders">Pearlbrook: Велики чудеса</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedWonders.map(w => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-cyan-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-cyan-200">${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[11px]"><span class="text-slate-400 font-semibold">${t('cost')}</span> ${currentLang === 'bg' ? w.cost : w.costEn}</div>
                    <div class="text-emerald-400 text-[11px] font-medium">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Spirecrest Weather -->
          ${isSpirecrestActive ? `
            <div class="glass-card rounded-2xl border border-amber-600/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-mountain text-amber-400"></i>
                <span data-i18n="weather">Spirecrest: Време и планински маршрути</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedWeather.map(w => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-amber-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-amber-200"><i class="fa-solid fa-cloud-sun mr-1"></i> ${currentLang === 'bg' ? w.seasonBg : w.seasonEn}: ${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[11px]">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Bellfaire Markets -->
          ${isBellfaireActive && store.setup.selectedMarkets.length > 0 ? `
            <div class="glass-card rounded-2xl border border-purple-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-purple-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-store text-purple-400"></i>
                <span data-i18n="markets">Bellfaire: Пазарни плочки</span>
              </span>
              <div class="space-y-2">
                ${store.setup.selectedMarkets.map(m => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-purple-800/40 text-xs flex items-center justify-between">
                    <span class="font-extrabold text-purple-200">${currentLang === 'bg' ? m.nameBg : m.nameEn}</span>
                    <span class="text-slate-300 text-[11px] text-right">${currentLang === 'bg' ? m.effectBg : m.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- New Leaf Stations -->
          ${isNewLeafActive && store.setup.selectedStations.length > 0 ? `
            <div class="glass-card rounded-2xl border border-blue-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-blue-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-train text-blue-400"></i>
                <span data-i18n="stations">New Leaf: Централна гара и влакове</span>
              </span>
              <div class="space-y-2">
                ${store.setup.selectedStations.map(s => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-blue-800/40 text-xs flex items-center justify-between">
                    <span class="font-extrabold text-blue-200">${currentLang === 'bg' ? s.nameBg : s.nameEn}</span>
                    <span class="text-slate-300 text-[11px] text-right">${currentLang === 'bg' ? s.effectBg : s.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Advanced Basic Events -->
          ${!isPearlbrookActive && store.setup.selectedBasicEvents.length > 0 ? `
            <div class="glass-card rounded-2xl border border-amber-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-sliders text-amber-400"></i>
                <span>${t('basicEventsSelected')} (${store.setup.selectedBasicEvents.length})</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedBasicEvents.map(b => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-amber-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-amber-200">${currentLang === 'bg' ? b.nameBg : b.nameEn} <span class="text-emerald-400">(${b.reward})</span></div>
                    <div class="text-slate-300 text-[11px]"><span class="text-slate-400 font-semibold">${t('req')}</span> ${currentLang === 'bg' ? b.reqBg : b.reqEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${store.setup.notes?.length ? `
            <div class="glass-card rounded-2xl border border-rose-500/30 p-4 space-y-2 shadow-lg">
              <span class="font-extrabold text-xs text-rose-300 flex items-center space-x-2 uppercase tracking-wide"><i class="fa-solid fa-circle-info"></i><span>Правила и предупреждения</span></span>
              ${store.setup.notes.map(n => `<div class="text-[11px] text-slate-300 bg-slate-900/70 rounded-xl p-2.5 border border-slate-700/70">${n}</div>`).join('')}
            </div>
          ` : ''}

          <!-- Forest Locations -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2.5">
              <span class="font-extrabold text-xs text-emerald-400 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-tree text-emerald-400"></i>
                <span data-i18n="forestLoc">Горски локации на партията</span> (${store.setup.selectedForestLocations.length})
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
              ${store.setup.selectedForestLocations.map(f => `
                <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-800/40 flex items-center justify-between shadow-sm">
                  <div>
                    <div class="font-extrabold text-xs text-amber-200">${currentLang === 'bg' ? f.nameBg : f.nameEn}</div>
                    <div class="text-[11px] text-slate-300 mt-0.5">${currentLang === 'bg' ? f.effectBg : f.effectEn}</div>
                  </div>
                  <span class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-xl font-black uppercase tracking-wider">${f.exp}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Special Events -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2.5">
              <span class="font-extrabold text-xs text-amber-400 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-star text-amber-400"></i>
                <span data-i18n="specEvents">Специални събития</span> (${store.setup.selectedEvents.length})
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
              ${store.setup.selectedEvents.length === 0 ? `<div class="bg-rose-950/40 border border-rose-500/30 rounded-xl p-3 text-[11px] text-rose-200">${isPearlbrookActive ? (currentLang === 'bg' ? 'Pearlbrook изисква поне 1 Pearlbrook Special Event. Този модул не е подменен с измислена карта. Изтеглете картите от физическото тесте.' : 'Pearlbrook requires at least 1 Pearlbrook Special Event. No invented card was substituted. Draw it from the physical deck.') : ''}</div>` : ''}
              ${store.setup.selectedEvents.map(e => `
                <div class="bg-slate-900/80 p-3.5 rounded-xl border border-amber-800/40 space-y-2 shadow-sm">
                  <div class="flex items-center justify-between">
                    <div class="font-extrabold text-xs text-amber-200">${currentLang === 'bg' ? e.nameBg : e.nameEn}</div>
                    <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-xl font-black uppercase tracking-wider">${e.exp}</span>
                  </div>
                  <div class="text-[11px] text-slate-300"><span class="text-slate-400 font-semibold" data-i18n="req">Изискване:</span> <span class="text-slate-100 font-bold">${currentLang === 'bg' ? e.reqBg : e.reqEn}</span></div>
                  <div class="text-[11px] text-emerald-300 font-semibold bg-emerald-950/50 p-2 rounded-xl border border-emerald-500/20"><span class="text-emerald-400 font-bold">${t('effect')}</span> ${currentLang === 'bg' ? e.rewardBg : e.rewardEn}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="absolute bottom-0 left-0 right-0 z-40 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3.5 flex items-center space-x-3 z-40 shadow-2xl">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-bold py-3 px-4 rounded-xl border border-slate-700 text-xs transition" data-i18n="backBtn">Назад</button>
            <button onclick="showToast('${t('toastReady')}')" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg text-xs transition">Запази готовност</button>
          </div>
        </div>
      `;
    }

    initParticipants();
    renderApp();
  </script>

<script>
(function(){
  function enhance(){
    document.documentElement.classList.add('comp-ready');
    var sels = [
      '.grid', '[class*="grid-cols"]', '.cards', '.tile-list',
      '#routes', '#spirits', '.spirit-grid', '.meeple-grid'
    ];
    sels.forEach(function(sel){
      document.querySelectorAll(sel).forEach(function(el){
        if(el.children && el.children.length > 1 && el.children.length < 40){
          el.classList.add('comp-stagger');
        }
      });
    });
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhance);
  else enhance();
})();
</script>


<script>
(function(){
  if(document.getElementById('suite-chrome')) return;
  var bar=document.createElement('div');
  bar.id='suite-chrome';
  bar.style.cssText='position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));right:12px;z-index:9999;display:flex;gap:8px;';
  bar.innerHTML='<a href="./index.html#log" style="padding:10px 12px;border-radius:14px;background:rgba(15,18,32,.92);color:#fff;text-decoration:none;font:800 12px/1 system-ui;border:1px solid rgba(255,255,255,.12)">📝 Log</a><a href="./index.html#randomizer" style="padding:10px 12px;border-radius:14px;background:rgba(15,18,32,.92);color:#fff;text-decoration:none;font:800 12px/1 system-ui;border:1px solid rgba(255,255,255,.12)">🎲 Rand</a>';
  document.body.appendChild(bar);
})();
</script>
<script src="./companion-chrome.js" defer></script>
