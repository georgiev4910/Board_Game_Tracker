            <i class="fa-solid fa-house text-emerald-400"></i>
          </button>
          <button onclick="goBackStep()" title="Назад" class="bg-surfaceContainer hover:bg-slate-600/50 text-white p-2 rounded-xl text-xs transition border border-slate-600/40">
            <i class="fa-solid fa-arrow-left text-amber-400"></i>
          </button>
          <button onclick="goToTracker()" title="Към тракера" class="bg-surfaceContainer hover:bg-slate-600/50 text-white p-2 rounded-xl text-xs transition border border-slate-600/40">
            <i class="fa-solid fa-flag-checkered text-teal-300"></i>
          </button>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="toggleLanguage()" title="Смени езика / Change Language" class="bg-surfaceContainer hover:bg-slate-600 text-amber-300 border border-amber-500/40 px-2.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1">
            <i class="fa-solid fa-globe"></i>
            <span id="lang-btn-text">BG</span>
          </button>

          <button onclick="openScoreCalculator()" title="Калкулатор за точки" class="bg-emerald-900/60 hover:bg-emerald-800/80 text-emerald-300 border border-emerald-500/50 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-md transition active:scale-95">
            <i class="fa-solid fa-calculator text-amber-300 text-sm"></i>
            <span data-i18n="calcBtn">Точки</span>
          </button>
        </div>

        <div class="flex items-center space-x-1.5 pl-2 border-l border-slate-700/80">
          <div class="text-right">
            <h1 class="font-extrabold text-xs sm:text-sm tracking-tight text-slate-100 leading-none">EVERDELL</h1>
            <p class="text-[9px] text-emerald-400 font-semibold leading-none mt-0.5">Companion</p>
          </div>
          <div class="bg-emerald-950/80 border border-emerald-500/40 p-1.5 rounded-xl text-emerald-400 font-bold text-xs flex items-center justify-center w-7 h-7 shadow-sm">
            <i class="fa-solid fa-tree"></i>
          </div>
        </div>
      </div>
    </header>

    <main id="app-container" class="flex-1 w-full p-3 sm:p-4 pb-24"></main>

            <i class="fa-solid fa-trophy text-amber-400"></i>
            <h3 class="font-extrabold text-sm text-slate-100" data-i18n="scoreTableTitle">Таблица с Резултати</h3>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="resetCalculatorScores()" title="Занули резултатите" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-500/40 px-2 py-1 rounded-lg text-[10px] font-bold flex items-center space-x-1 transition">

              <span data-i18n="resetBtn">Занули</span>
            </button>
            <button onclick="closeScoreCalculator()" class="text-slate-400 hover:text-white p-1">
              <i class="fa-solid fa-xmark text-base"></i>
            </button>
          </div>
        </div>

      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);

    function toggleExpansion(index) {
      if (EVERDELL_DATA.expansions[index].id === "base") return;
      EVERDELL_DATA.expansions[index].isOwned = !EVERDELL_DATA.expansions[index].isOwned;
      sanitizePlayerCritters();
      renderApp();
    }

    function toggleAdvancedModule(enabled) {
      store.advancedModule.enabled = enabled;
      renderApp();
    }

    function getAvailableCritters() {
      let critters = [];
      EVERDELL_DATA.expansions.forEach(exp => {
        if (exp.isOwned && EVERDELL_DATA.crittersByExp[exp.id]) {
          critters = critters.concat(EVERDELL_DATA.crittersByExp[exp.id]);
        }
      });
      return critters;
    }

    function getSelectableCrittersForPlayer(playerIndex) {
      const allCritters = getAvailableCritters();
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.critter);
      return allCritters.filter(c => !usedByOthers.includes(c));
    }

    function getSelectableBigCrittersForPlayer(playerIndex) {
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.bigCritter);
      return EVERDELL_DATA.bigCritters.filter(bc => !usedByOthers.includes(bc));
    }

    function sanitizePlayerCritters() {
      const available = getAvailableCritters();
      const availableBigs = [...EVERDELL_DATA.bigCritters];
      const usedCritters = new Set();
      const usedBigs = new Set();

      store.participants.forEach(p => {
        if (p.critter && available.includes(p.critter) && !usedCritters.has(p.critter)) {
          usedCritters.add(p.critter);
        } else {
          const nextFree = available.find(c => !usedCritters.has(c));
          p.critter = nextFree || available[0];
          usedCritters.add(p.critter);
        }

        if (p.bigCritter && availableBigs.includes(p.bigCritter) && !usedBigs.has(p.bigCritter)) {
          usedBigs.add(p.bigCritter);
        } else {
          const nextFreeBig = availableBigs.find(b => !usedBigs.has(b));
          p.bigCritter = nextFreeBig || availableBigs[0];
          usedBigs.add(p.bigCritter);
        }
      });
    }

    function renderPlayersSetupScreen() {
      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const maxAllowed = isBellfaireActive ? 6 : 4;

      if (store.participants.length > maxAllowed) {
        store.participants = store.participants.slice(0, maxAllowed);
      }
      
      sanitizePlayerCritters();

      const currentCount = store.participants.length;
      const options = Array.from({ length: maxAllowed }, (_, i) => i + 1);

      return `
        <div class="space-y-4 pb-24">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-slate-100">${t('playersTitle')}</h2>
              <p class="text-xs text-slate-400">${t('playersDesc')}</p>
            </div>
            <button onclick="randomizeCritters()" class="bg-amber-900/60 border border-amber-500/40 text-amber-300 px-2.5 py-1 rounded-xl text-[11px] font-bold flex items-center space-x-1 shadow transition">
              <i class="fa-solid fa-dice"></i>
              <span>${t('randomCritters')}</span>
            </button>
          </div>

          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 flex items-center justify-between">
            <span class="font-bold text-slate-200 text-xs">${t('playerCount')} ${isBellfaireActive ? '(до 6 / up to 6)' : '(до 4 / up to 4)'}</span>
            <select onchange="updateParticipantCount(parseInt(this.value))" class="bg-surfaceContainer border border-slate-600 rounded-lg px-3 py-1.5 text-white font-bold text-xs">
              ${options.map(n => `<option value="${n}" ${currentCount === n ? 'selected' : ''}>${n}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-3">
            ${store.participants.map((p, idx) => {
              const selectableCritters = getSelectableCrittersForPlayer(idx);
              const selectableBigs = getSelectableBigCrittersForPlayer(idx);

              return `
                <div class="bg-surface rounded-xl border border-slate-700/50 p-3 space-y-2">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2 flex-1 mr-2">
                      <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-300 font-bold flex items-center justify-center text-xs border border-emerald-400/30">${idx + 1}</div>
                      <input type="text" value="${p.name}" oninput="store.participants[${idx}].name = this.value" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2 py-1 text-white text-xs font-semibold">
                    </div>
                    <div>${getCritterBadgeHtml(p.critter)}</div>
                  </div>

                  <div class="grid grid-cols-1 ${isSpirecrestActive ? 'sm:grid-cols-2' : ''} gap-2 pt-2 border-t border-slate-700/50">
                    <div>
                      <label class="text-[10px] font-bold text-slate-400 block mb-0.5">${t('critterType')}</label>
                      <select onchange="changePlayerCritter(${idx}, this.value)" class="w-full bg-surfaceContainer border border-slate-600 rounded-lg px-2 py-1 text-white text-[11px]">
                        ${selectableCritters.map(c => `<option value="${c}" ${p.critter === c ? 'selected' : ''}>${c}</option>`).join('')}
                      </select>
                    </div>

                    ${isSpirecrestActive ? `
                      <div>
                        <label class="text-[10px] font-bold text-amber-400 block mb-0.5">${t('bigCritter')}</label>
                        <select onchange="changePlayerBigCritter(${idx}, this.value)" class="w-full bg-surfaceContainer border border-amber-600/60 rounded-lg px-2 py-1 text-amber-200 text-[11px]">
                          ${selectableBigs.map(bc => `<option value="${bc}" ${p.bigCritter === bc ? 'selected' : ''}>${bc}</option>`).join('')}
                        </select>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="absolute bottom-0 left-0 right-0 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3 flex items-center space-x-2 z-40">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-semibold py-2.5 px-3 rounded-xl border border-slate-700 text-xs transition">${t('backBtn')}</button>
            <button onclick="generateSetup()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-bold py-2.5 px-3 rounded-xl shadow-lg text-xs transition">${t('genGameBtn')}</button>
          </div>
        </div>
      `;
    }

    function changePlayerCritter(pIndex, val) {
      store.participants[pIndex].critter = val;
      renderApp();
    }

    function changePlayerBigCritter(pIndex, val) {
      store.participants[pIndex].bigCritter = val;
      renderApp();
    }

    function randomizeCritters() {
      const critters = [...getAvailableCritters()].sort(() => Math.random() - 0.5);
      const bigs = [...EVERDELL_DATA.bigCritters].sort(() => Math.random() - 0.5);

      store.participants.forEach((p, idx) => {
        p.critter = critters[idx % critters.length];
        p.bigCritter = bigs[idx % bigs.length];
      });
      renderApp();
      showToast(t('toastCritters'));
    }

    function updateParticipantCount(count) {
      const current = store.participants;
      if (current.length < count) {
        for (let i = current.length; i < count; i++) {
          current.push({
            name: `${currentLang === 'bg' ? 'Играч' : 'Player'} ${i + 1}`,
            critter: "",
            bigCritter: "",
            scores: { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 }
          });
        }
      } else if (current.length > count) {
        store.participants = current.slice(0, count);
      }
      sanitizePlayerCritters();
      renderApp();
    }

    function generateSetup() {
      const activeExpIds = new Set(EVERDELL_DATA.expansions.filter(e => e.isOwned).map(e => e.id));
      const pCount = store.participants.length;
      
      const neededForestCards = pCount <= 3 ? 3 : 4;

      const availForest = EVERDELL_DATA.forestLocations.filter(f => activeExpIds.has(f.exp));
      const shuffledForest = [...availForest].sort(() => Math.random() - 0.5);
      store.setup.selectedForestLocations = shuffledForest.slice(0, neededForestCards);

      const availEvents = EVERDELL_DATA.specialEvents.filter(e => activeExpIds.has(e.exp));
      const shuffledEvents = [...availEvents].sort(() => Math.random() - 0.5);
      store.setup.selectedEvents = shuffledEvents.slice(0, 4);

      const isPearlbrookActive = activeExpIds.has("pearlbrook");
      if (store.advancedModule.enabled && !isPearlbrookActive) {
        const count = store.advancedModule.randomBasicEventsCount || 2;
        const shuffledBasic = [...EVERDELL_DATA.basicEvents].sort(() => Math.random() - 0.5);
        store.setup.selectedBasicEvents = shuffledBasic.slice(0, count);
      } else {
        store.setup.selectedBasicEvents = [];
      }

      if (activeExpIds.has("pearlbrook")) {
        store.setup.selectedWonders = [...EVERDELL_DATA.wonders].sort(() => Math.random() - 0.5).slice(0, 4);
      } else {
        store.setup.selectedWonders = [];
      }

      if (activeExpIds.has("spirecrest")) {
        store.setup.selectedWeather = [...EVERDELL_DATA.weatherCards].sort(() => Math.random() - 0.5);
        store.setup.selectedDiscoveries = [...EVERDELL_DATA.discoveryCards].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedWeather = [];
        store.setup.selectedDiscoveries = [];
      }

      if (activeExpIds.has("bellfaire")) {
        store.setup.selectedMarkets = [...EVERDELL_DATA.marketTiles].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedMarkets = [];
      }

      if (activeExpIds.has("newleaf")) {
        store.setup.selectedStations = [...EVERDELL_DATA.stationTiles].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedStations = [];
      }

      navigateTo('SetupResultScreen');
      showToast(t('toastGen'));
    }

    function renderSetupResultScreen() {
      const pCount = store.participants.length;
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const isPearlbrookActive = EVERDELL_DATA.expansions.find(e => e.id === 'pearlbrook')?.isOwned;
      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const isNewLeafActive = EVERDELL_DATA.expansions.find(e => e.id === 'newleaf')?.isOwned;

      return `
        <div class="space-y-4 pb-24">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-slate-100">${t('genGameTitle')}</h2>
              <p class="text-xs text-slate-400">${t('configFor')} ${pCount} ${pCount === 1 ? t('player') : t('players')}</p>
            </div>
            <button onclick="generateSetup()" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-lg transition flex items-center space-x-1">
              <i class="fa-solid fa-shuffle text-xs"></i>
              <span>${t('reloadBtn')}</span>
            </button>
          </div>

          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2">
            <span class="font-bold text-xs text-amber-300 flex items-center space-x-1.5">
              <i class="fa-solid fa-users"></i>
              <span>${t('playerDist')}</span>
            </span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${store.participants.map(p => `
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60 flex items-center justify-between">
                  <div>
                    <div class="font-bold text-slate-100 text-xs">${p.name}</div>${isSpirecrestActive ? `<div class="text-[10px] text-amber-400 mt-0.5">${t('bigCritterLabel')} ${p.bigCritter}</div>` : ''}
                  </div>
                  <div>${getCritterBadgeHtml(p.critter)}</div>
                </div>
              `).join('')}
            </div>
          </div>

          ${isPearlbrookActive && store.setup.selectedWonders.length > 0 ? `
            <div class="bg-surface rounded-xl border border-cyan-500/40 p-3 space-y-2">
              <span class="font-bold text-xs text-cyan-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-water"></i>
                <span>${t('wonders')}</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                ${store.setup.selectedWonders.map(w => `
                  <div class="bg-slate-900/80 p-2 rounded-lg border border-cyan-800/40 text-[11px]">
                    <div class="font-bold text-cyan-200">${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[10px]">${t('cost')} ${currentLang === 'bg' ? w.cost : w.costEn}</div>
                    <div class="text-emerald-400 text-[10px]">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${isSpirecrestActive ? `
            <div class="bg-surface rounded-xl border border-amber-600/40 p-3 space-y-2">
              <span class="font-bold text-xs text-amber-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-mountain"></i>
                <span>${t('weather')}</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                ${store.setup.selectedWeather.map(w => `
                  <div class="bg-slate-900/80 p-2 rounded-lg border border-amber-800/40 text-[11px]">
                    <div class="font-bold text-amber-200"><i class="fa-solid fa-cloud-sun"></i> ${currentLang === 'bg' ? w.seasonBg : w.seasonEn}: ${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[10px]">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${isBellfaireActive && store.setup.selectedMarkets.length > 0 ? `
            <div class="bg-surface rounded-xl border border-purple-500/40 p-3 space-y-2">
              <span class="font-bold text-xs text-purple-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-store"></i>
                <span>${t('markets')}</span>
              </span>
              <div class="space-y-1">
                ${store.setup.selectedMarkets.map(m => `
                  <div class="bg-slate-900/80 p-2 rounded-lg border border-purple-800/40 text-[11px] flex items-center justify-between">
                    <span class="font-bold text-purple-200">${currentLang === 'bg' ? m.nameBg : m.nameEn}</span>
                    <span class="text-slate-300 text-[10px]">${currentLang === 'bg' ? m.effectBg : m.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${isNewLeafActive && store.setup.selectedStations.length > 0 ? `
            <div class="bg-surface rounded-xl border border-blue-500/40 p-3 space-y-2">
              <span class="font-bold text-xs text-blue-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-train"></i>
                <span>${t('stations')}</span>
              </span>
              <div class="space-y-1">
                ${store.setup.selectedStations.map(s => `
                  <div class="bg-slate-900/80 p-2 rounded-lg border border-blue-800/40 text-[11px] flex items-center justify-between">
                    <span class="font-bold text-blue-200">${currentLang === 'bg' ? s.nameBg : s.nameEn}</span>
                    <span class="text-slate-300 text-[10px]">${currentLang === 'bg' ? s.effectBg : s.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${store.advancedModule.enabled && !isPearlbrookActive && store.setup.selectedBasicEvents.length > 0 ? `
            <div class="bg-surface rounded-xl border border-amber-500/40 p-3 space-y-2">
              <span class="font-bold text-xs text-amber-300 flex items-center space-x-1.5">
                <i class="fa-solid fa-sliders"></i>
                <span>${t('basicEventsSelected')} (${store.setup.selectedBasicEvents.length})</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                ${store.setup.selectedBasicEvents.map(b => `
                  <div class="bg-slate-900/80 p-2 rounded-lg border border-amber-800/40 text-[11px]">
                    <div class="font-bold text-amber-200">${currentLang === 'bg' ? b.nameBg : b.name} (${b.reward})</div>
                    <div class="text-slate-400 text-[10px]">${t('req')} ${currentLang === 'bg' ? b.reqBg : b.req}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
              <span class="font-bold text-xs text-emerald-400 flex items-center space-x-1.5">
                <i class="fa-solid fa-tree"></i>
                <span>${t('forestLoc')} (${store.setup.selectedForestLocations.length})</span>
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2">
              ${store.setup.selectedForestLocations.map(f => `
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-emerald-800/40 flex items-center justify-between">
                  <div>
                    <div class="font-bold text-xs text-amber-200">${currentLang === 'bg' ? f.nameBg : f.nameEn}</div>
                    <div class="text-[11px] text-slate-300">${currentLang === 'bg' ? f.effectBg : f.effectEn}</div>
                  </div>
                  <span class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold uppercase">${f.exp}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-surface rounded-xl border border-slate-700/60 p-3 space-y-2.5">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
              <span class="font-bold text-xs text-amber-400 flex items-center space-x-1.5">
                <i class="fa-solid fa-star"></i>
                <span>${t('specEvents')} (4)</span>
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2">
              ${store.setup.selectedEvents.map(e => `
                <div class="bg-slate-900/60 p-2.5 rounded-lg border border-amber-800/40 space-y-1">
                  <div class="flex items-center justify-between">
                    <div class="font-bold text-xs text-amber-200">${currentLang === 'bg' ? e.nameBg : e.nameEn}</div>
                    <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-bold uppercase">${e.exp}</span>
                  </div>
                  <div class="text-[10px] text-slate-300">${t('req')} <span class="text-slate-100 font-semibold">${currentLang === 'bg' ? e.reqBg : e.reqEn}</span></div>
                  <div class="text-[10px] text-emerald-400 font-medium bg-emerald-950/40 p-1.5 rounded border border-emerald-500/20">${t('effect')}${currentLang === 'bg' ? e.rewardBg : e.rewardEn}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="absolute bottom-0 left-0 right-0 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3 flex items-center space-x-2 z-40">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-semibold py-2.5 px-3 rounded-xl border border-slate-700 text-xs transition">${t('backBtn')}</button>
            <button onclick="showToast('${t('toastReady')}')" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-bold py-2.5 px-3 rounded-xl shadow-lg text-xs transition">${t('toastReady')}</button>
          </div>
        </div>
      `;
    }

    initParticipants();
    renderApp();
  </script>
</body>
</html>
