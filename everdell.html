<html lang="bg" class="dark">

  <title>Everdell Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0a0f1d',
            surface: '#151c2f',
            surfaceContainer: '#222d44',
            forestGreen: '#15803d',
            amberWood: '#d97706'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1d; }
    ::-webkit-scrollbar-thumb { background: #222d44; border-radius: 3px; }
    .glass-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
      backdrop-filter: blur(12px);
    }
  </style>
</head>

  <div class="w-full sm:max-w-xl bg-darkbg sm:bg-surface/90 sm:border sm:border-emerald-500/20 sm:rounded-3xl sm:shadow-2xl min-h-screen sm:min-h-[90vh] flex flex-col relative overflow-hidden">

    <!-- Горен навигационен бар -->

      <div class="flex items-center space-x-1.5 border-r border-slate-700/60 pr-3">
        <button onclick="navigateTo('HomeScreen')" title="Начало" class="bg-surfaceContainer hover:bg-emerald-950/60 hover:border-emerald-500/50 text-white p-2 rounded-xl text-xs transition border border-slate-700/80 shadow-sm">
          <i class="fa-solid fa-house text-emerald-400"></i>
        </button>
        <button onclick="goBackStep()" title="Назад" class="bg-surfaceContainer hover:bg-amber-950/60 hover:border-amber-500/50 text-white p-2 rounded-xl text-xs transition border border-slate-700/80 shadow-sm">
          <i class="fa-solid fa-arrow-left text-amber-400"></i>
        </button>
        <button onclick="goToTracker()" title="Към тракера" class="bg-surfaceContainer hover:bg-teal-950/60 hover:border-teal-500/50 text-white p-2 rounded-xl text-xs transition border border-slate-700/80 shadow-sm">
          <i class="fa-solid fa-flag-checkered text-teal-300"></i>
        </button>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="toggleLanguage()" title="Смяна на езика / Change Language" class="bg-surfaceContainer hover:bg-slate-700 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 shadow-sm">
          <i class="fa-solid fa-globe text-amber-400"></i>
          <span id="lang-btn-text">BG</span>
        </button>

        <button onclick="openScoreCalculator()" title="Калкулатор за точки" class="bg-gradient-to-r from-emerald-800 to-emerald-700 hover:from-emerald-700 hover:to-emerald-600 text-emerald-100 border border-emerald-500/50 px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow-md transition active:scale-95">
          <i class="fa-solid fa-calculator text-amber-300 text-sm"></i>
          <span data-i18n="calcBtn">Точки</span>
        </button>
      </div>

      <div class="flex items-center space-x-2 pl-3 border-l border-slate-700/60">
        <div class="text-right hidden xs:block">
          <h1 class="font-black text-xs tracking-wider text-slate-100 leading-none">EVERDELL</h1>
          <p class="text-[9px] text-emerald-400 font-bold leading-none mt-1">КОМПЬОНТ</p>
        </div>
        <div class="bg-emerald-950 border border-emerald-500/50 p-2 rounded-xl text-emerald-400 font-bold text-xs flex items-center justify-center w-8 h-8 shadow-inner">
          <i class="fa-solid fa-tree text-sm"></i>
        </div>
      </div>
    </header>

    <!-- Основно динамично съдържание -->
    <main id="app-container" class="flex-1 w-full p-4 sm:p-5 pb-24"></main>

    <!-- Модал: Калкулатор на точки -->
    <div id="score-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-3 hidden">
      <div class="bg-surface border border-emerald-500/30 rounded-3xl w-full max-w-lg p-5 space-y-4 shadow-2xl relative max-h-[92vh] flex flex-col">
        <div class="flex items-center justify-between border-b border-slate-700/80 pb-3">
          <div class="flex items-center space-x-2.5">
            <div class="p-2 bg-amber-500/20 text-amber-400 rounded-xl border border-amber-500/30">
              <i class="fa-solid fa-trophy text-sm"></i>
            </div>
            <h3 class="font-extrabold text-sm text-slate-100 uppercase tracking-wide" data-i18n="scoreTableTitle">Таблица с резултати</h3>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="resetCalculatorScores()" title="Занули резултатите" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-500/40 px-2.5 py-1.5 rounded-xl text-[11px] font-bold flex items-center space-x-1.5 transition">
              <i class="fa-solid fa-rotate-right"></i>
              <span data-i18n="resetBtn">Зануляване</span>
            </button>
            <button onclick="closeScoreCalculator()" class="text-slate-400 hover:text-white p-1.5 rounded-xl bg-slate-800/80">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
        </div>

        <div id="calculator-columns-container" class="overflow-x-auto flex-1 py-1"></div>

        <button onclick="closeScoreCalculator()" class="w-full bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg" data-i18n="closeBtn">Затвори прозореца</button>
      </div>
    </div>

    <!-- Изскачащи известия (Toasts) -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    let navigationHistory = ['HomeScreen'];

    function getCritterBadgeHtml(critterName) {
      const details = CRITTER_DETAILS[critterName] || { color: '#475569', textColor: '#ffffff', icon: 'fa-paw' };
      return `
        <div class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-xl border border-white/15 shadow-sm text-xs font-bold" style="background-color: ${details.color}; color: ${details.textColor};">
          <i class="fa-solid ${details.icon || 'fa-paw'} text-[11px]"></i>
          <span>${critterName}</span>
        </div>
      `;
    }

    function initParticipants() {
      const avail = getAvailableCritters();
      store.participants = [
        { name: currentLang === 'bg' ? "Играч 1" : "Player 1", critter: avail[0] || "Мишки (Mice)", bigCritter: EVERDELL_DATA.bigCritters[0], scores: { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 } },
        { name: currentLang === 'bg' ? "Играч 2" : "Player 2", critter: avail[1] || "Таралежи (Hedgehogs)", bigCritter: EVERDELL_DATA.bigCritters[1], scores: { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 } }
      ];
    }

    function navigateTo(screenName) {
      if (store.currentScreen !== screenName) navigationHistory.push(screenName);
      store.currentScreen = screenName;
      renderApp();
      window.scrollTo(0, 0);
    }

    function goBackStep() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        store.currentScreen = navigationHistory[navigationHistory.length - 1];
        renderApp();
        window.scrollTo(0, 0);
      } else {
        navigateTo('HomeScreen');
      }
    }

    function goToTracker() {
      window.location.href = 'https://georgiev4910.github.io/Board_Game_Tracker/';
    }

    function calculatePlayerTotal(p) {
      return (p.scores.base || 0) + 
             (p.scores.tokens || 0) + 
             (p.scores.purple || 0) + 
             (p.scores.events || 0) + 
             (p.scores.journey || 0) + 
             (p.scores.pearlOrWonders || 0);
    }

    function openScoreCalculator() {
      renderCalculatorUI();
      document.getElementById('score-modal').classList.remove('hidden');
    }

    function renderCalculatorUI() {
      const container = document.getElementById('calculator-columns-container');
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const isPearlbrookActive = EVERDELL_DATA.expansions.find(e => e.id === 'pearlbrook')?.isOwned;
      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const is5Or6Players = isBellfaireActive && store.participants.length >= 5;

      container.innerHTML = `
        <div class="space-y-2 mb-2 px-1">
          ${is5Or6Players ? `<div class="text-[11px] text-amber-300 bg-amber-950/60 p-2 rounded-xl border border-amber-500/30 flex items-center space-x-2"><i class="fa-solid fa-triangle-exclamation"></i><span>${t('handLimit56')}</span></div>` : ''}
        </div>
        <div class="flex space-x-3.5 min-w-max pb-2">
          ${store.participants.map((p, idx) => {
            const total = calculatePlayerTotal(p);
            return `
              <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5 w-56 flex flex-col justify-between space-y-3 shadow-xl">
                <div class="border-b border-slate-700/80 pb-2 flex items-center justify-between">
                  <span class="font-extrabold text-xs text-amber-300 truncate">${p.name}</span>
                  <div class="scale-90 origin-right">${getCritterBadgeHtml(p.critter)}</div>
                </div>

                <div class="space-y-2 text-[11px]">
                  <div class="flex justify-between items-center">
                    <span class="text-slate-300 flex items-center space-x-2">
                      <i class="fa-solid fa-star text-amber-400 w-4 text-center"></i>
                      <span>${t('baseScore')}</span>
                    </span>
                    <input type="number" value="${p.scores.base}" min="0" onchange="updatePlayerScore(${idx}, 'base', this.value)" class="w-14 bg-surfaceContainer border border-slate-600 rounded-lg text-center text-white font-bold py-1">
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-slate-300 flex items-center space-x-2">
                      <i class="fa-solid fa-coins text-yellow-400 w-4 text-center"></i>
                      <span>${t('tokensScore')}</span>
                    </span>
                    <input type="number" value="${p.scores.tokens}" min="0" onchange="updatePlayerScore(${idx}, 'tokens', this.value)" class="w-14 bg-surfaceContainer border border-slate-600 rounded-lg text-center text-white font-bold py-1">
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-slate-300 flex items-center space-x-2">
                      <i class="fa-solid fa-gem text-purple-400 w-4 text-center"></i>
                      <span>${t('purpleScore')}</span>
                    </span>
                    <input type="number" value="${p.scores.purple}" min="0" onchange="updatePlayerScore(${idx}, 'purple', this.value)" class="w-14 bg-surfaceContainer border border-slate-600 rounded-lg text-center text-white font-bold py-1">
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-slate-300 flex items-center space-x-2">
                      <i class="fa-solid fa-award text-teal-400 w-4 text-center"></i>
                      <span>${t('eventsScore')}</span>
                    </span>
                    <input type="number" value="${p.scores.events}" min="0" onchange="updatePlayerScore(${idx}, 'events', this.value)" class="w-14 bg-surfaceContainer border border-slate-600 rounded-lg text-center text-white font-bold py-1">
                  </div>

                  <div class="flex justify-between items-center">
                    <span class="text-slate-300 flex items-center space-x-2">
                      <i class="fa-solid ${isSpirecrestActive ? 'fa-mountain text-amber-600' : 'fa-ship text-blue-400'} w-4 text-center"></i>
                      <span class="truncate max-w-[95px]">${isSpirecrestActive ? t('expeditionScore') : t('journeyScore')}</span>
                    </span>
                    <input type="number" value="${p.scores.journey}" min="0" onchange="updatePlayerScore(${idx}, 'journey', this.value)" class="w-14 bg-surfaceContainer border border-slate-600 rounded-lg text-center text-white font-bold py-1">
                  </div>

                  ${isPearlbrookActive ? `
                    <div class="flex justify-between items-center pt-1.5 border-t border-slate-800">

                      <input type="number" value="${p.scores.pearlOrWonders}" min="0" onchange="updatePlayerScore(${idx}, 'pearlOrWonders', this.value)" class="w-14 bg-surfaceContainer border border-cyan-700/60 rounded-lg text-center text-cyan-200 font-bold py-1">

                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function updatePlayerScore(pIndex, field, val) {
      store.participants[pIndex].scores[field] = parseInt(val) || 0;
      const p = store.participants[pIndex];
      const total = calculatePlayerTotal(p);
      document.getElementById(`total-score-${pIndex}`).innerText = total;
    }

    function resetCalculatorScores() {
      store.participants.forEach(p => {
        p.scores = { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 };
      });
      renderCalculatorUI();
      showToast(t('toastReset'));
    }

    function closeScoreCalculator() {
      document.getElementById('score-modal').classList.add('hidden');
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-surfaceContainer text-white px-4 py-3 rounded-2xl shadow-2xl border border-emerald-500/40 pointer-events-auto flex items-center space-x-2.5 text-xs transition transform translate-y-3 opacity-0 duration-300';
      toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i><span class="font-bold">${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-3', 'opacity-0'), 15);
      setTimeout(() => {
        toast.classList.add('translate-y-3', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function renderApp() {
      const container = document.getElementById('app-container');
      container.innerHTML = '';

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerText = t(key);
      });

      switch (store.currentScreen) {
        case 'HomeScreen':
          container.innerHTML = renderHomeScreen();
          break;
        case 'ExpansionsScreen':
          container.innerHTML = renderExpansionsScreen();
          break;
        case 'PlayersSetupScreen':
          container.innerHTML = renderPlayersSetupScreen();
          break;
        case 'SetupResultScreen':
          container.innerHTML = renderSetupResultScreen();
          break;
        default:
          container.innerHTML = renderHomeScreen();
      }
    }

          <div class="absolute bottom-0 left-0 right-0 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3.5 flex items-center justify-between z-40 shadow-2xl">
            <button onclick="goBackStep()" class="bg-surface hover:bg-surfaceContainer text-slate-300 font-bold py-3 px-6 rounded-xl border border-slate-700 text-xs transition" data-i18n="backBtn">Назад</button>
            <button onclick="navigateTo('PlayersSetupScreen')" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-extrabold py-3 px-7 rounded-xl shadow-lg text-xs transition" data-i18n="continueBtn">Продължи напред</button>
          </div>
        </div>
      `;
    }

    function toggleExpansion(index) {
      if (EVERDELL_DATA.expansions[index].id === "base") return;
      EVERDELL_DATA.expansions[index].isOwned = !EVERDELL_DATA.expansions[index].isOwned;
      sanitizePlayerCritters();
      renderApp();
    }

    function toggleAdvancedModule(enabled) {
      store.advancedModule.enabled = enabled;
      renderApp();
    }

    function getAvailableCritters() {
      let critters = [];
      EVERDELL_DATA.expansions.forEach(exp => {
        if (exp.isOwned && EVERDELL_DATA.crittersByExp[exp.id]) {
          critters = critters.concat(EVERDELL_DATA.crittersByExp[exp.id]);
        }
      });
      return critters;
    }

    function getSelectableCrittersForPlayer(playerIndex) {
      const allCritters = getAvailableCritters();
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.critter);
      return allCritters.filter(c => !usedByOthers.includes(c));
    }

    function getSelectableBigCrittersForPlayer(playerIndex) {
      const usedByOthers = store.participants
        .filter((_, idx) => idx !== playerIndex)
        .map(p => p.bigCritter);
      return EVERDELL_DATA.bigCritters.filter(bc => !usedByOthers.includes(bc));
    }

    function sanitizePlayerCritters() {
      const available = getAvailableCritters();
      const availableBigs = [...EVERDELL_DATA.bigCritters];
      const usedCritters = new Set();
      const usedBigs = new Set();

      store.participants.forEach(p => {
        if (p.critter && available.includes(p.critter) && !usedCritters.has(p.critter)) {
          usedCritters.add(p.critter);
        } else {
          const nextFree = available.find(c => !usedCritters.has(c));
          p.critter = nextFree || available[0];
          usedCritters.add(p.critter);
        }

        if (p.bigCritter && availableBigs.includes(p.bigCritter) && !usedBigs.has(p.bigCritter)) {
          usedBigs.add(p.bigCritter);
        } else {
          const nextFreeBig = availableBigs.find(b => !usedBigs.has(b));
          p.bigCritter = nextFreeBig || availableBigs[0];
          usedBigs.add(p.bigCritter);
        }
      });
    }

    function renderPlayersSetupScreen() {
      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const maxAllowed = isBellfaireActive ? 6 : 4;

      if (store.participants.length > maxAllowed) {
        store.participants = store.participants.slice(0, maxAllowed);
      }
      
      sanitizePlayerCritters();

      const currentCount = store.participants.length;
      const options = Array.from({ length: maxAllowed }, (_, i) => i + 1);

      return `
        <div class="space-y-4 pb-24">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-slate-100" data-i18n="playersTitle">Настройка на участниците</h2>
              <p class="text-xs text-slate-400" data-i18n="playersDesc">Персонализирайте имената, уникалните видове мийпъли и големи животни:</p>
            </div>
            <button onclick="randomizeCritters()" class="bg-amber-950/80 border border-amber-500/50 text-amber-300 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center space-x-1.5 shadow transition hover:bg-amber-900">
              <i class="fa-solid fa-dice text-amber-400"></i>
              <span data-i18n="randomCritters">Случайно</span>
            </button>
          </div>

          <div class="glass-card rounded-2xl border border-slate-700/60 p-3.5 flex items-center justify-between shadow-md">
            <span class="font-bold text-slate-200 text-xs" data-i18n="playerCount">Брой играчи на масата</span>
            <select onchange="updateParticipantCount(parseInt(this.value))" class="bg-surfaceContainer border border-slate-600 rounded-xl px-3.5 py-1.5 text-white font-extrabold text-xs">
              ${options.map(n => `<option value="${n}" ${currentCount === n ? 'selected' : ''}>${n}</option>`).join('')}
            </select>
          </div>

          <div class="space-y-3">
            ${store.participants.map((p, idx) => {
              const selectableCritters = getSelectableCrittersForPlayer(idx);
              const selectableBigs = getSelectableBigCrittersForPlayer(idx);

              return `
                <div class="glass-card rounded-2xl border border-slate-700/70 p-4 space-y-3 shadow-lg">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2.5 flex-1 mr-3">
                      <div class="w-7 h-7 rounded-xl bg-emerald-500/20 text-emerald-300 font-black flex items-center justify-center text-xs border border-emerald-400/40 shadow-inner">${idx + 1}</div>
                      <input type="text" value="${p.name}" oninput="store.participants[${idx}].name = this.value" class="w-full bg-surfaceContainer border border-slate-600 rounded-xl px-3 py-1.5 text-white text-xs font-bold">
                    </div>
                    <div>${getCritterBadgeHtml(p.critter)}</div>
                  </div>

                  <div class="grid grid-cols-1 ${isSpirecrestActive ? 'sm:grid-cols-2' : ''} gap-2.5 pt-2.5 border-t border-slate-700/60">
                    <div>
                      <label class="text-[10px] font-extrabold text-slate-400 block mb-1 uppercase tracking-wider" data-i18n="critterType">Вид мийпъл (Цвят):</label>
                      <select onchange="changePlayerCritter(${idx}, this.value)" class="w-full bg-surfaceContainer border border-slate-600 rounded-xl px-3 py-1.5 text-white text-xs font-medium">
                        ${selectableCritters.map(c => `<option value="${c}" ${p.critter === c ? 'selected' : ''}>${c}</option>`).join('')}
                      </select>
                    </div>

                    ${isSpirecrestActive ? `
                      <div>
                        <label class="text-[10px] font-extrabold text-amber-400 block mb-1 uppercase tracking-wider" data-i18n="bigCritter">Голямо животно (Spirecrest):</label>
                        <select onchange="changePlayerBigCritter(${idx}, this.value)" class="w-full bg-surfaceContainer border border-amber-600/60 rounded-xl px-3 py-1.5 text-amber-200 text-xs font-medium">
                          ${selectableBigs.map(bc => `<option value="${bc}" ${p.bigCritter === bc ? 'selected' : ''}>${bc}</option>`).join('')}
                        </select>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="absolute bottom-0 left-0 right-0 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3.5 flex items-center space-x-3 z-40 shadow-2xl">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-bold py-3 px-4 rounded-xl border border-slate-700 text-xs transition" data-i18n="backBtn">Назад</button>
            <button onclick="generateSetup()" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg text-xs transition" data-i18n="genGameBtn">Генерирай конфигурация</button>
          </div>
        </div>
      `;
    }

    function changePlayerCritter(pIndex, val) {
      store.participants[pIndex].critter = val;
      renderApp();
    }

    function changePlayerBigCritter(pIndex, val) {
      store.participants[pIndex].bigCritter = val;
      renderApp();
    }

    function randomizeCritters() {
      const critters = [...getAvailableCritters()].sort(() => Math.random() - 0.5);
      const bigs = [...EVERDELL_DATA.bigCritters].sort(() => Math.random() - 0.5);

      store.participants.forEach((p, idx) => {
        p.critter = critters[idx % critters.length];
        p.bigCritter = bigs[idx % bigs.length];
      });
      renderApp();
      showToast(t('toastCritters'));
    }

    function updateParticipantCount(count) {
      const current = store.participants;
      if (current.length < count) {
        for (let i = current.length; i < count; i++) {
          current.push({
            name: `${currentLang === 'bg' ? 'Участник' : 'Player'} ${i + 1}`,
            critter: "",
            bigCritter: "",
            scores: { base: 0, tokens: 0, purple: 0, events: 0, journey: 0, pearlOrWonders: 0 }
          });
        }
      } else if (current.length > count) {
        store.participants = current.slice(0, count);
      }
      sanitizePlayerCritters();
      renderApp();
    }

    function generateSetup() {
      const activeExpIds = new Set(EVERDELL_DATA.expansions.filter(e => e.isOwned).map(e => e.id));
      const pCount = store.participants.length;
      
      const neededForestCards = pCount <= 3 ? 3 : 4;

      const availForest = EVERDELL_DATA.forestLocations.filter(f => activeExpIds.has(f.exp));
      const shuffledForest = [...availForest].sort(() => Math.random() - 0.5);
      store.setup.selectedForestLocations = shuffledForest.slice(0, neededForestCards);

      const availEvents = EVERDELL_DATA.specialEvents.filter(e => activeExpIds.has(e.exp));
      const shuffledEvents = [...availEvents].sort(() => Math.random() - 0.5);
      store.setup.selectedEvents = shuffledEvents.slice(0, 4);

      const isPearlbrookActive = activeExpIds.has("pearlbrook");
      if (store.advancedModule.enabled && !isPearlbrookActive) {
        const count = store.advancedModule.randomBasicEventsCount || 2;
        const shuffledBasic = [...EVERDELL_DATA.basicEvents].sort(() => Math.random() - 0.5);
        store.setup.selectedBasicEvents = shuffledBasic.slice(0, count);
      } else {
        store.setup.selectedBasicEvents = [];
      }

      if (activeExpIds.has("pearlbrook")) {
        store.setup.selectedWonders = [...EVERDELL_DATA.wonders].sort(() => Math.random() - 0.5).slice(0, 4);
      } else {
        store.setup.selectedWonders = [];
      }

      if (activeExpIds.has("spirecrest")) {
        store.setup.selectedWeather = [...EVERDELL_DATA.weatherCards].sort(() => Math.random() - 0.5);
        store.setup.selectedDiscoveries = [...EVERDELL_DATA.discoveryCards].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedWeather = [];
        store.setup.selectedDiscoveries = [];
      }

      if (activeExpIds.has("bellfaire")) {
        store.setup.selectedMarkets = [...EVERDELL_DATA.marketTiles].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedMarkets = [];
      }

      if (activeExpIds.has("newleaf")) {
        store.setup.selectedStations = [...EVERDELL_DATA.stationTiles].sort(() => Math.random() - 0.5);
      } else {
        store.setup.selectedStations = [];
      }

      navigateTo('SetupResultScreen');
      showToast(t('toastGen'));
    }

    function renderSetupResultScreen() {
      const pCount = store.participants.length;
      const isSpirecrestActive = EVERDELL_DATA.expansions.find(e => e.id === 'spirecrest')?.isOwned;
      const isPearlbrookActive = EVERDELL_DATA.expansions.find(e => e.id === 'pearlbrook')?.isOwned;
      const isBellfaireActive = EVERDELL_DATA.expansions.find(e => e.id === 'bellfaire')?.isOwned;
      const isNewLeafActive = EVERDELL_DATA.expansions.find(e => e.id === 'newleaf')?.isOwned;

      return `
        <div class="space-y-4 pb-24">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-lg font-extrabold text-slate-100" data-i18n="genGameTitle">Персонализирано разпределение</h2>
              <p class="text-xs text-slate-400">${t('configFor')} ${pCount} ${pCount === 1 ? t('player') : t('players')}</p>
            </div>
            <button onclick="generateSetup()" class="bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-lg transition flex items-center space-x-1.5">
              <i class="fa-solid fa-shuffle text-amber-300"></i>
              <span data-i18n="reloadBtn">Преразпределение</span>
            </button>
          </div>

          <!-- Участници -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
              <i class="fa-solid fa-users text-amber-400"></i>
              <span data-i18n="playerDist">Разпределение по играчи</span>
            </span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${store.participants.map(p => `
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/80 flex items-center justify-between shadow-sm">
                  <div>
                    <div class="font-extrabold text-slate-100 text-xs">${p.name}</div>
                    ${isSpirecrestActive ? `<div class="text-[10px] text-amber-400 font-semibold mt-1">${t('bigCritterLabel')} ${p.bigCritter}</div>` : ''}
                  </div>
                  <div>${getCritterBadgeHtml(p.critter)}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Pearlbrook Wonders -->
          ${isPearlbrookActive && store.setup.selectedWonders.length > 0 ? `
            <div class="glass-card rounded-2xl border border-cyan-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-cyan-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-water text-cyan-400"></i>
                <span data-i18n="wonders">Pearlbrook: Велики чудеса</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedWonders.map(w => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-cyan-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-cyan-200">${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[11px]"><span class="text-slate-400 font-semibold">${t('cost')}</span> ${currentLang === 'bg' ? w.cost : w.costEn}</div>
                    <div class="text-emerald-400 text-[11px] font-medium">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Spirecrest Weather -->
          ${isSpirecrestActive ? `
            <div class="glass-card rounded-2xl border border-amber-600/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-mountain text-amber-400"></i>
                <span data-i18n="weather">Spirecrest: Време и планински маршрути</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedWeather.map(w => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-amber-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-amber-200"><i class="fa-solid fa-cloud-sun mr-1"></i> ${currentLang === 'bg' ? w.seasonBg : w.seasonEn}: ${currentLang === 'bg' ? w.nameBg : w.nameEn}</div>
                    <div class="text-slate-300 text-[11px]">${currentLang === 'bg' ? w.effectBg : w.effectEn}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Bellfaire Markets -->
          ${isBellfaireActive && store.setup.selectedMarkets.length > 0 ? `
            <div class="glass-card rounded-2xl border border-purple-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-purple-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-store text-purple-400"></i>
                <span data-i18n="markets">Bellfaire: Пазарни плочки</span>
              </span>
              <div class="space-y-2">
                ${store.setup.selectedMarkets.map(m => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-purple-800/40 text-xs flex items-center justify-between">
                    <span class="font-extrabold text-purple-200">${currentLang === 'bg' ? m.nameBg : m.nameEn}</span>
                    <span class="text-slate-300 text-[11px] text-right">${currentLang === 'bg' ? m.effectBg : m.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- New Leaf Stations -->
          ${isNewLeafActive && store.setup.selectedStations.length > 0 ? `
            <div class="glass-card rounded-2xl border border-blue-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-blue-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-train text-blue-400"></i>
                <span data-i18n="stations">New Leaf: Централна гара и влакове</span>
              </span>
              <div class="space-y-2">
                ${store.setup.selectedStations.map(s => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-blue-800/40 text-xs flex items-center justify-between">
                    <span class="font-extrabold text-blue-200">${currentLang === 'bg' ? s.nameBg : s.nameEn}</span>
                    <span class="text-slate-300 text-[11px] text-right">${currentLang === 'bg' ? s.effectBg : s.effectEn}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Advanced Basic Events -->
          ${store.advancedModule.enabled && !isPearlbrookActive && store.setup.selectedBasicEvents.length > 0 ? `
            <div class="glass-card rounded-2xl border border-amber-500/40 p-4 space-y-3 shadow-lg">
              <span class="font-extrabold text-xs text-amber-300 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-sliders text-amber-400"></i>
                <span>${t('basicEventsSelected')} (${store.setup.selectedBasicEvents.length})</span>
              </span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${store.setup.selectedBasicEvents.map(b => `
                  <div class="bg-slate-900/90 p-3 rounded-xl border border-amber-800/40 text-xs space-y-1">
                    <div class="font-extrabold text-amber-200">${currentLang === 'bg' ? b.nameBg : b.name} <span class="text-emerald-400">(${b.reward})</span></div>
                    <div class="text-slate-300 text-[11px]"><span class="text-slate-400 font-semibold">${t('req')}</span> ${currentLang === 'bg' ? b.reqBg : b.req}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Forest Locations -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2.5">
              <span class="font-extrabold text-xs text-emerald-400 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-tree text-emerald-400"></i>
                <span data-i18n="forestLoc">Горски локации на партията</span> (${store.setup.selectedForestLocations.length})
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
              ${store.setup.selectedForestLocations.map(f => `
                <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-800/40 flex items-center justify-between shadow-sm">
                  <div>
                    <div class="font-extrabold text-xs text-amber-200">${currentLang === 'bg' ? f.nameBg : f.nameEn}</div>
                    <div class="text-[11px] text-slate-300 mt-0.5">${currentLang === 'bg' ? f.effectBg : f.effectEn}</div>
                  </div>
                  <span class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-xl font-black uppercase tracking-wider">${f.exp}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Special Events -->
          <div class="glass-card rounded-2xl border border-slate-700/60 p-4 space-y-3 shadow-lg">
            <div class="flex items-center justify-between border-b border-slate-700/80 pb-2.5">
              <span class="font-extrabold text-xs text-amber-400 flex items-center space-x-2 uppercase tracking-wide">
                <i class="fa-solid fa-star text-amber-400"></i>
                <span data-i18n="specEvents">Специални събития</span> (4)
              </span>
            </div>
            <div class="grid grid-cols-1 gap-2.5">
              ${store.setup.selectedEvents.map(e => `
                <div class="bg-slate-900/80 p-3.5 rounded-xl border border-amber-800/40 space-y-2 shadow-sm">
                  <div class="flex items-center justify-between">
                    <div class="font-extrabold text-xs text-amber-200">${currentLang === 'bg' ? e.nameBg : e.nameEn}</div>
                    <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-500/30 px-2.5 py-1 rounded-xl font-black uppercase tracking-wider">${e.exp}</span>
                  </div>
                  <div class="text-[11px] text-slate-300"><span class="text-slate-400 font-semibold" data-i18n="req">Изискване:</span> <span class="text-slate-100 font-bold">${currentLang === 'bg' ? e.reqBg : e.reqEn}</span></div>
                  <div class="text-[11px] text-emerald-300 font-semibold bg-emerald-950/50 p-2 rounded-xl border border-emerald-500/20"><span class="text-emerald-400 font-bold">${t('effect')}</span> ${currentLang === 'bg' ? e.rewardBg : e.rewardEn}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="absolute bottom-0 left-0 right-0 bg-darkbg/95 backdrop-blur-md border-t border-slate-800 p-3.5 flex items-center space-x-3 z-40 shadow-2xl">
            <button onclick="goBackStep()" class="flex-1 bg-surface hover:bg-surfaceContainer text-slate-300 font-bold py-3 px-4 rounded-xl border border-slate-700 text-xs transition" data-i18n="backBtn">Назад</button>
            <button onclick="showToast('${t('toastReady')}')" class="flex-1 bg-emerald-700 hover:bg-emerald-600 border border-emerald-400/30 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg text-xs transition">Запази готовност</button>
          </div>
        </div>
      `;
    }

    initParticipants();
    renderApp();
  </script>
</body>
</html>
